<style>
/* ===== Ushuaïa guest identity: true black, red at rest, green means yours, the event's colour leads ===== */
:root{
  --void:#000;--s1:#0B0B0D;--s2:#131316;--s3:#1B1B1F;--s4:#24242A;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);
  --ink:#fff;--ink2:rgba(255,255,255,.74);--mute:rgba(255,255,255,.54);--mute2:rgba(255,255,255,.34);
  --red:#F1442B;--red2:#FF1414;--green:#39FF6A;--amber:#F4B43A;--bad:#FF5A4E;
  --acc:#FFC23A;--acc-rgb:255,194,58;
  --snap:cubic-bezier(.2,.9,.1,1);
  --r:12px;--rs:8px;--rp:999px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --disp:'Anton',Impact,'Arial Narrow',sans-serif;--ui:'Space Grotesk',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
.screen{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#000;overflow:hidden;isolation:isolate}
.app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + var(--sab))}
.app::-webkit-scrollbar{display:none}
.page{padding:0 16px}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.amb{position:fixed;left:50%;top:-140px;width:560px;height:420px;transform:translateX(-50%);pointer-events:none;z-index:0;
  background:radial-gradient(50% 50% at 50% 50%,rgba(var(--acc-rgb),.16),transparent 70%);transition:background .8s}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + var(--sat)) 16px 10px;background:transparent;transition:background .25s}
.hdr::after{content:'';position:absolute;left:0;right:0;top:100%;height:22px;background:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,0));opacity:0;transition:opacity .25s;pointer-events:none}
.hdr.scrolled{background:#000}.hdr.scrolled::after{opacity:1}
.blw{display:block;width:36px;height:36px;animation:bfloat 5.2s ease-in-out infinite;will-change:transform;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.blw .bl{display:block;width:36px;height:36px;overflow:visible;animation:bwobble 3.6s ease-in-out infinite;filter:drop-shadow(0 0 7px rgba(160,107,255,.35)) drop-shadow(0 2px 10px rgba(63,134,255,.25))}
.bf-a{transform-origin:32px 32px;animation:bspin 14s linear infinite}
.bf-b{transform-origin:32px 32px;animation:bspin 21s linear infinite reverse}
.bf-glint{transform-origin:32px 32px;animation:bglint 6.5s cubic-bezier(.45,.05,.2,1) infinite}
.bf-spec{animation:bspec 5.2s ease-in-out infinite}
@keyframes bspin{to{transform:rotate(360deg)}}
@keyframes bglint{0%{transform:rotate(-20deg);opacity:0}8%{opacity:1}42%{transform:rotate(340deg);opacity:1}50%,100%{transform:rotate(340deg);opacity:0}}
@keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes bwobble{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.985)}}
@keyframes bspec{0%,100%{opacity:.9}50%{opacity:.7}}
.hdr-mid{position:absolute;left:50%;top:calc(17px + var(--sat));transform:translateX(-50%);pointer-events:none}
.hdr-mid .ushm{display:block;height:22px;width:auto;margin:0 auto;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.hdr.scrolled .hdr-mid .ushm{opacity:1;transform:none}
.me{display:flex;align-items:center;gap:9px;padding:4px 4px 4px 12px;border-radius:var(--rp);background:#0E0E11;box-shadow:0 0 0 1px var(--line) inset}
.me .mt{text-align:right;line-height:1.1}
.me .mt b{display:block;font-size:13px;font-weight:600}
.me .mt small{font-size:10.5px;color:var(--mute);letter-spacing:.04em}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11.5px/1 var(--ui);letter-spacing:.02em;color:#000;flex:0 0 auto;
  background:linear-gradient(140deg,#fff,rgba(var(--acc-rgb),1));box-shadow:0 0 14px -2px rgba(var(--acc-rgb),.7)}

/* ---------- masthead ---------- */
.mast{position:relative;z-index:1;padding:2px 0 14px;text-align:center}
.lgw{position:relative;display:block;width:clamp(178px,48vw,206px);margin:0 auto}
.lgw::before{content:'';position:absolute;inset:-22% -10%;background:radial-gradient(50% 50% at 50% 55%,rgba(255,64,40,.36),transparent 70%);opacity:.55;animation:ushHalo 4.6s ease-in-out 1.6s infinite;pointer-events:none}
@keyframes ushHalo{0%,100%{opacity:.4}50%{opacity:.7}}
.ushl{position:relative;display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 12px rgba(226,66,44,.5))}
.lgbird{position:absolute;height:auto;overflow:visible;filter:drop-shadow(0 0 12px rgba(226,66,44,.5));animation:birdIn 1.3s cubic-bezier(.25,.75,.25,1) .15s both}
@keyframes birdIn{0%{opacity:0;transform:translate(-30%,-40%) scale(.7) rotate(-14deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.mast-line{margin-top:11px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.mast-line b{color:#fff;font-weight:600}
.mast-sub{margin-top:5px;font-size:12.5px;color:var(--mute)}

/* ---------- event strip ---------- */
.evs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.evs::-webkit-scrollbar{display:none}
.evc{flex:0 0 auto;width:118px;scroll-snap-align:start;text-align:left;padding:10px 11px 11px;border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;position:relative;transition:transform .12s var(--snap),box-shadow .25s}
.evc:active{transform:scale(.97)}
.evc .d{display:block;font:600 10px/1 var(--ui);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.evc .t{display:block;margin-top:7px;font:400 19px/1 var(--disp);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.evc .s{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--ink2)}
.evc .s i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.evc.lock .t{color:var(--mute)}
.evc.lock .s{color:var(--mute2)}
.evc.lock .s svg{width:11px;height:11px}
.evc.on{background:linear-gradient(180deg,rgba(var(--c),.16),rgba(var(--c),.04));box-shadow:0 0 0 1px rgba(var(--c),.7) inset,0 10px 26px -14px rgba(var(--c),.9)}
.evc.on .d{color:rgb(var(--c))}

/* ---------- hero (from the guest app) ---------- */
.evhero{position:relative;margin-top:12px;height:176px;border-radius:var(--r);overflow:hidden;background:#050506;isolation:isolate;
  box-shadow:0 0 0 1px rgba(var(--acc-rgb),.42) inset,0 18px 46px -22px rgba(var(--acc-rgb),.55)}
.eh-art{position:absolute;inset:0;z-index:-1}
.eh-art svg{display:block;width:100%;height:100%}
.eh-veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.82))}
.evhero.photo .eh-veil{background:linear-gradient(90deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,0) 80%),linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.75))}
.eh-ph img{position:absolute;right:0;top:0;height:100%;width:auto;display:block}
.eh-sh{position:absolute;right:0;top:0;height:100%;aspect-ratio:720/748;-webkit-mask-size:100% 100%;mask-size:100% 100%;
  background:linear-gradient(105deg,transparent 40%,rgba(255,236,200,.55) 50%,transparent 60%);background-size:300% 100%;background-position:120% 0;animation:ehShine 5.5s cubic-bezier(.55,0,.35,1) 1s infinite}
@keyframes ehShine{0%{background-position:120% 0}30%,100%{background-position:-60% 0}}
.eh-in{position:absolute;left:15px;right:15px;bottom:13px}
.eh-k{display:block;font:600 11px/1 var(--ui);letter-spacing:.13em;color:var(--acc);text-transform:uppercase}
.eh-t{font:400 clamp(34px,11vw,48px)/.92 var(--disp);color:#fff;margin-top:7px;letter-spacing:.005em;text-shadow:0 0 24px rgba(var(--acc-rgb),.6);text-transform:uppercase}
.eh-s{margin-top:6px;font-size:13px;color:var(--ink2)}
.eh-tag{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:var(--rp);font-size:11.5px;font-weight:600;
  background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.55) inset}
.eh-tag i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.eh-tag.live i{background:var(--red2);box-shadow:0 0 10px var(--red2);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- phase strip ---------- */
.phase{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:11px 13px;border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset}
.phase .pl{font-size:13px;color:var(--ink2);line-height:1.35}
.phase .pl b{color:#fff;font-weight:600}
.phase .pr{flex:0 0 auto;text-align:right}
.phase .pr .n{display:block;font-size:15px;color:var(--amber)}
.phase .pr small{display:block;font-size:10.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

/* ---------- section heads ---------- */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sh h3{font:400 23px/1 var(--disp);letter-spacing:.01em;text-transform:uppercase}
.sh .x{font-size:12px;color:var(--mute)}
.setby{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:4px 8px;border-radius:var(--rp);box-shadow:0 0 0 1px var(--line) inset}
.setby svg{width:11px;height:11px;color:var(--red)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;text-align:left;padding:13px 13px 12px;border-radius:var(--r);background:linear-gradient(180deg,var(--s2),var(--s1));box-shadow:0 0 0 1px var(--line) inset;overflow:hidden;min-height:150px;display:flex;flex-direction:column;transition:transform .12s var(--snap)}
.tile:active{transform:scale(.98)}
.tile.wide{grid-column:1/-1;min-height:0}
.tile .tl{display:flex;align-items:center;justify-content:space-between;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tile .tl svg{width:14px;height:14px;color:var(--mute2)}
.tile .tv{margin-top:auto;padding-top:10px;font:400 30px/.95 var(--disp);letter-spacing:.01em}
.tile .tv small{font:500 12px var(--ui);color:var(--mute);margin-left:4px;letter-spacing:0}
.tile .ts{margin-top:5px;font-size:11.5px;color:var(--ink2);line-height:1.35}
.tile .ts b{color:#fff;font-weight:600}
.tile .gfx{margin-top:12px}
.mini-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mini-tabs i{height:14px;border-radius:3px;box-shadow:0 0 0 1.2px rgba(255,255,255,.35) inset}
.mini-tabs i.booked{background:var(--green);box-shadow:0 0 10px -2px var(--green)}
.mini-tabs i.in{background:var(--green);box-shadow:0 0 12px var(--green)}
.mini-tabs i.sent{background:repeating-linear-gradient(135deg,rgba(244,180,58,.85) 0 3px,rgba(244,180,58,.25) 3px 6px)}
.mini-tabs i.open{box-shadow:0 0 0 1.2px rgba(255,255,255,.75) inset;animation:pulseO 2.4s ease-in-out infinite}
.mini-tabs i.gone{box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 2px,transparent 2px 5px)}
@keyframes pulseO{50%{box-shadow:0 0 0 1.2px rgba(255,255,255,.3) inset}}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.1)}
.dots i.a{background:rgba(255,255,255,.45)}
.dots i.c{background:var(--acc);box-shadow:0 0 6px -1px var(--acc)}
.dots i.in{background:var(--green);box-shadow:0 0 6px -1px var(--green)}
.dots i.ns{background:rgba(255,90,78,.5)}
.spark{display:block;width:100%;height:46px;overflow:visible}
.ring{width:64px;height:64px}
.tile .big{font:400 34px/.9 var(--disp);color:#fff;text-shadow:0 0 22px rgba(var(--acc-rgb),.45)}
.tile .est{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.tile .est.fin{color:var(--green)}
.tile .est i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- link card ---------- */
.card{position:relative;padding:15px;border-radius:var(--r);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset}
.card+.card{margin-top:8px}
.card .ct{font-size:15px;font-weight:600}
.card .cs{margin-top:4px;font-size:12.5px;color:var(--mute);line-height:1.45}
.linkbox{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 12px;border-radius:var(--rs);background:#000;box-shadow:0 0 0 1px var(--line2) inset}
.linkbox svg{flex:0 0 auto;width:16px;height:16px;color:var(--acc)}
.linkbox .u{flex:1;min-width:0;font:500 12.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.linkbox .u span{color:var(--mute)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.acts.two{grid-template-columns:1fr 1fr}
.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 14px;border-radius:var(--rs);font-size:13.5px;font-weight:600;
  background:var(--s3);box-shadow:0 0 0 1px var(--line) inset;transition:transform .12s var(--snap),background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.btn.wa{background:#0f2a18;box-shadow:0 0 0 1px rgba(57,255,106,.28) inset;color:#d6ffe1}
.btn.wa svg{color:#3fe47a}
.btn.pri{height:52px;background:#fff;color:#000;font-size:15px;box-shadow:0 10px 30px -12px rgba(255,255,255,.5)}
.btn.acc{height:52px;background:var(--acc);color:#000;font-size:15px;box-shadow:0 10px 30px -10px rgba(var(--acc-rgb),.8)}
.btn.ghost{background:transparent;box-shadow:0 0 0 1px var(--line2) inset}
.btn.danger{background:transparent;color:var(--bad);box-shadow:0 0 0 1px rgba(255,90,78,.35) inset}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.full{width:100%}
.funnel{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.funnel div{text-align:center}
.funnel b{display:block;font:400 22px/1 var(--disp)}
.funnel small{display:block;margin-top:4px;font-size:10.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.funnel svg{width:14px;height:14px;color:var(--mute2)}
.qrrow{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px;border-radius:var(--rs);background:rgba(255,255,255,.03);box-shadow:0 0 0 1px var(--line) inset;text-align:left;width:100%}
.qrrow .qr{width:54px;height:54px;border-radius:6px;overflow:hidden;background:#fff;flex:0 0 auto;padding:2px}
.qrrow .qr svg{width:100%;height:100%;display:block}
.qrrow b{display:block;font-size:13.5px}
.qrrow small{display:block;margin-top:3px;font-size:12px;color:var(--mute)}
.qrrow .chev{margin-left:auto;width:16px;height:16px;color:var(--mute)}

/* ---------- standing ---------- */
.stand .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.stand .pct{font:400 52px/.85 var(--disp);letter-spacing:.005em}
.stand .pct small{display:block;margin-top:8px;font:500 12.5px var(--ui);color:var(--mute)}
.stand .verdict{text-align:right;font-size:12.5px;color:var(--ink2);line-height:1.35;max-width:58%}
.stand .verdict b{display:block;font:400 18px/1.05 var(--disp);letter-spacing:.02em;text-transform:uppercase;color:var(--green)}
.stand .verdict b.hold{color:#fff}.stand .verdict b.cut{color:var(--bad)}
.scale{position:relative;margin-top:18px;height:36px}
.scale .bar{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,90,78,.55) 0 50%,rgba(255,255,255,.18) 50% 75%,rgba(57,255,106,.6) 75%)}
.scale .tick{position:absolute;top:2px;width:1px;height:20px;background:rgba(255,255,255,.5)}
.scale .tick small{position:absolute;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 10.5px var(--mono);color:var(--mute)}
.scale .knob{position:absolute;top:4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #000,0 0 16px rgba(255,255,255,.8);transition:left .9s var(--snap)}
.rule{margin-top:14px;font-size:12.5px;color:var(--mute);line-height:1.5}
.rule b{color:var(--ink2);font-weight:600}

/* ---------- activity ---------- */
.feed{border-radius:var(--r);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
.fi{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi .ic{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--s3)}
.fi .ic svg{width:15px;height:15px}
.fi .ic.g{background:rgba(57,255,106,.12);color:var(--green)}
.fi .ic.a{background:rgba(244,180,58,.12);color:var(--amber)}
.fi .ic.r{background:rgba(241,68,43,.14);color:var(--red)}
.fi .ic.w{color:#fff}
.fi .ft{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--ink2)}
.fi .ft b{color:#fff;font-weight:600}
.fi .tm{flex:0 0 auto;font:500 11px var(--mono);color:var(--mute2);padding-top:2px}
.fi.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{0%{background:rgba(57,255,106,.14)}100%{background:transparent}}

.contact{display:flex;align-items:center;gap:12px;margin-top:8px}
.contact .ci{flex:1;min-width:0}
.contact .ci b{display:block;font-size:14px}
.contact .ci small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.u-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:#E2422C;color:#fff;font:600 13px var(--ui)}

/* ---------- tables tab ---------- */
.plan-wrap{position:relative;margin-top:12px;border-radius:var(--r);overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,rgba(var(--acc-rgb),.10),transparent 60%),#050506;box-shadow:0 0 0 1px var(--line) inset}
.plan{display:block;width:100%;touch-action:manipulation}
.plan .zb{fill:#0A0A0C;stroke:rgba(255,255,255,.07);stroke-width:1}
.plan .zd{fill:#101013;stroke:rgba(255,255,255,.10);stroke-width:1}
.plan .zd.mine{fill:#131318;stroke:rgba(255,255,255,.2)}
.plan .zl{font:600 9px var(--ui);letter-spacing:.12em;fill:rgba(255,255,255,.3);text-anchor:middle;text-transform:uppercase;pointer-events:none}
.plan .zl.mine{fill:rgba(255,255,255,.7)}
.plan .floor{fill:url(#flG)}
.plan .tb rect{fill:#17171B;stroke:rgba(255,255,255,.07);stroke-width:.8;transition:fill .4s,stroke .4s}
.plan .tb text{font:700 7.2px var(--ui);fill:#000;text-anchor:middle;pointer-events:none}
.plan .tb.mine{cursor:pointer}
.plan .tb.open rect{fill:rgba(255,255,255,.04);stroke:#fff;stroke-width:1.3;animation:pulseT 2.4s ease-in-out infinite}
.plan .tb.open text{fill:#fff}
@keyframes pulseT{50%{stroke-opacity:.35}}
.plan .tb.sent rect{fill:url(#hatchA);stroke:var(--amber);stroke-width:1.2}
.plan .tb.sent text{fill:#fff}
.plan .tb.booked rect{fill:var(--green);stroke:var(--green);filter:url(#glow)}
.plan .tb.waiting rect{fill:rgba(57,255,106,.16);stroke:var(--green);stroke-width:1.2}
.plan .tb.waiting text{fill:var(--green)}
.plan .tb.in rect{fill:var(--green);stroke:#fff;stroke-width:.8;filter:url(#glow)}
.plan .tb.gone rect{fill:url(#hatchG);stroke:rgba(255,255,255,.18);stroke-width:.8}
.plan .tb.gone text{fill:rgba(255,255,255,.45)}
.plan .tb.sel rect{stroke:#fff;stroke-width:2.2}
.plan .arch{fill:none;stroke:#F4B43A;stroke-width:2.2;stroke-dasharray:.1 5.2;stroke-linecap:round;opacity:.85;filter:url(#glowA)}
.plan .arch2{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.8;opacity:.6}
.plan .dj{fill:rgba(241,68,43,.16);stroke:#F1442B;stroke-width:1.1}
.plan .djt{font:400 10px var(--disp);fill:#F1442B;text-anchor:middle;letter-spacing:.06em}
.plan .stl{font:400 13px var(--disp);fill:rgba(255,255,255,.55);text-anchor:middle;letter-spacing:.2em}
.plan .gate rect{fill:#141417;stroke:rgba(255,255,255,.2)}
.plan .gate text{font:500 7.5px var(--mono);fill:rgba(255,255,255,.55);text-anchor:middle}
.plan .gate.mine rect{stroke:var(--acc)}
.plan .gate.mine text{fill:var(--acc)}
.plan-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.plan-bar small{font-size:12px;color:var(--mute)}
.vtog{display:flex;padding:3px;border-radius:var(--rp);background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line2) inset;z-index:2}
.vtog button{padding:7px 12px;border-radius:var(--rp);font-size:12px;font-weight:600;color:var(--ink2)}
.vtog button.on{background:#fff;color:#000}
.plan-hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--mute);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;padding:0 2px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
.legend i{width:16px;height:10px;border-radius:2px}
.lg-open{box-shadow:0 0 0 1.3px #fff inset}
.lg-sent{background:repeating-linear-gradient(135deg,rgba(244,180,58,.9) 0 2px,rgba(244,180,58,.2) 2px 4px);box-shadow:0 0 0 1px var(--amber) inset}
.lg-booked{background:var(--green);box-shadow:0 0 8px -1px var(--green)}
.lg-wait{background:rgba(57,255,106,.16);box-shadow:0 0 0 1.2px var(--green) inset}
.lg-gone{background:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 2px,transparent 2px 4px);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.lg-other{background:#17171B;box-shadow:0 0 0 1px rgba(255,255,255,.1) inset}
.release{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 13px;border-radius:var(--rs);background:rgba(244,180,58,.07);box-shadow:0 0 0 1px rgba(244,180,58,.28) inset}
.release svg{flex:0 0 auto;width:20px;height:20px;color:var(--amber)}
.release p{flex:1;font-size:12.5px;line-height:1.4;color:var(--ink2)}
.release p b{color:#fff;font-weight:600}
.release .n{flex:0 0 auto;font-size:14px;color:var(--amber)}
.tgroup{margin-top:16px}
.tgroup h4{font:600 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 2px 8px}
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 13px;border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;transition:transform .12s var(--snap)}
.trow+.trow{margin-top:6px}
.trow:active{transform:scale(.985)}
.trow .sw{flex:0 0 auto;width:34px;height:24px;border-radius:4px;display:grid;place-items:center;font:600 9.5px var(--ui);color:#000}
.trow .sw.open{box-shadow:0 0 0 1.4px #fff inset;color:#fff}
.trow .sw.sent{background:repeating-linear-gradient(135deg,rgba(244,180,58,.9) 0 3px,rgba(244,180,58,.25) 3px 6px);color:#fff;text-shadow:0 0 4px #000}
.trow .sw.booked,.trow .sw.in{background:var(--green);box-shadow:0 0 12px -3px var(--green)}
.trow .sw.waiting{background:rgba(57,255,106,.16);box-shadow:0 0 0 1.3px var(--green) inset;color:var(--green)}
.trow .sw.gone{background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 2px,transparent 2px 5px);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset;color:var(--mute)}
.trow .tm{flex:1;min-width:0}
.trow .tm b{display:block;font-size:14px;font-weight:600}
.trow .tm small{display:block;margin-top:2px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tr{flex:0 0 auto;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:var(--rp);font-size:11px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{color:var(--green);background:rgba(57,255,106,.1)}
.pill.a{color:var(--amber);background:rgba(244,180,58,.1)}
.pill.w{color:#fff;background:rgba(255,255,255,.08)}
.pill.m{color:var(--mute);background:rgba(255,255,255,.05)}
.pill.r{color:var(--bad);background:rgba(255,90,78,.1)}
.trow .tr small{display:block;margin-top:4px;font:500 11px var(--mono);color:var(--mute)}
.reqcard{display:flex;align-items:center;gap:12px;margin-top:8px}
.reqcard .rc{flex:1;min-width:0}
.reqcard .rc b{display:block;font-size:13.5px}
.reqcard .rc small{display:block;margin-top:2px;font-size:12px;color:var(--mute)}

/* ---------- guests tab ---------- */
.seg{display:flex;gap:4px;padding:4px;border-radius:var(--rp);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:9px 12px;border-radius:var(--rp);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button span{font-family:var(--mono);font-weight:500;color:var(--mute);margin-left:4px}
.seg button.on{background:#fff;color:#000}
.seg button.on span{color:rgba(0,0,0,.55)}
.addbar{display:flex;gap:6px;margin-top:12px}
.inp{width:100%;height:46px;padding:0 14px;border-radius:var(--rs);background:#000;border:0;box-shadow:0 0 0 1px var(--line2) inset;font-size:15px;outline:0;transition:box-shadow .2s}
.inp:focus{box-shadow:0 0 0 1.5px rgba(var(--acc-rgb),.9) inset}
.inp::placeholder{color:var(--mute2)}
textarea.inp{height:140px;padding:12px 14px;resize:none;line-height:1.5}
.addbar .btn{flex:0 0 auto;width:46px;height:46px;padding:0;background:var(--acc);color:#000;box-shadow:0 8px 22px -10px rgba(var(--acc-rgb),.9)}
.addbar .btn svg{width:20px;height:20px}
.subacts{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--mute)}
.subacts button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.cap{margin-top:14px;padding:13px 14px;border-radius:var(--r);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset}
.cap .ch{display:flex;justify-content:space-between;align-items:baseline}
.cap .ch b{font:400 24px/1 var(--disp)}
.cap .ch b small{font:500 12px var(--ui);color:var(--mute);margin-left:4px}
.cap .ch span{font-size:12px;color:var(--mute)}
.cap .cbar{position:relative;height:8px;margin-top:10px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.cap .cbar i{display:block;height:100%}
.cap .cbar .c1{background:var(--green)}.cap .cbar .c2{background:var(--acc)}.cap .cbar .c3{background:rgba(255,255,255,.4)}.cap .cbar .c4{background:rgba(255,90,78,.55)}
.cap .ckey{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:11.5px;color:var(--ink2)}
.cap .ckey span{display:inline-flex;align-items:center;gap:6px}
.cap .ckey i{width:8px;height:8px;border-radius:2px}
.cap .note{margin-top:8px;font-size:12px;color:var(--mute);line-height:1.45}
.search{position:relative;margin-top:14px}
.search svg{position:absolute;left:13px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--mute)}
.search .inp{padding-left:38px;height:42px;font-size:14px;background:var(--s1)}
.glist{margin-top:10px;border-radius:var(--r);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.grow .ga{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font:600 11.5px var(--ui);background:var(--s3);color:var(--ink2)}
.grow .ga.t{background:rgba(57,255,106,.12);color:var(--green)}
.grow .ga.k{background:rgba(var(--acc-rgb),.14);color:var(--acc)}
.grow .gm{flex:1;min-width:0}
.grow .gm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gm small{display:block;margin-top:2px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow.fresh{animation:fresh 1.4s ease-out}
.empty{padding:26px 16px;text-align:center;font-size:13px;color:var(--mute)}
.more{display:block;width:100%;padding:13px;font-size:13px;font-weight:600;color:var(--ink2);border-top:1px solid var(--line)}

/* ---------- earnings ---------- */
.ehero{position:relative;margin-top:6px;padding:18px 16px 16px;border-radius:var(--r);overflow:hidden;background:radial-gradient(90% 120% at 100% 0%,rgba(var(--acc-rgb),.22),transparent 60%),linear-gradient(180deg,var(--s2),var(--s1));box-shadow:0 0 0 1px rgba(var(--acc-rgb),.3) inset}
.ehero .el{font:600 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.ehero .ev{margin-top:10px;font:400 50px/.9 var(--disp);letter-spacing:.005em}
.ehero .ev small{font:500 14px var(--ui);color:var(--mute);margin-right:6px;letter-spacing:0}
.ehero .esp{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ehero .esp div{flex:1}
.ehero .esp b{display:block;font-size:15px;font-weight:600}
.ehero .esp small{display:block;margin-top:3px;font-size:11.5px;color:var(--mute)}
.ehero .esp .g{color:var(--green)}.ehero .esp .a{color:var(--amber)}
.ecard{margin-top:8px;border-radius:var(--r);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
.ecard .eh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px}
.ecard .eh .ed{width:44px;flex:0 0 auto;text-align:center;line-height:1}
.ecard .eh .ed b{display:block;font:400 22px/1 var(--disp)}
.ecard .eh .ed small{display:block;margin-top:3px;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.ecard .eh .en{flex:1;min-width:0}
.ecard .eh .en b{display:block;font:400 19px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.ecard .eh .en small{display:block;margin-top:5px}
.ecard .eh .ea{text-align:right}
.ecard .eh .ea b{display:block;font:500 15px var(--mono)}
.ecard .eh .ea small{display:block;margin-top:3px;font-size:11px;color:var(--mute)}
.ecard .lines{padding:0 14px 14px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.ln b{font:500 13px var(--mono);color:#fff;white-space:nowrap}
.ln small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.ln.tot{font-weight:600;color:#fff}
.ln.tot b{font-size:15px;color:var(--acc)}
.ecard.lock{opacity:.55}
.how{margin-top:10px;padding:14px;border-radius:var(--r);background:transparent;box-shadow:0 0 0 1px var(--line) inset;font-size:12.5px;line-height:1.55;color:var(--mute)}
.how b{color:var(--ink2);font-weight:600}
.agree{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:10px;border-radius:var(--rs);overflow:hidden;background:var(--line)}
.agree div{padding:11px 12px;background:var(--s1)}
.agree small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.agree b{display:block;margin-top:5px;font-size:13.5px;font-weight:600}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + var(--sab));
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.92) 30%);-webkit-backdrop-filter:blur(0);}
.tabbar::before{content:'';position:absolute;left:12px;right:12px;top:12px;bottom:calc(4px + var(--sab));border-radius:20px;background:rgba(14,14,17,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--line) inset,0 16px 40px -10px #000;z-index:-1}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:#fff}
.tabbar button.on::after{content:'';position:absolute;bottom:3px;width:18px;height:2px;border-radius:1px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.tabbar .bdg{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--amber);color:#000;font:600 10px/16px var(--ui);letter-spacing:0}

/* ---------- views ---------- */
.view{position:relative;z-index:1;animation:vin .35s var(--snap)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vh{padding:4px 0 2px}
.vh h2{font:400 34px/.95 var(--disp);text-transform:uppercase;letter-spacing:.005em}
.vh p{margin-top:6px;font-size:13px;color:var(--mute);line-height:1.4}
.vh p b{color:var(--ink2);font-weight:600}
.foot{margin:30px 0 8px;text-align:center;font-size:11px;color:var(--mute2);line-height:1.6}
.foot b{color:var(--mute);font-weight:600}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:90;max-height:92%;display:flex;flex-direction:column;border-radius:22px 22px 0 0;background:#0C0C0E;
  box-shadow:0 0 0 1px var(--line2) inset,0 -30px 60px -20px #000;transform:translateY(105%);transition:transform .38s var(--snap)}
.sheet.on{transform:none}
.sheet .grab{flex:0 0 auto;padding:9px 0 4px;display:grid;place-items:center}
.sheet .grab i{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.sheet .shd{flex:0 0 auto;display:flex;align-items:flex-start;gap:12px;padding:6px 18px 12px}
.sheet .shd .st{flex:1;min-width:0}
.sheet .shd h3{font:400 27px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.sheet .shd p{margin-top:6px;font-size:13px;color:var(--mute);line-height:1.4}
.sheet .x{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s3)}
.sheet .x svg{width:14px;height:14px}
.sheet .sb{flex:1;overflow-y:auto;padding:4px 18px calc(22px + var(--sab));-webkit-overflow-scrolling:touch}
.fld{margin-top:14px}
.fld:first-child{margin-top:0}
.fld label{display:block;margin-bottom:7px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.fld label span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--mute2)}
.step{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 6px;border-radius:var(--rs);background:#000;box-shadow:0 0 0 1px var(--line2) inset}
.step button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s3);font-size:20px;line-height:1}
.step b{font:400 24px var(--disp)}
.step b small{font:500 12px var(--ui);color:var(--mute);margin-left:6px}
.kv{border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;padding:2px 13px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.kv div:first-child{border-top:0}
.kv b{font-weight:600;color:#fff;text-align:right}
.kv b.g{color:var(--green)}.kv b.a{color:var(--amber)}.kv b.c{color:var(--acc)}
.mt{margin-top:14px}.mt8{margin-top:8px}
.fine{margin-top:10px;font-size:12px;color:var(--mute);line-height:1.5}
.tline{position:relative;margin-top:4px;padding-left:22px}
.tline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line2)}
.tline div{position:relative;padding:7px 0;font-size:13px;color:var(--mute)}
.tline div::before{content:'';position:absolute;left:-20px;top:11px;width:9px;height:9px;border-radius:50%;background:#000;box-shadow:0 0 0 1.5px var(--line2)}
.tline div.done{color:#fff}
.tline div.done::before{background:var(--green);box-shadow:0 0 8px var(--green)}
.tline div.now{color:var(--amber)}
.tline div.now::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.tline div small{float:right;font:500 11px var(--mono);color:var(--mute)}
.seats{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.seats i{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1.3px rgba(255,255,255,.25) inset}
.seats i.c{background:var(--acc);box-shadow:none}
.seats i.in{background:var(--green);box-shadow:0 0 8px -2px var(--green)}
.inv{position:relative;margin-top:4px;padding:16px;border-radius:var(--r);overflow:hidden;background:radial-gradient(90% 90% at 100% 0%,rgba(var(--acc-rgb),.28),transparent 60%),#070708;box-shadow:0 0 0 1px rgba(var(--acc-rgb),.45) inset}
.inv .from{display:flex;align-items:center;gap:10px}
.inv .from b{display:block;font-size:13.5px}
.inv .from small{display:block;font-size:11.5px;color:var(--mute)}
.inv h4{margin-top:14px;font:400 30px/.95 var(--disp);text-transform:uppercase}
.inv p{margin-top:6px;font-size:13px;color:var(--ink2);line-height:1.45}
.inv .ft{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.inv .ft div small{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.inv .ft div b{display:block;margin-top:4px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:9px 13px;border-radius:var(--rp);font-size:13px;font-weight:600;background:var(--s2);box-shadow:0 0 0 1px var(--line) inset;color:var(--ink2)}
.chip.on{background:#fff;color:#000}
.chip[disabled]{opacity:.35}
.story{display:block;width:100%;max-width:280px;margin:0 auto;border-radius:14px;box-shadow:0 0 0 1px var(--line2),0 20px 50px -20px rgba(var(--acc-rgb),.6)}
.okmark{display:grid;place-items:center;width:58px;height:58px;margin:4px auto 0;border-radius:50%;background:rgba(57,255,106,.12);color:var(--green);box-shadow:0 0 30px -6px var(--green)}
.okmark svg{width:28px;height:28px}

/* ---------- toast ---------- */
.toasts{position:absolute;left:0;right:0;top:calc(14px + var(--sat));z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:88%;padding:11px 16px;border-radius:var(--rp);background:#fff;color:#000;font-size:13.5px;font-weight:600;box-shadow:0 14px 40px -12px rgba(0,0,0,.8);animation:tin .3s var(--snap),tout .3s ease-in 2.4s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

/* ---------- access gate (first open) ---------- */
.gate-ov{position:absolute;inset:0;z-index:200;background:#000;overflow-y:auto;display:flex;flex-direction:column;padding:calc(26px + var(--sat)) 20px calc(22px + var(--sab));transition:opacity .5s,transform .5s var(--snap)}
.gate-ov.out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-ov .glow{position:absolute;left:50%;top:-120px;width:620px;height:480px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(241,68,43,.24),transparent 70%);pointer-events:none}
.gate-ov .gk{position:relative;margin-top:20px;text-align:center;font:600 11px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.gate-ov .gn{position:relative;margin-top:14px;text-align:center;font:400 54px/.9 var(--disp);text-transform:uppercase;letter-spacing:.005em}
.gate-ov .gp{position:relative;margin:12px auto 0;max-width:320px;text-align:center;font-size:14px;line-height:1.5;color:var(--ink2)}
.gate-ov .gcard{position:relative;margin-top:22px}
.gate-ov .gfine{margin-top:12px;font-size:11.5px;line-height:1.5;color:var(--mute);text-align:center}
.gate-ov .gby{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;padding-top:20px;font-size:11px;color:var(--mute2)}
.gate-ov .gby svg{width:18px;height:18px}
.gate-ov .gin{animation:gin .7s var(--snap) both}
@keyframes gin{from{opacity:0;transform:translateY(14px)}}
.gate-ov .d1{animation-delay:.25s}.gate-ov .d2{animation-delay:.4s}.gate-ov .d3{animation-delay:.55s}.gate-ov .d4{animation-delay:.7s}


.gsig{display:block}
.gsig span{display:block;margin-bottom:7px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gsig .inp{font:italic 500 19px Georgia,'Times New Roman',serif;height:52px}
.btn.ghost svg{width:15px;height:15px}
.pdoc{border-radius:14px;background:#F6F1E6;color:#1A1712;padding:18px 16px 14px;text-align:left}
.pdoc .dh{display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(26,23,18,.14)}
.pdoc .dh small{display:block;font:700 9.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#8A6A2C}
.pdoc .dh h4{margin-top:5px;font:600 19px/1.1 var(--ui)}
.pdoc .ver{font:500 10.5px var(--mono);color:#7B746A}
.pdoc .cl{padding:10px 0 9px;border-bottom:1px solid rgba(26,23,18,.08)}
.pdoc .cl h5{display:flex;gap:8px;font:700 13px var(--ui)}
.pdoc .cl h5 span{font:500 11px var(--mono);color:#8A6A2C;padding-top:2px}
.pdoc .cl p{margin-top:4px;font-size:12.5px;line-height:1.55;color:#3A342B}
.pdoc .sig{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pdoc .sig small{display:block;font:700 9px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#7B746A}
.pdoc .sig b{display:block;margin-top:12px;padding-bottom:3px;border-bottom:1px solid rgba(26,23,18,.35);font:italic 500 16px Georgia,serif;min-height:24px}
.pdoc .sig b.none{font:500 11.5px var(--ui);color:#A59D90}
.pdoc .sig em{display:block;margin-top:4px;font:500 10px var(--mono);font-style:normal;color:#7B746A}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:640px){.screen{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 120px -30px rgba(0,0,0,.7)}}
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="amb" id="amb"></div>
  <div class="app" id="app">
    <header class="hdr" id="hdr">
      <span class="blw" id="bubl" aria-label="bubl" role="img"><svg class="bl" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="bgGlass" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".015"/><stop offset=".7" stop-color="#fff" stop-opacity=".03"/><stop offset=".88" stop-color="#d9d2ff" stop-opacity=".1"/><stop offset=".965" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity=".62"/></radialGradient>
          <radialGradient id="bgRimM" cx="50%" cy="50%" r="50%"><stop offset=".58" stop-color="#000"/><stop offset=".84" stop-color="#fff"/><stop offset="1" stop-color="#fff"/></radialGradient>
          <mask id="bgRim"><circle cx="32" cy="32" r="28" fill="url(#bgRimM)"/></mask>
          <radialGradient id="bgF1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff3b4e" stop-opacity=".95"/><stop offset="1" stop-color="#ff3b4e" stop-opacity="0"/></radialGradient>
          <radialGradient id="bgF2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a06bff" stop-opacity=".95"/><stop offset="1" stop-color="#a06bff" stop-opacity="0"/></radialGradient>
          <radialGradient id="bgF3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3f86ff" stop-opacity=".95"/><stop offset="1" stop-color="#3f86ff" stop-opacity="0"/></radialGradient>
          <radialGradient id="bgF4" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6ff0ff" stop-opacity=".6"/><stop offset="1" stop-color="#6ff0ff" stop-opacity="0"/></radialGradient>

            <g class="bf-b"><ellipse cx="48" cy="46" rx="17" ry="15" fill="url(#bgF2)"/><ellipse cx="18" cy="16" rx="12" ry="10" fill="url(#bgF4)"/></g>

<script>
/* =====================================================================
   USHUAÏA · PROMOTER ACCESS
   The page Ushuaïa Dubai Harbour sends a promoter from BUBL OPS.
   Everything a promoter sends from here (ticket link, table invitation,
   list link) carries their source id, so it lands under their name in
   the OPS promoter filter, the promoter scorecard and the commission.
   Ushuaïa sets the allocation, the rate and the rules; the promoter
   works inside them.
   ===================================================================== */
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AED=n=>'AED '+Math.round(n).toLocaleString('en-US');
const K=n=>n>=1e6?(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':n>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':Math.round(n).toLocaleString('en-US');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const MIN=60e3,HOUR=36e5,DAY=864e5;
const DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const at=s=>new Date(s+'+04:00').getTime();             /* all venue times are Dubai time */
function dub(ms){return new Date(ms+4*HOUR);}              /* read a timestamp as Dubai wall clock via UTC getters */
const fT=ms=>{const d=dub(ms);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');};

/* ---------- QR, from the guest app ---------- */
const QR=(function(){
  const ECC=[0,10,16,26,18,24,16,18,22,22,26],BLK=[0,1,1,1,2,2,4,4,4,5,5];
  function mul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;}
  function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1];}root=mul(root,2);}return r;}
  function rsRem(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f);});}return r;}
  function rawMods(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;}
  function dataCw(v){return Math.floor(rawMods(v)/8)-ECC[v]*BLK[v];}
  function alignPos(v,size){if(v===1)return[];const n=Math.floor(v/7)+2,step=Math.ceil((v*4+4)/(n*2-2))*2,res=[6];for(let p=size-7;res.length<n;p-=step)res.splice(1,0,p);return res;}
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let v=1;for(;v<=10;v++){const cc=v<10?8:16;if(4+cc+bytes.length*8<=dataCw(v)*8)break;}
    if(v>10)throw new Error('too long');
    const cc=v<10?8:16,bits=[];const push=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
    push(4,4);push(bytes.length,cc);bytes.forEach(b=>push(b,8));
    const cap=dataCw(v)*8;push(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    for(let pad=0xEC;bits.length<cap;pad^=0xEC^0x11)push(pad,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
    /* ecc + interleave */
    const nb=BLK[v],el=ECC[v],raw=Math.floor(rawMods(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const e=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(e));}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)cw.push(b[i]);});
    const size=v*4+17,M=[],F=[];for(let y=0;y<size;y++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false));}
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!==2&&d!==4);}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const ap=alignPos(v,size),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}
    const fmt=(mask)=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
      for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
      for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true);};
    fmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)===1,a=size-11+i%3,c=Math.floor(i/3);set(a,c,bit);set(c,a,bit);}}
    /* codewords */
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&i<cw.length*8){M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1;i++;}}}
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&maskFn[m](x,y))M[y][x]=!M[y][x];};
    const penalty=()=>{let p=0,dark=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1;}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1;}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
      for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(M[y][x])dark++;
      p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p;};
    let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const pp=penalty();if(pp<bp){bp=pp;best=m;}apply(m);}
    apply(best);fmt(best);
    return {size,M};
  }
  function svg(text,px){const {size,M}=encode(text),q=4,n=size+q*2;let d='';for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(M[y][x])d+=`M${x+q} ${y+q}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="Ticket QR code"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;}
  return {encode,svg};
})();

function tState(ev,tb){const ph=phaseOf(ev),t=NOW();
  if(ph==='pre'){

    if(tb.st==='open'&&t>ev.release)return 'gone';
    return tb.st;}

  if(tb.st==='open')return 'gone';
  if(tb.st==='sent'&&!tb.openAt&&!tb.mine)return 'gone';
  return (tb.live&&tb.live.in)||tb.mine?'in':'waiting';}
function tPaid(ev,tb){const s=tState(ev,tb);return s==='booked'||s==='in'||s==='waiting';}

  const tixRev=tix.early*GA.early.p+tix.wave*GA.wave.p+tix.vips*GA.vips.p,tixN=tix.early+tix.wave+tix.vips;
  const booked=d.tables.filter(tb=>tPaid(ev,tb)),mins=booked.reduce((a,tb)=>a+minFor(TBL[tb.id],tb.party),0);
  const pend=d.tables.filter(tb=>tState(ev,tb)==='sent'),pendMins=pend.reduce((a,tb)=>a+minFor(TBL[tb.id],tb.party),0);
  const post=phaseOf(ev)==='post',barBase=post&&CONNECTED.pos?booked.reduce((a,tb)=>a+Math.max(0,(tb.spend||0)-minFor(TBL[tb.id],tb.party)),0):0,barC=barBase*ME.bar;

function crowd(ev){const d=DATA[ev.id],ph=phaseOf(ev);
  const booked=d.tables.filter(tb=>tPaid(ev,tb));

  const claimed=d.list.filter(g=>g.claimAt),listIn=ph==='pre'?0:claimed.filter(g=>g.live).length;

    h+=`<div class="sh"><h3>Your ticket link</h3><span class="x">${d.opened} opens</span></div><div class="card"><div class="ct">Every ticket bought here is yours</div><div class="cs">It opens ${esc(ev.short)} with your name on it. Tickets from ${AED(GA.early.p)}; your crowd can also ask you for a table from there.</div>
      <div class="linkbox">${IC.link}<span class="u">${prettyUrl(u)}</span></div>
      <div class="acts"><button class="btn" data-act="copy" data-v="${u}">${IC.copy}Copy</button><button class="btn wa" data-act="waPromo">${IC.wa}WhatsApp</button><button class="btn" data-act="sharePromo">${IC.share}Share</button></div>
      <button class="qrrow" data-act="story"><span class="qr">${QR.svg(u,50)}</span><span><b>Story card with your QR</b><small>For Instagram stories and flyers</small></span><span class="chev">${IC.chev}</span></button>
      <div class="funnel"><div><b>${d.opened}</b><small>Opened</small></div>${IC.arrow}<div><b>${d.orders.length}</b><small>Orders</small></div>${IC.arrow}<div><b>${cv}%</b><small>Bought</small></div></div></div>`;}
  /* standing */
  const showNow=ph==='pre'?ME.lastShow:c.show,vd=verdict(showNow),kn=Math.max(0,Math.min(100,(showNow-.6)/.4*100));
  const nextEv=EVENTS[EVENTS.indexOf(ev)+1],nd=nextEv&&DATA[nextEv.id];
  h+=`<div class="sh"><h3>Your standing</h3><span class="setby">${IC.seal}Ushuaïa's rule</span></div><div class="card stand"><div class="top"><div class="pct">${Math.round(showNow*100)}%<small>${ph==='pre'?'showed last season':ph==='live'?'in so far':'showed tonight'}</small></div>
    <div class="verdict"><b class="${vd.k}">${vd.l}</b>${ph==='post'&&nd?`${esc(nextEv.short)}: ${Math.round(nd.tables.length*(vd.k==='up'?1.2:vd.k==='cut'?.7:1))} tables, ${Math.round(nd.listCap*(vd.k==='up'?1.2:vd.k==='cut'?.7:1))} list spots`:ph==='pre'?'if you keep this up for '+esc(ev.short):'if it ends here'}</div></div>
    <div class="scale"><div class="bar"></div><span class="tick" style="left:50%"><small>80%</small></span><span class="tick" style="left:75%"><small>90%</small></span><span class="knob" style="left:${kn}%"></span></div>
    <p class="rule">Show rate is everyone confirmed through you (table seats, claimed list spots, tickets) against everyone who came through the gates. <b>At 90% or more, Ushuaïa raises your allocation 20% for the next event. Under 80%, it is cut 30%.</b></p></div>`;
  /* activity */
  const feed=liveFeed(ev).slice(0,6);
  h+=`<div class="sh"><h3>${ph==='live'?'At the gates':'Activity'}</h3><span class="x">${ph==='live'?'Live from the scanners':'Latest first'}</span></div><div class="feed">${feed.map((f,i)=>`<div class="fi ${UI.feedFresh&&i===0?'fresh':''}"><span class="ic ${f.c}">${IC[f.ic]}</span><span class="ft">${f.t}</span><span class="tm">${f.tm||ago(f.at)}</span></div>`).join('')}</div>`;
  /* contact */
  h+=`<div class="sh"><h3>Your contact</h3></div><div class="card contact"><span class="u-av">+*</span><span class="ci"><b>${CONTACT.name}</b><small>Holds, changes and anything on the night</small></span><button class="btn wa" data-act="waVenue" style="height:40px">${IC.wa}Message</button></div>`;
  h+=`<p class="foot">Powered by <b>BUBL</b><br>Ushuaïa sees every booking made through your links,<br>the names you add to your list and who comes in.</p></div>`;
  return h;}
function lockedEvent(ev){const o=ev.opens;return `<div class="card" style="margin-top:12px;text-align:center;padding:24px 18px"><div style="width:44px;height:44px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--mute)">${IC.lock.replace('viewBox','width="20" height="20" viewBox')}</div>
  <div class="ct" style="margin-top:12px">Not open to promoters yet</div><div class="cs">Ushuaïa opens ${esc(ev.short)} four weeks before doors, on <b style="color:#fff">${fD(o)}</b>. Your tables and list size are set then, from your standing.</div></div>
  <div class="card" style="margin-top:8px"><div class="ct">What decides your allocation</div><div class="cs">Your show rate across the events before it. Right now you are at <b style="color:var(--green)">${Math.round(ME.lastShow*100)}%</b>, which raises your allocation 20%.</div></div>`;}
function liveFeed(ev){const d=ED(),ph=phaseOf(ev);
  if(ph==='pre')return d.feed.slice().sort((a,b)=>b.at-a.at);
  const items=[];
  d.tables.forEach(tb=>{if(tPaid(ev,tb)&&tLive(tb).in)items.push({tm:tLive(tb).at,ic:'gate',c:'g',t:`<b>${esc(tb.g)}</b>'s table is in at <b>${TBL[tb.id].name}</b>, ${tLive(tb).in} of ${tb.party}`});});
  d.list.filter(g=>g.live).forEach(g=>items.push({tm:g.live,ic:'user',c:'w',t:`<b>${esc(g.n)}</b> came in on your list`}));
  d.orders.filter(o=>o.live).forEach(o=>items.push({tm:o.inAt,ic:'ticket',c:'w',t:`<b>${esc(o.n)}</b> scanned ${o.live} ${GA[o.k].l} ticket${o.live>1?'s':''}`}));
  const cut=fT(NOW());
  return items.filter(x=>ph==='post'||x.tm<=cut||x.tm>'12:00'&&cut<'12:00').sort((a,b)=>(b.tm<'12:00'?'3'+b.tm:b.tm).localeCompare(a.tm<'12:00'?'3'+a.tm:a.tm));}

/* ---------- TABLES ---------- */
function vTables(){const ev=curEv();if(!isOpenEv(ev))return `<div class="page"><div class="vh"><h2>Tables</h2></div>${evStrip()}${lockedEvent(ev)}</div>`;
  const d=ED(),ph=phaseOf(ev),t=NOW(),states=d.tables.map(tb=>({tb,s:tState(ev,tb)}));
  const openN=states.filter(x=>x.s==='open').length;
  let h=`<div class="page"><div class="vh"><h2>Your tables</h2><p><b>${d.tables.length} tables</b> held for you at ${esc(ev.short)}. Send one and the guest books it in your name.</p></div>${evStrip()}`;
  h+=`<div class="plan-bar"><small>Tap one of your tables</small><div class="vtog"><button type="button" class="${UI.planMode==='mine'?'on':''}" data-act="pm" data-v="mine">Your section</button><button type="button" class="${UI.planMode==='all'?'on':''}" data-act="pm" data-v="all">Whole venue</button></div></div><div class="plan-wrap" id="planWrap">${planSVG(ev)}</div>`;
  const leg=ph==='pre'?[['open','Held for you'],['sent','Sent'],['booked','Booked'],['other','Not yours']]:[['booked','In'],['wait','Not in yet'],['gone','Back to Ushuaïa'],['other','Not yours']];

  const groups=ph==='pre'?[['open','Held for you'],['sent','Waiting to be secured'],['booked','Booked']]:[['in','In'],['waiting','Not in yet'],['gone','Went back to Ushuaïa']];
  groups.forEach(([k,l])=>{const rows=states.filter(x=>x.s===k);if(!rows.length)return;
    h+=`<div class="tgroup"><h4>${l} · ${rows.length}</h4>${rows.map(({tb,s})=>tRow(ev,tb,s)).join('')}</div>`;});
  if(ph==='pre'){h+=`<div class="sh"><h3>Need more?</h3></div>`;
    d.requests.forEach(r=>{h+=`<div class="card reqcard"><span class="pill a"><i></i>Waiting</span><span class="rc"><b>${r.n} ${r.tier} table${r.n>1?'s':''}</b><small>Asked ${ago(r.at)} ago${r.note?' · '+esc(r.note):''}</small></span></div>`;});
    h+=`<button class="btn ghost full mt8" data-act="request">${IC.plus}Ask Ushuaïa for more tables</button>`;}
  return h+'</div>';}
function tRow(ev,tb,s){const T=TBL[tb.id],t=NOW();let sub='',right='';
  if(s==='open'){sub=T.T.req?`${T.T.label} · upon request · ${ME.offers.on?'you set the offer':'ask Ushuaïa'}`:`${T.T.label} · up to ${T.T.cap} · ${AED(T.T.min)} minimum`;right=`<span class="pill w"><i></i>Send</span>`;}
  else if(s==='sent'){const due=holdDue(ev,tb);sub=`${esc(tb.g)} · ${tb.party} guests · ${tb.openAt?'opened it':'not opened yet'}`;right=`<span class="pill a"><i></i>${tb.openAt?'Opened':'Sent'}</span><small>${fLeft(due-t)} left</small>`;}
  else if(s==='booked'){sub=`${esc(tb.g)} · ${tb.party} guests · ${tb.claimed} of ${tb.party} named`;right=`<span class="pill g"><i></i>Booked</span><small>${K(minFor(T,tb.party))}</small>`;}
  else if(s==='in'){const lv=tLive(tb);sub=`${esc(tb.g)} · ${lv.in} of ${tb.party} in since ${lv.at}`;right=`<span class="pill g"><i></i>In</span>`+(phaseOf(ev)==='post'&&tb.spend&&CONNECTED.pos?`<small>spent ${K(tb.spend)}</small>`:'');}
  else if(s==='waiting'){sub=`${esc(tb.g)} · ${tb.party} guests · arrive by ${VENUE.arriveBy}`;right=`<span class="pill a"><i></i>Not in</span>`;}
  else {sub=tb.g?`${esc(tb.g)} didn't secure it in time`:`Not sent before ${fDT(ev.release)}`;right=`<span class="pill m"><i></i>Released</span>`;}
  return `<button class="trow" data-act="table" data-v="${tb.id}"><span class="sw ${s}">${short(T)}</span><span class="tm"><b>${T.name}</b><small>${sub}</small></span><span class="tr">${right}</span></button>`;}

/* plan: geometry from Ushuaïa OPS; only the promoter's tables carry colour */
function planBox(ev){const d=ED();if(UI.planMode==='all')return [-282,-8,564,936];
  /* frame the sections the promoter's tables sit in, plus a bit of the floor */
  const secs=SECS.filter(x=>d.tables.some(tb=>TBL[tb.id].sec===x.id));
  let x0=Math.min(...secs.map(x=>x.x))-6,x1=Math.max(...secs.map(x=>x.x+x.w))+40,y0=Math.min(...secs.map(x=>x.y))-8,y1=Math.max(...secs.map(x=>x.y+x.h))+8;
  if(x1<0)x1=Math.min(40,x1+60);if(x0>0)x0=Math.max(-40,x0-60);
  return [x0,y0,x1-x0,y1-y0];}
function fitBox(b,ar){let [x,y,w,h]=b;if(w/h<ar){const nw=h*ar;x-=(nw-w)/2;w=nw;}else{const nh=w/ar;y-=(nh-h)/2;h=nh;}
  return [x,y,w,h];}
function planSVG(ev){const d=ED(),mine={},secMine={};d.tables.forEach(tb=>{mine[tb.id]=tb;secMine[TBL[tb.id].sec]=1;});
  const bx=planBox(ev),ar=UI.planMode==='all'?.62:Math.max(.78,Math.min(1.3,bx[2]/bx[3]));const vb=fitBox(bx,ar);
  let s=`<svg class="plan" id="plan" viewBox="${vb.map(v=>v.toFixed(1)).join(' ')}" style="aspect-ratio:${ar}" aria-label="Floor plan with your tables">
  <defs><pattern id="hatchA" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="rgba(244,180,58,.18)"/><line x1="0" y1="0" x2="0" y2="4" stroke="rgba(244,180,58,.85)" stroke-width="1.6"/></pattern>
  <pattern id="hatchG" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#111114"/><line x1="0" y1="0" x2="0" y2="4" stroke="rgba(255,255,255,.14)" stroke-width="1.4"/></pattern>
  <radialGradient id="flG" cx="50%" cy="20%" r="80%"><stop offset="0" stop-color="${ev.acc}" stop-opacity=".09"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowA" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect class="zb" x="-272" y="0" width="544" height="912" rx="8"/><rect class="floor" x="-112" y="134" width="224" height="770"/>
  <path class="arch2" d="M-150 22 C-150 -6 150 -6 150 22"/><path class="arch" d="M-162 24 C-162 -12 162 -12 162 24"/>
  <text class="stl" x="0" y="18">STAGE</text>`;
  /* stage deck + table blocks */
  s+=`<polygon class="zd ${secMine.bsL||secMine.bsC||secMine.bsR?'mine':''}" points="-268,216 -112,216 -112,134 112,134 112,216 268,216 268,24 -268,24"/>`;
  SECS.filter(x=>!x.id.startsWith('bs')).forEach(x=>{const m=secMine[x.id]?'mine':'';
    if(x.id==='slL')s+=`<polygon class="zd ${m}" points="-118,752 -47,823 -130,906 -270,906 -270,752"/>`;
    else if(x.id==='slR')s+=`<polygon class="zd ${m}" points="118,752 47,823 130,906 270,906 270,752"/>`;
    else s+=`<rect class="zd ${m}" x="${x.x}" y="${x.y}" width="${x.w}" height="${x.h}" rx="4"/>`;});
  SECS.forEach(x=>{const cx=x.x+x.w/2,cy=x.id.startsWith('bs')?36:x.y+11;if(x.id==='bsC')return;s+=`<text class="zl ${secMine[x.id]?'mine':''}" x="${x.id.startsWith('sl')?cx+(x.id==='slL'?-10:10):cx}" y="${x.id.startsWith('sl')?x.y+12:cy}">${x.l}</text>`;});
  s+=`<rect class="dj" x="-23" y="115" width="46" height="24" rx="3"/><text class="djt" x="0" y="131">DJ</text>`;
  /* floor zones */
  [['FRONT',290],['MID',450],['BACK',660],['PLAZA',850]].forEach(([l,y])=>s+=`<text class="zl" x="0" y="${y}" style="font-size:10px;letter-spacing:.3em">${l}</text>`);
  /* gates: G3 is the tables gate */
  [['G1',-150,912],['G3',0,912],['G2',150,912],['G4',272,104]].forEach(([g,x,y])=>s+=`<g class="gate ${g==='G3'?'mine':''}"><rect x="${x-13}" y="${y-7}" width="26" height="14" rx="4"/><text x="${x}" y="${y+3}">${g}</text></g>`);
  /* tables */
  s+='<g id="tabs">';
  TABLES.forEach(t=>{const tb=mine[t.id],st=tb?tState(ev,tb):'';
    s+=`<g class="tb ${tb?'mine '+st:''} ${UI.sel===t.id?'sel':''}" ${tb?`data-act="table" data-v="${t.id}" role="button" aria-label="${t.name}, ${stLabel(st)}"`:''} transform="translate(${t.x} ${t.y}) rotate(${t.r})"><rect x="${-t.w/2}" y="${-t.h/2}" width="${t.w}" height="${t.h}" rx="2"/>${tb?`<text y="2.2" transform="rotate(${-t.r})">${short(t)}</text>`:''}</g>`;});
  return s+'</g></svg>';}

/* ---------- GUESTS ---------- */
function guestRows(ev){const d=ED(),ph=phaseOf(ev),rows=[];
  d.tables.forEach(tb=>{if(!tb.g)return;const s=tState(ev,tb);if(s==='gone'||s==='open')return;const T=TBL[tb.id];
    let pill=s==='sent'?['a',tb.openAt?'Opened':'Sent']:s==='booked'?['g','Booked']:s==='in'?['g','In']:['a','Not in'];
    rows.push({k:'table',n:tb.g,sub:`${T.name} · ${tb.party} guests`+(s==='in'?` · in ${tLive(tb).at}`:''),pill,ref:tb.id,sort:0});});
  d.list.forEach((g,i)=>{let pill;if(ph==='pre')pill=g.claimAt?['g','Claimed']:['m','Not claimed'];else pill=g.claimAt?(g.live?['g','In '+g.live]:['r',"Didn't come"]):['m','Not claimed'];
    rows.push({k:'list',n:g.n,sub:'Promoter list · added '+fD(g.addedAt),pill,ref:i,sort:1,fresh:g._fresh});});
  d.orders.forEach((o,i)=>{const pill=ph==='pre'?['w',o.q+' ticket'+(o.q>1?'s':'')]:o.live?['g',o.live+' of '+o.q+' in']:['r',"Didn't come"];
    rows.push({k:'tix',n:o.n,sub:`${o.q} × ${GA[o.k].l} · ${fD(o.at)}`,pill,ref:i,sort:2});});
  return rows;}
function vGuests(){const ev=curEv();if(!isOpenEv(ev))return `<div class="page"><div class="vh"><h2>Guests</h2></div>${evStrip()}${lockedEvent(ev)}</div>`;

  if(UI.seg==='list'||UI.seg==='all'){const cl=d.list.filter(g=>g.claimAt).length,inn=d.list.filter(g=>g.live).length,L=d.list.length,cap=d.listCap;
    const segs=ph==='pre'?[['c2',cl,'Claimed'],['c3',L-cl,'Not claimed']]:[['c1',inn,'In'],['c4',cl-inn,"Didn't come"],['c3',L-cl,'Not claimed']];
    h+=`<div class="cap"><div class="ch"><b>${ph==='pre'?L:inn}<small>${ph==='pre'?'of '+cap+' list spots':'came on your list'}</small></b><span class="setby">${IC.seal}${cap} set by Ushuaïa</span></div>
      <div class="cbar">${segs.map(([k,v])=>`<i class="${k}" style="width:${v/cap*100}%"></i>`).join('')}</div>
      <div class="ckey">${segs.map(([k,v,l])=>`<span><i class="${k}" style="background:${{c1:'var(--green)',c2:'var(--acc)',c3:'rgba(255,255,255,.4)',c4:'rgba(255,90,78,.55)'}[k]}"></i>${l} ${v}</span>`).join('')}</div>
      <p class="note">Free entry on your list until ${VENUE.listCut}, then the door price (${AED(doorPrice())} now). Each guest claims their spot with their number and gets their own QR.</p></div>`;}
  let list=rows.filter(r=>UI.seg==='all'||r.k===UI.seg);
  if(UI.q){const q=UI.q.toLowerCase();list=list.filter(r=>r.n.toLowerCase().includes(q));}
  list.sort((a,b)=>(b.fresh?1:0)-(a.fresh?1:0)||a.sort-b.sort);

  return h+'</div>';}

/* ---------- EARNINGS ---------- */
function vEarn(){let tot=0,fin=0,est=0;const cards=[];
  EVENTS.forEach(ev=>{const m=money(ev);if(!m){cards.push(lockCard(ev));return;}const ph=phaseOf(ev);tot+=m.total;if(ph==='post')fin+=m.total;else est+=m.total;cards.push(evCard(ev,m,ph));});
  let h=`<div class="page"><div class="vh"><h2>Earnings</h2><p>Worked out by BUBL from your own links and invitations. <b>Paid by Ushuaïa.</b></p></div>
    <div class="ehero"><div class="el">Season 3 so far</div><div class="ev"><small>AED</small>${Math.round(tot).toLocaleString('en-US')}</div>

  x.fillText((DOWS[d.getDay()]+' '+d.getDate()+' '+MONS[d.getMonth()]+' · Doors '+ev.doors).toUpperCase(),80,1010);
  x.letterSpacing='0px';x.fillStyle='#fff';x.shadowColor=`rgba(${ev.rgb},.7)`;x.shadowBlur=50;
  let fs=230;x.font=`400 ${fs}px Anton, Impact, sans-serif`;const title=ev.short.toUpperCase();while(x.measureText(title).width>W-160&&fs>90){fs-=8;x.font=`400 ${fs}px Anton, Impact, sans-serif`;}
  x.fillText(title,80,1010+fs*.98);x.shadowBlur=0;
  x.fillStyle='rgba(255,255,255,.75)';x.font='500 42px "Space Grotesk", sans-serif';x.fillText(ev.tag,80,1010+fs*.98+70);
  /* QR plate */
  const u=urlPromo(ev),{size,M}=QR.encode(u),q=4,n=size+2*q,px=Math.floor(400/n),qs=px*n,qx=80,qy=1330;
  x.fillStyle='#fff';x.beginPath();x.roundRect?x.roundRect(qx-16,qy-16,qs+32,qs+32,26):x.rect(qx-16,qy-16,qs+32,qs+32);x.fill();
  x.fillStyle='#000';for(let yy=0;yy<size;yy++)for(let xx=0;xx<size;xx++)if(M[yy][xx])x.fillRect(qx+(xx+q)*px,qy+(yy+q)*px,px,px);
  const tx=qx+qs+70;x.fillStyle='#fff';x.font='400 76px Anton, Impact, sans-serif';x.fillText('SCAN FOR',tx,qy+90);x.fillText('TICKETS',tx,qy+170);
  x.fillStyle='rgba(255,255,255,.7)';x.font='500 36px "Space Grotesk", sans-serif';x.fillText('From AED '+GA.early.p,tx,qy+240);
  x.fillStyle=ev.acc;x.font='600 34px "Space Grotesk", sans-serif';x.fillText('with '+ME.name,tx,qy+300);
  x.fillStyle='rgba(255,255,255,.4)';x.font='500 28px "JetBrains Mono", monospace';x.textAlign='center';x.fillText(u.replace('https://',''),W/2,H-70);x.textAlign='left';
  return c.toDataURL('image/png');}

function agreementClauses(){const evs=[EV.bc,EV.adr],r=Math.round(ME.rate*100),b=Math.round(ME.bar*100),T=id=>DATA[id].tables.map(tb=>TBL[tb.id].name),A=ME.tixAlloc;
  const tix=id=>`${A[id].early} Early entry, ${A[id].wave} Second wave, ${A[id].vips} VIP standing`;
  return [
  ['Parties','This agreement is between Ushuaïa Dubai Harbour (“the Venue”) and '+ME.name+' (“the Promoter”).'],
  ['Events','The Promoter promotes these events at the Venue: '+evs.map(e=>e.head+', '+fD(e.D)).join('; ')+'. Doors, prices and line-ups are set by the Venue.'],
  ['Allocation','Black Coffee: '+T('bc').length+' tables held for the Promoter ('+T('bc').join(', ')+'), '+tix('bc')+' tickets and '+DATA.bc.listCap+' promoter list spots. Adriatique: '+T('adr').length+' tables ('+T('adr').join(', ')+'), '+tix('adr')+' tickets and '+DATA.adr.listCap+' list spots. Tickets sell through the Promoter’s link at the Venue’s prices; when an allocation is used up, the link stops selling it. List entry is free until '+VENUE.listCut+'.'],
  ['Holds and deposits','Tables the Promoter hasn’t sent to a guest return to the Venue 48 hours before doors. Each invitation holds its table for '+RULES.holdH+' hours, '+RULES.shortHoldH+' hours in the last '+RULES.shortHoldDays+' days, and never past the cut-off '+(RULES.cutoffMin/60)+' hours before doors. '+(ME.settle==='night'?'The guest secures the table by giving their details and settles the minimum on the night':'The guest secures the table by holding '+RULES.depOpts[0]+'% or the full minimum on their card'+(ME.settle==='choice'?', or, where the Promoter chooses, by giving their details and settling the minimum on the night':''))+'. If it isn’t secured in time, the table returns to the Promoter’s holds.'],
  ['How sales are counted','A sale counts for the Promoter when it is made through the Promoter’s own BUBL link or invitation. Each booking is counted once, under one name. The BUBL record is the reference for both parties.'],
  ['Commission','The Venue pays the Promoter '+r+'% of ticket face value and '+r+'% of the minimum spend on tables booked, plus '+b+'% of the bar spend above the minimum on those tables, as recorded by the Venue’s POS. Spend at the open bars by ticket and list guests is not counted, because it can’t be tied to the Promoter. Refunded sales earn nothing. Amounts exclude VAT.'],
  ['Payment','Within '+PAY_DAYS+' days after each event closes, from a statement BUBL produces for both parties.'],

  ['Review','After each event the Venue reviews the Promoter’s show rate: guests confirmed through the Promoter who came through the gates. At 90% or more, the next allocation rises 20%. Under 80%, it falls 30%.'],
  ['Ending the agreement','Either party can end this agreement with 7 days’ written notice. Holds return to the Venue straight away. Commission earned up to that date is still paid.'],
  ['Law','This agreement is governed by the laws of the Emirate of Dubai and the federal laws of the UAE. The courts of Dubai have jurisdiction.']];}
