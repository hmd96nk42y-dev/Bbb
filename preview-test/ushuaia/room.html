:root{--acc:#F4B43A}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .15s;font:600 13px/1 'Space Grotesk',system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.84);border:1px solid #39FF6A;border-radius:6px;padding:6px 9px;white-space:nowrap}
.splab{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .2s;font:600 13px/1 'Space Grotesk',system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.84);border:1px solid #39FF6A;border-radius:6px;padding:6px 9px;white-space:nowrap;z-index:40}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;color:#fff;font:14px system-ui;background:#03040a;padding:24px}
#pills{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pill{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:0;height:22px;padding:0 8px;border-radius:11px;background:rgba(0,0,0,.72);box-shadow:0 0 0 1px rgba(255,255,255,.22) inset;font:600 9.5px/1 'Space Grotesk',sans-serif;letter-spacing:.09em;white-space:nowrap;transition:opacity .2s linear;will-change:transform}
.pill b{font-weight:700}.pill i{font-style:normal;color:#fff;letter-spacing:.02em}
.pill.dim{opacity:.35!important}.pill.hot{box-shadow:0 0 0 1.5px #39FF6A inset,0 0 12px -2px #39FF6A}
#hud{position:absolute;left:10px;top:10px;z-index:6;display:flex;gap:6px;align-items:center;pointer-events:none}
#hud button{pointer-events:auto;height:32px;padding:0 12px;border-radius:16px;border:0;background:rgba(0,0,0,.78);box-shadow:0 0 0 1px rgba(255,255,255,.26) inset;color:#fff;font:600 12.5px/1 'Space Grotesk',sans-serif;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
#hud #hudBack,#hud #hudSwap{display:none}
#hudLab{font:600 12.5px/1 'Space Grotesk',sans-serif;color:#fff}
#hudBack span{color:var(--acc);font-size:15px;margin-top:-1px}
#hud #hudSwap{color:var(--acc)}
body.ro #roland{display:none}
#roland{position:absolute;left:10px;bottom:10px;z-index:8;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#rolAv{width:44px;height:44px;border-radius:50%;border:0;background:#000;box-shadow:0 0 0 1.5px var(--acc),0 0 16px -2px var(--acc);color:#fff;font:400 22px/1 'Anton',Impact,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
#rolAv::after{content:'';position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:#39FF6A;box-shadow:0 0 0 2px #000}
#rolBub{display:none;width:246px;max-width:calc(100vw - 30px);flex-direction:column;background:rgba(10,10,12,.95);border:1px solid rgba(255,255,255,.16);border-top:2px solid var(--acc);border-radius:12px;box-shadow:0 16px 40px -12px rgba(0,0,0,.9);opacity:0;transform:translateY(4px);transition:opacity .15s linear,transform .15s cubic-bezier(.2,.9,.1,1);overflow:hidden}
#rolBub.on{display:flex}#rolBub.show{opacity:1;transform:none}
.rh{display:flex;align-items:center;justify-content:space-between;padding:9px 10px 5px 12px;font:600 13.5px/1 'Space Grotesk',sans-serif;color:#fff}
.rh span{display:inline-flex;align-items:center;gap:6px}.rh i{width:5px;height:5px;border-radius:50%;background:#39FF6A;box-shadow:0 0 6px #39FF6A}
.rh button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.75);font-size:10px;cursor:pointer}
#rolLog{overflow-y:auto;max-height:118px;padding:1px 12px 11px;display:flex;flex-direction:column;gap:6px}
#rolLog::-webkit-scrollbar{width:0}
.rm{font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.88)}
.rm.typ{display:inline-flex;gap:3px;padding:2px 0}.rm.typ i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);animation:rd .9s infinite steps(2)}
.rm.typ i:nth-child(2){animation-delay:.15s}.rm.typ i:nth-child(3){animation-delay:.3s}
@keyframes rd{50%{opacity:.25}}

/* ───────── the screen show · ten visuals, every one on the arch's own cue

var SCUE={tv:0,wave:-1,wb:0,wa:0,w:0};

    for(var y=0;y<240;y+=4)for(var xx=0;xx<400;xx+=4)if(d[(y*400+xx)*4+3]>128)pts.push([(xx-200)/220,(y-120)/220,hash(xx*7+y*13)*2-1,hash(xx*3+y*29+5)*2-1,hash(xx+y*97+9)]);return pts;})();
  var FLAME=(function(){var c=off(8,256),x=c.getContext('2d'),g=x.createLinearGradient(0,256,0,0);g.addColorStop(0,'rgba(255,255,235,1)');g.addColorStop(.18,'rgba(255,190,90,1)');g.addColorStop(.5,'rgba(255,90,20,.9)');g.addColorStop(.8,'rgba(200,20,10,.55)');g.addColorStop(1,'rgba(120,0,0,0)');

  return {
    cue:function(){var c=SCUE;return {tv:c.tv,wave:c.wave,wb:c.wb,wa:c.wa,tc:mix(AMB,WHT,c.w)};},
    white:function(k){return {tv:.5+.8*k,wave:-1,wb:0,wa:0,tc:WHT};},
    /* 2 · arch tunnel: the stage arch repeated into the distance, pushed forward on the kick; each arch's tubes lit by the cue at its depth, so the wave runs down the tunnel */
    tunnel:function(x,T,S,cu){black(x);var cx=W/2,base=H*.92,N=9,adv=(T*.28+S.kick*.03)%1,m=Math.min(1,mean(cu));

        g.addColorStop(0,rgba(c,.55+.05*l));g.addColorStop(1,'rgba(20,2,0,1)');x.fillStyle=g;x.beginPath();x.moveTo(0,H);
        for(var X=0;X<=W;X+=16)x.lineTo(X,yb+Math.sin(X*fr+T*sp+l)*amp+Math.sin(X*fr*2.3-T*sp*.7)*amp*.35);x.lineTo(W,H);x.closePath();x.fill();
        x.fillStyle=rgba(hc,Math.min(1,hi));for(X=8;X<W;X+=48){if(hash(X*31+l*7+Math.floor(T*4))>.55)continue;x.fillRect(X,yb+Math.sin(X*fr+T*sp+l)*amp+Math.sin(X*fr*2.3-T*sp*.7)*amp*.35-1,10,2);}}},
    /* 14 · flame wall: fire licking up from the bottom, jumping on the kick; on the amber bars the wave runs through it left to right */
    flame:function(x,T,S,cu){black(x);for(var i=0;i<128;i++){var n=.5+.25*Math.sin(i*.37+T*5.1)+.15*Math.sin(i*.91-T*7.3)+.1*Math.sin(i*2.3+T*11),
        k=cu.wave>=0?.62+.42*Math.min(1.2,lvl(cu,i/127*4)):.7+.45*S.kick,hgt=H*(.28+.55*n)*k;x.drawImage(FLAME,i*8,H-hgt,9,hgt);}
