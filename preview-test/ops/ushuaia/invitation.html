/* ============ MYTH tokens — true black, red at rest, green means yours, white once per screen ============ */
:root{
  --void:#000;--s1:#0B0B0D;--s2:#131316;--s3:#1B1B1F;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);
  --ink:#fff;--ink2:rgba(255,255,255,.72);--mute:rgba(255,255,255,.55);--mute2:rgba(255,255,255,.36);
  --red:#FF1414;--red-d:var(--acc);--red-a:rgba(var(--acc-rgb),.16);
  --green:#39FF6A;--gold:#F4B43A;
  --snap:cubic-bezier(.2,.9,.1,1);
  --r:8px;--rs:6px;--rp:999px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --disp:'Anton',Impact,'Arial Narrow',sans-serif;--ui:'Space Grotesk',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.screen{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#000;overflow:hidden;isolation:isolate}
.app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.app::-webkit-scrollbar{display:none}
.page{padding:0 18px 40px}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* header */
.hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--sat)) 18px 8px;background:linear-gradient(180deg,rgba(0,0,0,.94) 60%,rgba(0,0,0,0))}
.blw{display:block;width:36px;height:36px;animation:bfloat 5.2s ease-in-out infinite;will-change:transform}
.hdr .bl{display:block;width:36px;height:36px;overflow:visible;animation:bwobble 3.6s ease-in-out infinite;filter:drop-shadow(0 0 7px rgba(160,107,255,.35)) drop-shadow(0 2px 10px rgba(63,134,255,.25))}
.bf-a{transform-origin:32px 32px;animation:bspin 14s linear infinite}
.bf-b{transform-origin:32px 32px;animation:bspin 21s linear infinite reverse}
.bf-glint{transform-origin:32px 32px;animation:bglint 6.5s cubic-bezier(.45,.05,.2,1) infinite}
.bf-spec{animation:bspec 5.2s ease-in-out infinite}
@keyframes bspin{to{transform:rotate(360deg)}}
@keyframes bglint{0%{transform:rotate(-20deg);opacity:0}8%{opacity:1}42%{transform:rotate(340deg);opacity:1}50%,100%{transform:rotate(340deg);opacity:0}}
@keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes bwobble{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.985)}}
@keyframes bspec{0%,100%{opacity:.9}50%{opacity:.7}}
@media(prefers-reduced-motion:reduce){.blw,.hdr .bl,.bf-a,.bf-b,.bf-glint,.bf-spec{animation:none}}
.hdr .night{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.hdr .night b{color:var(--ink);font-weight:500}

/* masthead — the one orchestrated moment: the sign lights up */
.mast{padding:4px 0 20px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mlogo-wrap{display:block;margin:6px auto 0}
.lgw{position:relative;display:block;width:clamp(200px,56vw,236px);margin:0 auto}
.mlogo{display:block;width:100%;height:auto;overflow:visible}
.lg-glow{position:absolute;left:0;top:0;animation:lgbreathe 4.2s ease-in-out infinite;will-change:opacity}
.lg-glow path{fill:var(--acc);transition:fill 1.2s linear}
.lgw[data-c="1"] .lg-glow path{fill:#2F5BFF}.lgw[data-c="2"] .lg-glow path{fill:#9B30FF}
.lg-main{position:relative}
.lgw .hz1{transition:stop-color 1.2s linear}.lgw[data-c="1"] .hz1{stop-color:#5b8cff}.lgw[data-c="2"] .hz1{stop-color:#b27bff}
@keyframes lgbreathe{0%,100%{opacity:.8}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.lg-glow{animation:none}}
.mlogo .neon{animation:ignite 1.2s steps(1) .15s both}
.mast .venue-actions{text-align:left}
.mast-meta{justify-content:center}
.wm{position:relative;font:400 clamp(104px,34vw,150px)/.82 var(--disp);letter-spacing:.005em;color:#fff;margin-left:-4px;
  text-shadow:0 0 6px rgba(255,255,255,.55),0 0 18px rgba(var(--acc-rgb),.95),0 0 44px rgba(var(--acc-rgb),.7),0 0 90px rgba(var(--acc-rgb),.4)}
.wm::before,.wm::after{content:attr(data-text);position:absolute;left:0;top:0;pointer-events:none;text-shadow:none}
.wm::before{color:rgba(var(--acc-rgb),.55);transform:translate(3px,0);clip-path:inset(18% 0 58% 0);animation:glitch 6s steps(1) 2.4s infinite}
.wm::after{color:rgba(255,255,255,.3);transform:translate(-2px,0);clip-path:inset(62% 0 12% 0);animation:glitch 6s steps(1) 2.6s infinite reverse}
@keyframes glitch{0%,92%,100%{opacity:0}93%{opacity:1;transform:translate(4px,0)}95%{opacity:1;transform:translate(-3px,1px)}97%{opacity:0}}
.wm.on{animation:ignite 1.1s steps(1) both}
@keyframes ignite{0%{opacity:0}10%{opacity:1}14%{opacity:.1}22%{opacity:1}26%{opacity:.3}40%,100%{opacity:1}}
.mast-line{margin-top:14px;font-size:15px;font-weight:500;color:var(--ink)}
.mast-meta{margin-top:4px;display:flex;gap:14px;font-size:13px;color:var(--mute)}
.mast-meta .ca{color:var(--ink2);font-variant-numeric:tabular-nums}
.mast-meta .ca b{color:#fff;font-weight:600}

.venue-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.vact{position:relative;height:96px;border-radius:var(--r);overflow:hidden;text-align:left;background:#0b0b0d;box-shadow:0 0 0 1px var(--line) inset;transition:transform .12s var(--snap)}
.vact:active{transform:scale(.97)}
.vact .vbg{position:absolute;inset:0;background-size:cover;background-position:center}
.vact .vsh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.86))}
.vact .vlab{position:absolute;left:11px;right:11px;bottom:9px}
.vact .vname{display:block;font-size:15px;font-weight:600;color:#fff}
.vact .vsub{display:block;font-size:11.5px;color:var(--ink2);margin-top:1px}
.vact .vtag{position:absolute;top:8px;left:9px;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;color:#fff;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:4px}
.vact .vtag i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#bottleTile{position:absolute;right:-4px;top:0;height:100%;width:78%}

/* pickers */
.pickers{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:6px}
.pkr{height:54px;border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 12px;text-align:left;transition:box-shadow .12s linear}
.pkr small{font-size:11px;color:var(--mute)}
.pkr .lbl{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.pkr .lbl.empty{color:var(--mute2);font-weight:500}
.pkr.on{box-shadow:0 0 0 1.5px #fff inset}
.pkpanel{display:none;margin-top:6px;padding:10px;border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset}
.pkpanel.open{display:block;animation:snapin .16s var(--snap)}
@keyframes snapin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.drow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.drow::-webkit-scrollbar{display:none}
.dcard{flex:0 0 58px;height:66px;border-radius:var(--rs);background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dcard .dow{font-size:11px;color:var(--mute)}.dcard .dom{font:400 24px/1 var(--disp)}
.dcard .tag{font-size:9.5px;color:var(--red)}
.dcard.sel{background:#fff;color:#000}.dcard.sel .dow,.dcard.sel .tag{color:#000}
.tmrow,.prow{display:flex;flex-wrap:wrap;gap:6px}
.tpill,.ppill{min-width:62px;height:40px;padding:0 12px;border-radius:var(--rs);background:var(--s2);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.ppill{min-width:44px}
.tpill.sel,.ppill.sel{background:#fff;color:#000}
.tpill[disabled]{opacity:.3;text-decoration:line-through;cursor:default}
.pkhint{font-size:11.5px;color:var(--mute);margin:0 0 8px}
.signin{margin:14px 0 0;font-size:13px;color:var(--mute)}
.signin .lk{color:#fff;font-weight:500;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px;cursor:pointer}

/* section heads */
.sech{font:400 26px/1 var(--disp);letter-spacing:.01em;color:#fff}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-hd span{font-size:12.5px;color:var(--mute)}

/* room */
.room{margin-top:24px}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rtime{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.rtime select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#fff;font:400 30px/1 var(--disp);padding:0 22px 0 0;margin:0;cursor:pointer;outline:none;font-variant-numeric:tabular-nums}
.rtime select option{background:#000;color:#fff;font:500 16px var(--ui)}
.rtime svg{position:absolute;right:0;top:50%;width:13px;height:9px;transform:translateY(-40%);pointer-events:none}
.rtime:focus-within{outline:2px solid #fff;outline-offset:4px;border-radius:4px}
.rnight{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rsub{margin-top:6px;font-size:12.5px;color:var(--mute)}
.tix-row{display:flex;flex-direction:column;align-items:center;gap:9px;margin:6px 0 4px}
.tixbtn{position:relative;isolation:isolate;overflow:hidden;height:58px;min-width:230px;padding:0 34px;border-radius:14px;
  background:linear-gradient(90deg,rgba(var(--acc-rgb),.4),rgba(155,48,255,.4) 50%,rgba(47,91,255,.4));
  font:400 25px/1 var(--disp);letter-spacing:.09em;text-transform:uppercase;color:#fff;
  text-shadow:0 0 6px rgba(255,255,255,.8),0 0 16px rgba(155,48,255,.9);
  box-shadow:-18px 0 30px -12px var(--acc),0 0 30px -10px #9b30ff,18px 0 30px -12px #2f5bff;transition:transform .1s var(--snap)}
.tixbtn:active{transform:scale(.97)}
/* two beams of neon chase each other around the border (rotating conic behind a 2px ring — compositor-only) */
.tixbtn::before{content:'';position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;z-index:-2;
  background:conic-gradient(from 0deg,transparent 0deg 110deg,var(--acc) 150deg,#ff8a80 172deg,#fff 178deg,transparent 180deg,transparent 180deg 290deg,#2f5bff 330deg,#9b30ff 352deg,#fff 358deg,transparent 360deg);
  animation:tixspin 3.2s linear infinite;will-change:transform}
.tixbtn::after{content:'';position:absolute;inset:2px;border-radius:12px;z-index:-1;background:linear-gradient(90deg,#16040a 0%,#0f0418 50%,#050b1c 100%)}
@keyframes tixspin{to{transform:rotate(360deg)}}
.tixbtn span{position:relative}
.tix-sub{font-size:12px;color:var(--ink2);text-align:center}
@media(prefers-reduced-motion:reduce){.tixbtn::before{animation:none}}
/* tickets — classic stub tickets, retro-futurist neon */
.tkt{--neon:#ff2bd6;--neon2:#ffb3f3;position:relative;display:flex;margin:4px 0 18px;border-radius:14px;isolation:isolate;
  background:radial-gradient(120% 80% at 0% 0%,rgba(255,43,214,.26),transparent 60%),linear-gradient(180deg,#1a0620 0%,#0c0310 100%);
  box-shadow:0 0 0 1.5px var(--neon) inset,0 0 16px -2px var(--neon),0 0 46px -8px var(--neon)}
.tkt.blue{--neon:#2e8bff;--neon2:#aad6ff;background:radial-gradient(120% 80% at 0% 0%,rgba(46,139,255,.26),transparent 60%),linear-gradient(180deg,#061329 0%,#030813 100%)}
.tkt .grid{position:absolute;left:0;right:0;bottom:0;height:52%;border-radius:0 0 14px 14px;overflow:hidden;pointer-events:none;z-index:-1}
.tkt .grid::before{content:'';position:absolute;left:-40%;right:-40%;bottom:0;height:160%;transform:perspective(140px) rotateX(58deg);transform-origin:bottom;
  background-image:linear-gradient(var(--neon) 1.2px,transparent 1.2px),linear-gradient(90deg,var(--neon) 1.2px,transparent 1.2px);background-size:100% 16px,24px 100%;opacity:.22;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%);animation:gridrun 1.6s linear infinite;will-change:transform}
@keyframes gridrun{from{transform:perspective(140px) rotateX(58deg) translateY(0)}to{transform:perspective(140px) rotateX(58deg) translateY(16px)}}
@media(prefers-reduced-motion:reduce){.tkt .grid::before{animation:none}}
.tkt::after{content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.tkt-main{position:relative;flex:1;min-width:0;padding:16px 12px 14px 16px}
.tkt-stub{position:relative;width:74px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;padding:14px 4px;border-left:2px dashed var(--neon)}
.tkt-stub::before,.tkt-stub::after{content:'';position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:#0B0B0D;box-shadow:0 0 0 1.5px var(--neon) inset}
.tkt-stub::before{top:-12px}.tkt-stub::after{bottom:-12px}
.tkt-adm{writing-mode:vertical-rl;transform:rotate(180deg);font:400 15px/1 var(--disp);letter-spacing:.18em;color:var(--neon2);text-shadow:0 0 8px var(--neon)}
.tkt-top{display:flex;align-items:center;gap:10px}
.tkt-ic{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;box-shadow:0 0 0 1.5px var(--neon) inset,0 0 12px -2px var(--neon);text-shadow:0 0 8px var(--neon);flex-shrink:0}
.tkt-name{font:400 24px/1 var(--disp);letter-spacing:.02em;background:linear-gradient(180deg,#fff 0%,var(--neon2) 46%,var(--neon) 54%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px var(--neon))}
.tkt-price{margin:12px 0 2px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.tkt-price b{font:400 36px/1 var(--disp);white-space:nowrap;color:#fff;text-shadow:0 0 10px var(--neon),0 0 26px var(--neon)}
.tkt-price span{font-size:12px;color:var(--neon2)}
.tkt ul{list-style:none;margin:8px 0 0}.tkt li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13px;line-height:1.4;color:rgba(255,255,255,.85)}
.tkt li.off{opacity:.38}.tkt li b{color:#fff;font-weight:600}
.tkt li i{width:14px;height:14px;margin-top:2px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1.3px var(--neon) inset,0 0 6px var(--neon)}
.tkt .tk-h{font-size:12px;font-weight:700;color:var(--neon2);margin:8px 0 0}
.tkt .crew{margin-top:10px}
.vstep{display:flex;flex-direction:column;align-items:center;gap:6px}
.vstep button{width:36px;height:32px;border-radius:6px;background:transparent;color:#fff;font-size:18px;font-weight:600;box-shadow:0 0 0 1.5px var(--neon) inset,0 0 10px -3px var(--neon)}
.vstep button[disabled]{opacity:.3}
.vstep b{font:400 30px/1 var(--disp);color:#fff;text-shadow:0 0 10px var(--neon)}
.crew{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.crew input{width:18px;height:18px;accent-color:#fff}
.tk-sum{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 12px}
.tk-sum b{font:400 32px/1 var(--disp)}.tk-sum span{font-size:12.5px;color:var(--ink2);text-align:right;line-height:1.4}
.tkt.done .tkt-main{padding-bottom:16px}
.tk-qr{display:inline-block;margin:12px 0 6px;padding:8px;border-radius:10px;background:#fff;box-shadow:0 0 0 2px var(--neon),0 0 26px -4px var(--neon)}
.tk-qr svg{display:block;width:150px;height:150px}
.tk-ref{font-size:11.5px;color:var(--neon2);letter-spacing:.06em}
.tk-share{margin-top:4px;padding:14px;border-radius:var(--r);background:var(--s2)}
.tk-share b.h{display:block;font:400 22px/1 var(--disp)}
.tk-share p{font-size:13px;line-height:1.45;color:var(--ink2);margin:6px 0 10px}
.tk-share .lbox{margin-bottom:8px}
.tk-earn{font-size:12.5px;color:var(--green);margin-top:8px}
/* tickets: night / arrival / guests inside the sheet */
.tpk-dots{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.tpk-dots i{width:22px;height:4px;border-radius:2px;background:#26262c}
.tpk-dots i.done{background:#fff}.tpk-dots i.on{background:linear-gradient(90deg,var(--acc),#9b30ff,#2f5bff)}
.tpk-dots span{margin-left:6px}
.tpk{padding:4px 0 10px}
.tpk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tpk-grid .dcard{flex:none;width:auto}
.tpk .tpill,.tpk .ppill{height:46px;font-size:15px}
.tpk-chg{margin-left:8px;font-size:12px;color:#fff;text-decoration:underline;text-underline-offset:3px}
/* WhatsApp under Find us */
.wa{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:var(--r);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;cursor:pointer;text-decoration:none;color:#fff}
.wa-ic{width:42px;height:42px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wa-ic svg{width:22px;height:22px}
.wa-t{flex:1;min-width:0}.wa-t b{display:block;font-weight:600}.wa-t span{display:block;font-size:13px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.wa-go{height:36px;padding:0 14px;border-radius:var(--rs);background:#25D366;color:#04210f;font-size:13px;font-weight:700;display:flex;align-items:center}
/* invite card: the night, then the countdown */
.ip-night{margin:16px 0 4px}
.ipn-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ipn-stats div{padding:11px 0 10px 12px;border-left:1px solid var(--line)}.ipn-stats div:first-child{border-left:0;padding-left:0}
.ipn-stats b{display:block;font:400 26px/1 var(--disp);font-variant-numeric:tabular-nums}.ipn-stats span{display:block;font-size:11.5px;color:var(--mute);margin-top:4px}
.ipn-cd{margin-top:14px;text-align:center}
.ipn-cd small{display:block;font-size:12px;color:var(--mute)}
.ipn-clock{display:flex;justify-content:center;align-items:flex-start;gap:6px;margin-top:6px}
.ipn-clock div{min-width:64px}
.ipn-clock b{display:block;font:400 46px/1 var(--disp);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 18px rgba(var(--acc-rgb),.5)}
.ipn-clock i{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:4px}
.ipn-clock em{font:400 40px/1 var(--disp);font-style:normal;color:var(--mute2);padding-top:2px}
.room-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);opacity:.35;transition:opacity .2s linear}
.room-stats.is-on{opacity:1}
.room-stats[hidden]{display:none}
.rs{padding:11px 0 10px;border-left:1px solid var(--line);padding-left:12px}
.rs:first-child{border-left:0;padding-left:0}
.rsn{display:block;font:400 26px/1 var(--disp);font-variant-numeric:tabular-nums}
.rsl{display:block;font-size:11.5px;color:var(--mute);margin-top:4px}
.rs.locked{cursor:pointer}.rs.locked .rsn{filter:blur(5px)}
.bk-ctx{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 8px 8px 12px;border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;margin-bottom:8px}
.bk-ctx .bk-tx{flex:1;min-width:0}
.bk-main{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-sub{display:block;font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-ctx.is-prompt .bk-main{color:var(--ink2);font-weight:500}
.bk-open{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:var(--rs);background:var(--red-a);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.5) inset;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.bk-open i{width:7px;height:7px;background:var(--red);box-shadow:0 0 8px var(--red)}
.bk-ctx.is-prompt .bk-open{display:none}
.bk-ctx.is-pick{box-shadow:0 0 0 1.5px var(--green) inset}
.bk-ctx.is-pick .bk-open{background:rgba(57,255,106,.12);box-shadow:0 0 0 1px rgba(57,255,106,.6) inset}
.bk-ctx.is-pick .bk-open i{background:var(--green);box-shadow:0 0 8px var(--green)}
.rcanvas{position:relative;height:clamp(330px,52vh,470px);margin:0 -18px;overflow:hidden}
.doll-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
.rcanvas .rwait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);transition:opacity .3s linear}
.rcanvas.ready .rwait{opacity:0}
.vtog{position:absolute;bottom:10px;right:12px;z-index:7;display:flex;padding:3px;border-radius:var(--rs);background:rgba(0,0,0,.72);box-shadow:0 0 0 1px var(--line2) inset}
.vtog button{height:28px;padding:0 12px;border-radius:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.vtog button.on{background:#fff;color:#000}
.rleg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--ink2)}
.rleg span{display:inline-flex;align-items:center;gap:6px}
.rleg i{width:10px;height:10px;border-radius:2px}
.rleg .av{background:var(--red);box-shadow:0 0 8px var(--red)}.rleg.avail .av{background:#fff;box-shadow:0 0 8px #fff}.rleg.avail .bsk{display:none}.rleg .bs{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.rleg .pk{background:var(--green);box-shadow:0 0 8px var(--green)}.rleg .tk{background:#2a2a2e}
.rnote{margin-top:8px;font-size:12px;color:var(--mute)}

/* selection summary */
.ssum{display:none;align-items:center;justify-content:space-between;margin-top:18px;padding:12px 12px 12px 14px;border-radius:var(--rs);background:rgba(57,255,106,.07);box-shadow:0 0 0 1.5px var(--green) inset}
.ssum.show{display:flex;animation:snapin .16s var(--snap)}
.ssum .sl{display:flex;align-items:center;gap:10px;min-width:0}
.ssum .chk{width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ssum .chk svg{width:13px;height:13px;stroke:#000;stroke-width:3;fill:none}
.ssum .sn{font-weight:600}.ssum .sm{font-size:12.5px;color:var(--ink2)}
.schg{font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

/* minimum spend — spent and required, always both numbers */
.minsp{margin-top:22px;padding:16px;border-radius:var(--r);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset}
.minsp[hidden]{display:none}
.ms-nums{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:12px;font-variant-numeric:tabular-nums}
.ms-nums b{font:400 32px/1 var(--disp);white-space:nowrap}
.ms-nums span{font-size:14px;color:var(--mute)}
.ms-nums span b{font:600 14px/1 var(--ui);color:#fff}
.ms-bar{position:relative;height:10px;margin-top:12px;border-radius:2px;background:#1c1c20;overflow:visible}
.ms-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--red);box-shadow:0 0 12px rgba(var(--acc-rgb),.7);transition:width .35s var(--snap),background .2s linear}
.ms-bar.met i{background:var(--green);box-shadow:0 0 14px rgba(57,255,106,.7)}
.ms-bar em{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff;left:100%;transition:left .35s var(--snap)}
.ms-bar em::after{content:'min';position:absolute;top:-16px;left:50%;transform:translateX(-50%);font:500 10px/1 var(--ui);color:var(--mute);font-style:normal}
.ms-over{margin-top:10px;font-size:13px;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums;min-height:17px}
.ms-note{margin-top:4px;font-size:13px;line-height:1.45;color:var(--ink2)}

/* buttons */
.btn{height:50px;padding:0 18px;border-radius:var(--rs);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s var(--snap)}
.btn:active{transform:scale(.98)}
.btn.pri{background:#fff;color:#000}
.btn.red{background:var(--red);color:#fff;box-shadow:0 0 22px -4px rgba(var(--acc-rgb),.8)}
.btn.ghost{box-shadow:0 0 0 1px var(--line2) inset;color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.btn.full{width:100%}

/* invite (after booking) */
.inv{display:none;margin-top:22px}
.inv.show{display:block;animation:snapin .16s var(--snap)}
.ilde{font-size:14px;color:var(--ink2);margin-top:6px}
.ipv-btn{width:100%;height:50px;margin:14px 0 10px;border-radius:var(--rs);box-shadow:0 0 0 1px var(--line2) inset;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.ipv-btn svg{width:22px;height:16px}
.lbox{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 12px;border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset}
.lbox .lk{flex:1;font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcpy{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.lcpy svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.7}
.srow{display:grid;grid-template-columns:1.2fr 1fr .7fr .9fr;gap:6px;margin-top:8px}
.sbtn{height:40px;border-radius:var(--rs);font-size:13px;font-weight:600;box-shadow:0 0 0 1px var(--line2) inset}
.sbtn.pri{background:#fff;color:#000;box-shadow:none}
.smsf{display:none;gap:6px;margin-top:8px}.smsf.show{display:flex}
.smsf .num{flex:1;height:42px;border-radius:var(--rs);border:0;background:var(--s1);box-shadow:0 0 0 1px var(--line2) inset;color:#fff;padding:0 12px;outline:none}
.smsf .snd{height:42px;padding:0 14px;border-radius:var(--rs);background:#fff;color:#000;font-weight:600}
.inote{display:flex;gap:8px;margin-top:10px;font-size:12px;line-height:1.45;color:var(--mute)}
.inote i{flex-shrink:0;width:4px;height:4px;margin-top:6px;background:var(--red)}
.idiv{height:1px;background:var(--line);margin:16px 0 12px}
.ghd{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ghd.done{color:var(--green);font-weight:600}
.ptrack{height:4px;margin-top:8px;background:#1c1c20;border-radius:2px;overflow:hidden}
.pfill{height:100%;width:0;background:var(--green);transition:width .3s var(--snap)}
.gfeed{margin-top:8px}
.gempty{font-size:13px;color:var(--mute);padding:8px 0}
.grow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);animation:snapin .16s var(--snap)}
.gav{width:28px;height:28px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font:400 14px/1 var(--disp)}
.gnm{flex:1;font-weight:500}.gwh{font-size:12px;color:var(--mute)}

/* interested — a public wall of real handles */
.intr{margin-top:30px}
.intr[hidden]{display:none}
.intr-sub{margin-top:8px;font-size:14px;line-height:1.45;color:var(--ink2)}
.intf{display:flex;gap:6px;margin-top:12px}
.intf .inw{flex:1;min-width:0;display:flex;align-items:center;height:48px;border-radius:var(--rs);background:var(--s1);box-shadow:0 0 0 1px var(--line2) inset;padding:0 12px}
.intf .inw:focus-within{box-shadow:0 0 0 1.5px #fff inset}
.intf .at{color:var(--mute);margin-right:2px}
.intf input{flex:1;min-width:0;border:0;background:transparent;color:#fff;outline:none;font-size:15px}
.intf .btn{height:48px;padding:0 14px;font-size:14px;flex-shrink:0}
.intr-err{min-height:18px;margin-top:6px;font-size:12.5px;color:#ff6a60}
.intr-wall{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ih{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 4px;border-radius:var(--rp);background:var(--s1);box-shadow:0 0 0 1px var(--line) inset;font-size:12.5px;color:var(--ink2)}
.ih i{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 12px/1 var(--disp);color:#000;font-style:normal}
.ih.me{box-shadow:0 0 0 1px #fff inset;color:#fff}
.ih.more{padding:0 12px;color:var(--mute)}
.ih.can{padding-right:4px}
.ihv{height:24px;margin-left:4px;padding:0 10px;border-radius:999px;background:#fff;color:#000;font-size:11.5px;font-weight:700}
.ihv.done{background:transparent;color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.ihv.wait{background:transparent;color:#ffd166;box-shadow:0 0 0 1px #ffd166 inset;opacity:1}
.ip-int{margin-top:28px}
.intr-foot{margin-top:10px;font-size:12px;color:var(--mute)}

/* socials + map */
.socials{margin-top:30px}
.soc-card{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.soc-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 16px/1 var(--disp);flex-shrink:0}
.soc-body{flex:1;min-width:0}.soc-name{font-weight:600}.soc-handle{font-size:12.5px;color:var(--mute)}
.soc-right{text-align:right}.soc-followers{font-weight:600;font-variant-numeric:tabular-nums}.soc-flabel{font-size:11px;color:var(--mute)}
.soc-follow{margin-top:4px;height:28px;padding:0 12px;border-radius:4px;background:#fff;color:#000;font-size:12px;font-weight:600}
.soc-follow.ing{background:transparent;color:#fff;box-shadow:0 0 0 1px var(--line2) inset}
.lc-loc{margin-top:30px}
.lc-map{position:relative;height:180px;border-radius:var(--r);overflow:hidden;margin-top:12px;background:#0b0b0d;box-shadow:0 0 0 1px var(--line) inset}
.lc-map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;opacity:0;transition:opacity .6s linear;filter:grayscale(1) invert(.92) contrast(1.2) brightness(.8)}
.lc-map iframe.ok{opacity:1}
.lc-pin{position:absolute;left:50%;top:50%;z-index:2;width:18px;height:18px;transform:translate(-50%,-50%);background:var(--red);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.25),0 0 18px var(--red)}
.lc-pin i{position:absolute;inset:-4px;border:1px solid var(--red);animation:pinp 1.6s steps(8) infinite}
@keyframes pinp{to{transform:scale(3);opacity:0}}
.lc-hit{position:absolute;inset:0;z-index:3}
.lc-addr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.lc-addr b{display:block;font-weight:600}.lc-addr span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.lc-open{flex-shrink:0;height:38px;padding:0 14px;border-radius:var(--rs);display:flex;align-items:center;background:#fff;color:#000;font-size:13px;font-weight:600;text-decoration:none}
.lc-alt{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--mute2)}
.lc-alt a{color:var(--ink2);font-size:12px}
.ip-thd{display:flex;align-items:baseline;justify-content:space-between}
.ip-thd b{font:400 22px/1 var(--disp)}
.ip-thd span{font-size:13px;color:var(--mute)}
.foot{margin-top:28px;font-size:11.5px;color:var(--mute2);text-align:center}

/* toast */
.thost{position:fixed;left:0;right:0;bottom:calc(24px + var(--sab));z-index:400;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
body.bar-on .thost{bottom:calc(150px + var(--sab))}
.toast{max-width:90%;padding:10px 14px;border-radius:var(--rs);background:rgba(10,10,12,.96);box-shadow:0 0 0 1px var(--line2) inset,inset 3px 0 0 var(--red);font-size:13.5px;animation:snapin .14s var(--snap)}

/* white frame on key state changes — the UI keeps time with the rig */
.flash{position:fixed;inset:0;z-index:600;background:#fff;pointer-events:none;opacity:0}
.flash.go{animation:flash .22s steps(2,end)}
@keyframes flash{0%{opacity:.5}50%{opacity:0}75%{opacity:.22}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flash{display:none}.mlogo .neon{animation:none}}

/* shared bottom sheet — DJ panel and table offers are one component, two fills */
.msh-scrim{position:absolute;inset:0;z-index:300;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;transition:opacity .16s linear}
.msh-scrim.on{opacity:1;pointer-events:auto}
.msh{position:absolute;left:0;right:0;bottom:0;z-index:301;max-height:88%;display:flex;flex-direction:column;background:#0B0B0D;border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line2),0 -24px 60px rgba(0,0,0,.8);transform:translateY(102%);transition:transform .22s var(--snap)}
.msh.on{transform:none}
.msh-grip{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:8px auto 0;flex-shrink:0}
.msh-hd{display:flex;align-items:flex-start;gap:12px;padding:12px 18px 10px;flex-shrink:0}
.msh-hd .t{flex:1;min-width:0}
.msh-x{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px var(--line2) inset;font-size:13px;color:var(--ink2);flex-shrink:0}
.msh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(18px + var(--sab))}
.msh-body::-webkit-scrollbar{width:0}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--red)}
.tier i{width:8px;height:8px;background:currentColor;box-shadow:0 0 8px currentColor}
.tier.vvip{color:#5B8CFF}.tier.gold{color:#F6C544}.tier.silver{color:#C9CDD6}.tier.high{color:#fff}
.msh h3{font:400 32px/1 var(--disp);margin-top:6px}
.ts-facts{display:grid;grid-template-columns:1.3fr .8fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0 14px}
.ts-facts div{padding:12px 0 11px 12px;border-left:1px solid var(--line)}
.ts-facts div:first-child{border-left:0;padding-left:0}
.ts-facts b{display:block;font:400 22px/1 var(--disp);font-variant-numeric:tabular-nums}
.ts-facts span{display:block;font-size:11.5px;color:var(--mute);margin-top:4px}
.ts-vote{font-size:14px;line-height:1.45;color:var(--ink)}
.ts-vote b{color:var(--red)}
.msh h4{font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 6px}
.offer{padding:11px 0;border-bottom:1px solid var(--line)}
.offer b{display:block;font-weight:600;font-size:14.5px}
.offer span{display:block;font-size:13px;line-height:1.45;color:var(--ink2);margin-top:2px}
.ts-state{margin-top:14px;font-size:13px;color:var(--ink2);min-height:18px}
.ts-state.warn{color:#ff6a60}
.ts-acts{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-top:10px}
/* DJ fill */
.dj-av{width:46px;height:46px;border-radius:50%;padding:2px;background:conic-gradient(var(--red),#fff,var(--red));flex-shrink:0}
.dj-av i{display:flex;width:100%;height:100%;border-radius:50%;background:#000;align-items:center;justify-content:center;font:400 20px/1 var(--disp);font-style:normal}
.dj-sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:4px;font-size:12px;color:var(--mute)}
.live{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--red);white-space:nowrap}
.live b{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 7px var(--red);animation:blink 1s steps(2) infinite}
.dj-now{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--rs);background:var(--s2);margin:4px 0 12px}
.eq{display:flex;align-items:flex-end;gap:3px;height:24px}
.eq b{width:3.5px;height:6px;background:var(--red);animation:eq .6s steps(4) infinite}
.eq b:nth-child(2){animation-delay:.15s}.eq b:nth-child(3){animation-delay:.3s}.eq b:nth-child(4){animation-delay:.05s}.eq b:nth-child(5){animation-delay:.22s}
@keyframes eq{0%,100%{height:5px}50%{height:22px}}
.dj-trk{flex:1;min-width:0}.dj-trk .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dj-trk .g{font-size:12px;color:var(--mute);margin-top:2px}
.vibes{display:flex;flex-wrap:wrap;gap:6px}
.vibe{font-size:12px;color:var(--ink2);padding:6px 10px;border-radius:4px;box-shadow:0 0 0 1px var(--line2) inset}
.vote[hidden]{display:none}
.vote-mine{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 4px;padding:11px 12px;border-radius:var(--rs);background:var(--red-a);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.45) inset;font-size:13px}
.vote-mine b{font:400 22px/1 var(--disp);color:#fff}
.lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lb .rk{width:18px;font:400 18px/1 var(--disp);color:var(--mute)}
.lb:first-child .rk{color:var(--red)}
.lb .tt{flex:1;min-width:0}
.lb .tt b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .tt span{display:block;font-size:12px;color:var(--mute)}
.lb .br{height:3px;margin-top:5px;background:#1c1c20}.lb .br i{display:block;height:100%;background:var(--red);transition:width .3s var(--snap)}
.lb .vn{font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;min-width:34px;text-align:right}
.lb.bump{animation:bump .3s steps(3)}
@keyframes bump{0%{background:rgba(var(--acc-rgb),.25)}100%{background:transparent}}
.vs{display:flex;align-items:center;height:42px;margin:14px 0 6px;padding:0 12px;border-radius:var(--rs);background:var(--s2)}
.vs input{flex:1;border:0;background:transparent;color:#fff;outline:none;font-size:14px}
.trk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.trk .tt{flex:1;min-width:0}.trk b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trk span{font-size:12px;color:var(--mute)}
.vbtn{height:32px;min-width:62px;padding:0 10px;border-radius:4px;background:#fff;color:#000;font-size:12.5px;font-weight:700}
.vbtn.done{background:transparent;color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.vbtn[disabled]{opacity:.35}
.djp-strip{display:flex;gap:10px;overflow-x:auto;margin-top:8px}.djp-strip:empty{display:none}

/* menu sheet */
#menuSheet{max-height:92%}
.mmin{flex-shrink:0;margin:0 18px 10px;padding:12px;border-radius:var(--rs);background:var(--s2)}
.mmin:empty{display:none}
.mmin .mm-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.mmin .mm-top b{font:400 22px/1 var(--disp)}.mmin .mm-top span{font-size:12.5px;color:var(--mute)}.mmin .mm-top span b{font:600 12.5px var(--ui);color:#fff}
.mmin .ms-bar{margin-top:10px;height:8px}
.mmin .mm-note{margin-top:8px;font-size:12px;color:var(--ink2);line-height:1.4}
.mmin .mm-note b{color:var(--green);font-weight:600}
.mmin.hint{font-size:12.5px;line-height:1.45;color:var(--ink2)}
.mpr s{display:block;font-size:11px;color:var(--mute);font-weight:400;text-align:right}
.mtabs{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;flex-shrink:0;scrollbar-width:none}.mtabs::-webkit-scrollbar{display:none}
.mtab{flex-shrink:0;height:34px;padding:0 13px;border-radius:4px;font-size:13px;font-weight:600;color:var(--ink2);box-shadow:0 0 0 1px var(--line2) inset}
.mtab.on{background:#fff;color:#000;box-shadow:none}
.bview{position:relative;height:250px;margin:0 -18px 6px;background:radial-gradient(60% 60% at 50% 60%,rgba(var(--acc-rgb),.18),rgba(0,0,0,0) 70%),#000;touch-action:none}
.bview canvas{position:absolute;inset:0;width:100%;height:100%}
.bview .bcap{position:absolute;left:18px;right:18px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
.bview .bcap b{display:block;font:400 24px/1 var(--disp)}
.bview .bcap span{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.bview .bcap button{pointer-events:auto}
.bview .spin{position:absolute;top:10px;right:14px;font-size:11px;color:var(--mute)}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow.sel{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,0))}
.mthumb{width:40px;height:54px;flex-shrink:0;background-size:contain;background-repeat:no-repeat;background-position:center}
.mrow .mi{flex:1;min-width:0}.mrow{padding:12px 0}.mrow .mnm{font-weight:600;font-size:14.5px}.mrow .mdesc{font-size:12.5px;color:var(--mute);margin-top:2px}
.mpr{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.madd{width:32px;height:32px;border-radius:4px;background:#fff;color:#000;font-size:18px;font-weight:500;flex-shrink:0;line-height:1}
.madd.added{background:var(--green)}
.pkg{padding:14px;margin-bottom:8px;border-radius:var(--rs);background:var(--s2)}
.pkg .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pkg b.n{font:400 22px/1 var(--disp)}
.pkg .pp{text-align:right;font-variant-numeric:tabular-nums}
.pkg .pp b{display:block;font-weight:700;font-size:15px}
.pkg .pp s{display:block;font-size:12px;color:var(--mute)}
.pkg p{font-size:13px;line-height:1.45;color:var(--ink2);margin:8px 0 10px}
.pkg .pf{display:flex;align-items:center;justify-content:space-between}
.pkg .pt{font-size:11.5px;color:var(--mute)}
.mnote{font-size:12.5px;color:var(--mute);margin:2px 0 10px}
.basket-bar{display:flex;align-items:center;gap:12px;padding:12px 18px calc(12px + var(--sab));border-top:1px solid var(--line2);background:#000;flex-shrink:0}
.bb-info{flex:1;min-width:0}.bb-label{font-size:11.5px;color:var(--mute)}.bb-items{font-size:14px;font-weight:600}
.bb-total{font:400 24px/1 var(--disp);font-variant-numeric:tabular-nums}
.bb-prog{height:3px;margin-top:6px;background:#1c1c20}.bb-prog i{display:block;height:100%;width:0;background:var(--red);transition:width .3s var(--snap)}
.bb-prog.met i{background:var(--green)}

/* gallery overlay */
.medo{position:absolute;inset:0;z-index:320;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .14s linear}
.medo.show{opacity:1;pointer-events:auto}
.medo-top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--sat)) 18px 10px}
.medo-top b{font:400 26px/1 var(--disp)}
.medo-top span{display:block;font-size:12px;color:var(--mute);margin-top:4px}
#medClose{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 1px var(--line2) inset}
.media-scroll{flex:1;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px;scrollbar-width:none}
.media-scroll::-webkit-scrollbar{display:none}
.media-card{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column}
.media-card{justify-content:center}.media-card img{width:100%;max-height:66vh;object-fit:contain;border-radius:var(--r);background:#000}
.media-card p{margin-top:12px;font-size:14px;line-height:1.45;color:var(--ink2)}
.media-card p b{color:#fff;font-weight:600}
.media-dots{display:flex;justify-content:center;gap:6px;padding:12px 0 calc(16px + var(--sab))}
.media-dots span{width:6px;height:6px;background:#333}.media-dots span.on{background:var(--red)}

/* guest details modal */
.ginfo-backdrop{position:absolute;inset:0;z-index:420;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .14s linear}
.ginfo-backdrop.show{opacity:1;pointer-events:auto}
.ginfo-card{width:100%;padding:18px 18px calc(18px + var(--sab));background:#0B0B0D;border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line2);transform:translateY(20px);transition:transform .2s var(--snap)}
.ginfo-backdrop.show .ginfo-card{transform:none}
.ginfo-hed{font:400 28px/1 var(--disp)}
.ginfo-sub{font-size:13.5px;color:var(--ink2);margin:6px 0 14px}
.ginfo-label{display:block;font-size:12px;color:var(--mute);margin:10px 0 6px}
.ginfo-input{width:100%;height:50px;border:0;border-radius:var(--rs);background:var(--s2);color:#fff;padding:0 14px;font-size:16px;outline:none;box-shadow:0 0 0 1px var(--line) inset}
.ginfo-input:focus{box-shadow:0 0 0 1.5px #fff inset}
.ginfo-input.err{box-shadow:0 0 0 1.5px #ff6a60 inset}
.ginfo-errtxt{display:none;margin-top:10px;font-size:12.5px;color:#ff6a60}.ginfo-errtxt.show{display:block}
.ginfo-tc{display:flex;gap:10px;align-items:flex-start;margin:14px 0 14px;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.ginfo-tc input{width:18px;height:18px;margin-top:1px;accent-color:#fff;flex-shrink:0}
.ginfo-tc a{color:#fff;text-decoration:underline}
.ginfo-sum{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ginfo-sum b{color:#fff}

/* iOS-style SMS banner */
.ios-nb{position:absolute;left:8px;right:8px;top:calc(8px + max(var(--sat),var(--sat-host,0px)));z-index:500;display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:18px;background:rgba(40,40,44,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;transform:translate3d(0,-150%,0);transition:transform .38s cubic-bezier(.3,1.3,.4,1);touch-action:none;cursor:grab}
.ios-nb.nb-in{transform:none}.ios-nb.drag{transition:none}
.ios-nb-ic svg{width:36px;height:36px;display:block}
.ios-nb-body{flex:1;min-width:0}
.ios-nb-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}.ios-nb-time{color:rgba(255,255,255,.6);font-weight:400}
.ios-nb-msg{font-size:13.5px;line-height:1.35;margin-top:2px}.ios-nb-sub{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:3px}

/* docked host bar (Geo) */
.mgrbar{position:fixed;left:0;right:0;bottom:0;z-index:300;max-width:480px;margin:0 auto;transform:translateY(130%);transition:transform .22s var(--snap);background:#0B0B0D;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;padding:9px 12px calc(9px + var(--sab));display:flex;flex-direction:column;gap:8px}
.mgrbar.on{transform:none}
body.bar-on .page{padding-bottom:172px}
.mgrbar.kb{padding-bottom:9px}
.mgrbar-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.mgrbar-chips::-webkit-scrollbar{display:none}
.mgrbar-chip{flex:0 0 auto;height:32px;padding:0 12px;border-radius:4px;font-size:12.5px;font-weight:500;color:#fff;box-shadow:0 0 0 1px var(--line2) inset;white-space:nowrap}
.mgrbar-row{display:flex;align-items:center;gap:8px}
.mgrbar-in{flex:1;min-width:0;height:42px;border:0;border-radius:var(--rs);background:var(--s2);color:#fff;padding:0 14px;font-size:15px;outline:none}
.mgrbar-in::placeholder{color:var(--mute2)}
.mgrbar-in:focus{box-shadow:0 0 0 1.5px #fff inset}
.mgrbar-send{width:42px;height:42px;border-radius:var(--rs);background:#fff;color:#000;font-size:18px;font-weight:700}
.mgrbar-call{width:42px;height:42px;border-radius:var(--rs);box-shadow:0 0 0 1px var(--line2) inset;display:flex;align-items:center;justify-content:center;color:#fff}
#connOvr{position:fixed;inset:0;z-index:9995;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .14s linear}
#connOvr.on{opacity:1;pointer-events:auto}
.conn-card{display:flex;align-items:center;gap:14px;background:#0B0B0D;box-shadow:0 0 0 1px var(--line2) inset,inset 3px 0 0 var(--red);border-radius:var(--r);padding:16px 20px}
.conn-spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.conn-tx b{display:block;font-size:14px}.conn-tx span{display:block;font-size:12px;color:var(--mute);margin-top:2px}

/* returning guest (VIP) */
.vp-scrim{position:absolute;inset:0;z-index:290;background:rgba(0,0,0,.66);opacity:0;transition:opacity .16s linear}.vp-scrim.on{opacity:1}
.vp-sheet{position:absolute;left:0;right:0;bottom:0;z-index:291;border-radius:14px 14px 0 0;padding:10px 18px calc(var(--sab) + 22px);background:#0B0B0D;box-shadow:0 -1px 0 var(--line2);transform:translateY(105%);transition:transform .22s var(--snap)}
.vp-sheet.on{transform:none}

/* ============ USHUAÏA — black base, the event's colour on top, flame on the tickets ============ */
:root{--acc:#FFC23A;--acc-rgb:255,194,58;--a2:#FF5A1F;--a3:#FFF1D0;--on:#000;--ush:#E2422C;
  --red:var(--acc);--red-d:var(--acc);--red-a:rgba(var(--acc-rgb),.16)}
.lgw{position:relative;display:block}
.lgw::before{content:'';position:absolute;inset:-18% -8%;background:radial-gradient(50% 50% at 50% 55%,rgba(255,64,40,.38),transparent 70%);opacity:.5;animation:ushHalo 4.6s ease-in-out 1.6s infinite;pointer-events:none;will-change:opacity}
@keyframes ushHalo{50%{opacity:1}}
.ushl{position:relative;display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 12px rgba(226,66,44,.5));animation:ushIn .7s ease-out .3s both}
.lgbird{position:absolute;height:auto;overflow:visible;filter:drop-shadow(0 0 12px rgba(226,66,44,.5));will-change:transform,opacity;backface-visibility:hidden;animation:birdIn 1.3s cubic-bezier(.25,.75,.25,1) .15s both}
@keyframes birdIn{0%{transform:translate3d(-330%,55%,0) rotate(-16deg) scale(.72);opacity:0}10%{opacity:1}45%{transform:translate3d(-150%,-30%,0) rotate(9deg) scale(.86)}78%{transform:translate3d(-28%,8%,0) rotate(-5deg) scale(.98)}100%{transform:translate3d(0,0,0) rotate(0) scale(1);opacity:1}}
@keyframes ushIn{0%{opacity:0}100%{opacity:1}}
.lgw{width:clamp(190px,54vw,232px)}
@keyframes ushGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(226,66,44,.42))}50%{filter:drop-shadow(0 0 24px rgba(255,74,44,.85))}}
@media(prefers-reduced-motion:reduce){.ushl,.lgbird,.lgw::before{animation:none}}
.btn.red{background:var(--acc);color:var(--on);box-shadow:0 0 22px -4px rgba(var(--acc-rgb),.75)}

/* Roland's bar steps aside whenever a sheet or form is up, so it never covers a button */
body:has(.vp-sheet.on) .mgrbar.on,body:has(.msh.on) .mgrbar.on,body:has(.ginfo-backdrop.show) .mgrbar.on,body.ipv-open .mgrbar.on{transform:translateY(120%);pointer-events:none}

/* arrival and guests leave the pickers: the night is all you choose up top */
#pkTime,#pkParty,#pnTime,#pnParty{display:none!important}
.pickers{display:grid!important;grid-template-columns:1fr!important}
/* Find your table: guests, then budget */
.bud-gh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.bud-gh b{font:400 22px/1 Anton,Impact,sans-serif;letter-spacing:.02em;color:var(--acc);text-transform:none}.bud-gh b.off{color:var(--ink2)}
.bud-guests{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.bud-guests::-webkit-scrollbar{display:none}
.bgp{flex:0 0 auto;min-width:42px;height:38px;border-radius:19px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:#fff;font-weight:600;font-size:14px}
.bgp.sel{background:var(--acc);border-color:var(--acc);color:var(--on)}

/* Find your table wears the tickets flame: two neon beams chasing the border, an ember fill, glowing type */
.bud{position:relative;isolation:isolate;overflow:hidden;border-radius:16px;background:transparent;box-shadow:-18px 0 34px -16px #ff3b1f,0 0 38px -14px #ff8a1f,18px 0 34px -16px #ffd23f}

  background:conic-gradient(from 0deg,transparent 0deg 100deg,#8f0e0a 128deg,#ff3b1f 152deg,#ff9a2a 168deg,#fff2c2 178deg,transparent 180deg,transparent 180deg 280deg,#b3120f 304deg,#ff6a1f 332deg,#ffd23f 352deg,#fff6d6 358deg,transparent 360deg);
  animation:tixspin 5s linear infinite;will-change:transform}

  background:radial-gradient(120% 55% at 0% 0%,rgba(255,59,31,.22),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(255,138,31,.12),transparent 60%),linear-gradient(180deg,#1c0503 0%,#0e0402 100%)}

.bud .bud-gh span{color:rgba(255,214,170,.72)}

.bud .bgp.sel,.bud .bud-pre button.on,.bud .bud-chip.on{background:linear-gradient(90deg,#ff3b1f,#ff8a1f 55%,#ffd23f);color:#1a0503;border-color:transparent;box-shadow:0 0 16px -2px #ff8a1f,0 0 4px #ffd23f}

/* Find your table: the same neon, in the room's section colours (Backstage red, VIP magenta, Platinum violet, Gold warm white, Silver blue) */

/* table votes: pre-order and song vote, in the table's section colour */
.vote{--vt:#fff;margin-top:16px;padding:14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 0 28px -18px var(--vt)}

.vt-sec{margin-top:12px}.vt-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}

.vt-add{display:flex;gap:8px;margin-top:10px}.vt-add input{flex:1;height:42px;border-radius:10px;border:0;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;color:#fff;padding:0 12px;font-size:14px}

/* guests: fit the card, two neat rows, nothing hanging off the edge */

.bgp{min-width:0!important;width:100%;height:36px;padding:0;font-size:13.5px}

.bud-ft{display:flex;justify-content:flex-end;margin-top:12px}

  background:linear-gradient(90deg,#FF2D2D,#FF4FC8 35%,#9A6BFF 70%,#6FD2FF);box-shadow:0 0 18px -4px #FF4FC8,0 0 26px -10px #6FD2FF}
.bud-go svg{width:16px;height:16px}.bud-go:active{transform:scale(.97)}
/* booked: the page becomes the host's night; tickets, pickers and Find your table step aside */

let beads='';for(let i=0;i<40;i++){const a=i/40*Math.PI*2;beads+=`<circle cx="${(cx+Math.cos(a)*19.6).toFixed(2)}" cy="${(cy+Math.sin(a)*19.6).toFixed(2)}" r=".62" fill="url(#bd${k})"/>`;}
const mono=I.ini.length>1?`<tspan>${I.ini[0]}</tspan><tspan dx="-1.2">${I.ini[1]}</tspan>`:I.ini,fs=I.ini.length>1?18.5:24;
const T=(f,o,dx,dy)=>`<text x="${cx}" y="${cy+.9}" text-anchor="middle" dominant-baseline="central" font-family="Anton,Impact,sans-serif" font-style="normal" font-weight="400" font-size="${fs}" fill="${f}" opacity="${o}" transform="translate(${dx} ${dy})">${mono}</text>`;
return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><defs>
<pattern id="pap${k}" patternUnits="userSpaceOnUse" width="85" height="85"><image href="${paper()}" width="85" height="85"/></pattern>
<linearGradient id="fl${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1f"/><stop offset="1" stop-color="#111113"/></linearGradient>
<linearGradient id="fs${k}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#151517"/><stop offset="1" stop-color="#0e0e10"/></linearGradient>
<linearGradient id="fb${k}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#18181b"/><stop offset="1" stop-color="#0c0c0e"/></linearGradient>
<linearGradient id="gi${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a80"/><stop offset=".5" stop-color="#FF1414"/><stop offset="1" stop-color="#d00a0f"/></linearGradient>
<filter id="fsh${k}" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2.2" stdDeviation="2.6" flood-color="#000" flood-opacity=".75"/></filter>
<radialGradient id="wx${k}" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ff7a70"/><stop offset=".45" stop-color="#ff1a1a"/><stop offset="1" stop-color="#b8060b"/></radialGradient>
<radialGradient id="wf${k}" cx=".6" cy=".66" r=".8"><stop offset="0" stop-color="#ff2a2a"/><stop offset="1" stop-color="#d40a10"/></radialGradient>
<linearGradient id="rim${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a0206"/><stop offset=".5" stop-color="#ff1a1a"/><stop offset="1" stop-color="#ffc4be"/></linearGradient>
<linearGradient id="bd${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a0306"/><stop offset="1" stop-color="#ffb4ac"/></linearGradient>
<filter id="sb${k}" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="gl${k}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8"/></filter></defs>
<rect width="${W}" height="${H}" fill="#0d0d0f"/>
<path d="M0 0 L0 ${H} L${cx-W*.08} ${tip-6} Z" fill="url(#fs${k})"/><path d="M${W} 0 L${W} ${H} L${cx+W*.08} ${tip-6} Z" fill="url(#fs${k})"/>
<path d="M0 ${H} L${cx} ${TY-H*.07} L${W} ${H} Z" fill="url(#fb${k})" filter="url(#fsh${k})"/>
<path d="M0 0 L${W} 0 L${cx} ${tip} Z" fill="url(#fl${k})" filter="url(#fsh${k})"/>
<path d="M16 14 L${cx} ${tip-11} L${W-16} 14" fill="none" stroke="url(#gi${k})" stroke-width="1" stroke-linejoin="round" opacity=".9"/>
<rect width="${W}" height="${H}" fill="url(#pap${k})"/>

${I.from?`<g class="ip-fromg"><text x="${cx}" y="${Math.max(58,Math.round(TY*.24))}" text-anchor="middle" font-family="Space Grotesk,system-ui,sans-serif" font-weight="500" font-size="10.5" letter-spacing="2.6" fill="#ffffff" fill-opacity=".42">FROM</text><text x="${cx}" y="${Math.max(58,Math.round(TY*.24))+23}" text-anchor="middle" font-family="Space Grotesk,system-ui,sans-serif" font-weight="500" font-size="17" fill="#ffffff" fill-opacity=".88">${esc(I.from.name)}</text></g>`:''}
<g class="ip-hintg ip-go" opacity=".95"><text x="${cx+15}" y="${hy}" text-anchor="middle" font-family="Space Grotesk,system-ui,sans-serif" font-weight="500" font-size="14" fill="#ffffff" fill-opacity=".6">Swipe across the seal to open</text>
<path d="M${cx-134} ${hy-5} h22 m-5 -4.5 l5 4.5 -5 4.5" fill="none" stroke="#FF1414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(${cx} ${cy}) scale(${s.toFixed(3)}) translate(${-cx} ${-cy})">
<ellipse cx="${cx}" cy="${cy+2}" rx="34" ry="38" fill="#ff1a1a" opacity=".55" filter="url(#sb${k})"/>
<g transform="translate(${cx} ${cy}) scale(.08) translate(${-(LOGO_V.bb[0]+LOGO_V.bb[2])/2} ${-(LOGO_V.bb[1]+LOGO_V.bb[3])/2})">
<g transform="translate(26 38)"><path d="${LOGO_V.bird}" fill="#3a0003" fill-rule="evenodd" opacity=".85"/><path d="${LOGO_V.wing}" fill="#3a0003" fill-rule="evenodd" opacity=".85"/></g>
<g transform="translate(-12 -14)"><path d="${LOGO_V.bird}" fill="#ffc4be" fill-rule="evenodd" opacity=".55"/><path d="${LOGO_V.wing}" fill="#ffc4be" fill-rule="evenodd" opacity=".55"/></g>
<path d="${LOGO_V.bird}" fill="url(#wx${k})" fill-rule="evenodd"/><path d="${LOGO_V.wing}" fill="url(#wx${k})" fill-rule="evenodd"/></g>

</g></svg>`;}
function fiber(k,rev){const pts=rev?JAG.slice().reverse():JAG,off=k==='t'?-1:1;
return `<path class="ip-fib ${rev?'rv':'fw'}" d="M${pts.map(a=>a[0].toFixed(1)+' '+(a[1]+off).toFixed(1)).join(' L')}" fill="none" stroke="#FF1414" stroke-opacity=".7" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>`;}
function buildEnv(I){
const r=R.getBoundingClientRect();W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
CX=W/2;TY=Math.round(H*.47);SR=Math.max(36,Math.min(56,Math.min(W,H)*.11));
const rr=rnd(1987),n=Math.max(28,Math.round(W/7));JAG=[];
for(let i=0;i<=n;i++){const x=i/n*W,s=Math.abs(x-CX)<SR*1.02,a=s?SR*.1:2.3;JAG.push([x,TY+(i===0||i===n?0:(rr()-.5)*2*a+(s?(i%2?SR*.07:-SR*.07):0))]);}
[['t','.ip-pt'],['b','.ip-pb']].forEach(([k,sel])=>{const pc=q(sel),cl=pc.querySelector('.ip-clip');cl.innerHTML=envSVG(k,I);
const o=pc.querySelector('.ip-fibers');if(o)o.remove();
pc.insertAdjacentHTML('beforeend',`<svg class="ip-fibers" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">${fiber(k,false)}${fiber(k,true)}</svg>`);});
const rj=JAG.slice().reverse();
q('.ip-pt .ip-clip').style.clipPath='polygon(0px 0px,'+W+'px 0px,'+rj.map(a=>a[0].toFixed(1)+'px '+Math.min(H,a[1]+1).toFixed(1)+'px').join(',')+')';
q('.ip-pb .ip-clip').style.clipPath='polygon(0px '+H+'px,'+W+'px '+H+'px,'+rj.map(a=>a[0].toFixed(1)+'px '+(a[1]-.2).toFixed(1)+'px').join(',')+')';
const tr=q('svg.ip-trail');tr.setAttribute('viewBox',`0 0 ${W} ${H}`);
tr.innerHTML=`<defs><linearGradient id="ipTg" x1="0" x2="1"><stop offset="0" stop-color="#FF1414" stop-opacity="0"/><stop offset=".5" stop-color="#FF1414" stop-opacity=".9"/><stop offset="1" stop-color="#FF1414" stop-opacity="0"/></linearGradient></defs><path d="M18 ${TY} L${W-18} ${TY}" stroke="url(#ipTg)" stroke-width="1" stroke-dasharray="3 6" fill="none"/>`;
q('.ip-track').style.top=TY+'px';q('.ip-spill').style.setProperty('--ty',TY+'px');
}
function draw(){
const pT=q('.ip-pt'),pB=q('.ip-pb'),px=dir>0?W:0;
pT.style.transformOrigin=pB.style.transformOrigin=px+'px '+TY+'px';
pT.style.transform=`skewY(${(dir*p*4.6).toFixed(3)}deg) translateY(${(-p*3).toFixed(2)}px)`;
pB.style.transform=`skewY(${(-dir*p*1.7).toFixed(3)}deg) translateY(${(p*2).toFixed(2)}px)`;
const f=Math.min(1,p*1.4);
qa('.ip-fib.fw').forEach(e=>e.style.strokeDashoffset=dir>0?1-f:1);qa('.ip-fib.rv').forEach(e=>e.style.strokeDashoffset=dir<0?1-f:1);
q('.ip-spill').style.opacity=Math.min(1,p*1.5).toFixed(3);
if(!cracked&&p>.5){cracked=true;try{navigator.vibrate&&navigator.vibrate(12);}catch(_){}}
}
function springBack(){const p0=p,t0=performance.now();(function f(t){if(!R)return;const k=Math.min(1,(t-t0)/380);p=p0*(1-(1-Math.pow(1-k,3)));draw();
if(k<1)requestAnimationFrame(f);else{p=0;cracked=false;dir=0;q('.ip-env').classList.remove('tearing');}})(t0);}
function autoTear(){if(st!=='sealed')return;dir=1;q('.ip-env').classList.add('tearing');const t0=performance.now();
(function f(t){if(!R)return;const k=Math.min(1,(t-t0)/760);p=k<1?k*k*(3-2*k)*.92:1;draw();if(k<1)requestAnimationFrame(f);else openEnv();})(t0);}
function openEnv(){
if(st!=='sealed')return;st='opening';p=1;draw();
const pT=q('.ip-pt'),pB=q('.ip-pb'),e='cubic-bezier(.55,.06,.68,.19)';
pT.animate([{transform:pT.style.transform},{transform:`translate(${-dir*24}px,${-(TY+180)}px) rotate(${-dir*8}deg)`}],{duration:900,easing:e,fill:'forwards'});
pB.animate([{transform:pB.style.transform},{transform:`translate(${dir*10}px,${H-TY+180}px) rotate(${dir*3}deg)`}],{duration:960,delay:50,easing:e,fill:'forwards'});
q('.ip-spill').animate([{opacity:1},{opacity:0}],{duration:900,delay:250,fill:'forwards'});
setTimeout(()=>{if(!R)return;st='open';R.classList.remove('sealed');R.classList.add('open');},240);
setTimeout(()=>{if(!R)return;const s=q('.ip-stage');if(s)s.remove();if(!ipFrame)mountVenue();},950);
}
function releaseBooking(){
if(typeof dollFrame!=='undefined'&&dollFrame){try{dollFrame.remove();}catch(_){}dollFrame=null;dollReady=false;
if(dollUrl){try{URL.revokeObjectURL(dollUrl);}catch(_){}dollUrl=null;}}
}
function ipPaintV(v){if(!R)return;qa('.ip-vtog button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.ip-vtog button');if(!b)return;ipPost({cmd:'setView',view:b.dataset.v});ipPaintV(b.dataset.v);});
function ipPost(m){try{ipFrame&&ipFrame.contentWindow&&ipFrame.contentWindow.postMessage(Object.assign({source:'ush-host'},m),'*');}catch(_){}}
function mountVenue(){
if(!R)return;const host=q('.ip-venue');
releaseBooking();
if(ipFrame){try{ipFrame.remove();}catch(_){}}if(ipUrl){try{URL.revokeObjectURL(ipUrl);}catch(_){}ipUrl=null;}
spotSent=false;tries++;host.classList.remove('ready');
ipFrame=document.createElement('iframe');
ipFrame.className='doll-frame';
ipFrame.title='Ushuaïa, with your table lit';
ipFrame.setAttribute('scrolling','no');
var _html=null;try{_html=parent&&parent.__invVenue?parent.__invVenue():null;}catch(_){}
if(!_html){const w=host.querySelector('.ip-wait');if(w)w.textContent='The 3D room opens on the guest\u2019s link';ipFrame=null;return;}
if(location.protocol==='file:'){ipFrame.srcdoc=_html;}
else{try{ipUrl=URL.createObjectURL(new Blob([_html],{type:'text/html'}));ipFrame.src=ipUrl;}catch(_e){ipFrame.srcdoc=_html;}}
host.insertBefore(ipFrame,host.firstChild);
}
function onVenueMsg(ev){
const d=ev.data;if(!R||!ipFrame||!d||d.source!=='ush-venue'||ev.source!==ipFrame.contentWindow)return;
if(!spotSent){spotSent=true;
ipPost({cmd:'readonly',on:true});
const I0=info();if(I0.table)ipPost({cmd:'book',id:I0.table.id});if(R)q('.ip-venue').classList.add('ready');
}
if(d.type==='view'){ipPaintV(d.view);return;}
if((d.type==='ctxlost'||d.type==='fatal')&&tries<3)setTimeout(mountVenue,400);
}
function fmtTel(d){const s=d.replace(/\D/g,'');return s.replace(/^(\d{2})(\d{3})(\d{0,4}).*$/,(_,a,b,c)=>[a,b,c].filter(Boolean).join(' '))||s;}
function showNb(msg){const nb=q('.ip-nb');q('.ip-nbm').textContent=msg;clearTimeout(nbT);nb.classList.remove('nb-in');void nb.offsetWidth;requestAnimationFrame(()=>nb.classList.add('nb-in'));nbT=setTimeout(hideNb,7500);}
function hideNb(){if(!R)return;clearTimeout(nbT);q('.ip-nb').classList.remove('nb-in');}
function wireForm(I){
if(I.kind!=='claim'&&I.to){if(I.to.name)q('.ip-name').value=I.to.name;if(I.to.cc&&q('.ip-cc option[value="'+I.to.cc+'"]'))q('.ip-cc').value=I.to.cc;if(I.to.tel)q('.ip-tel').value=I.to.cc==='971'?fmtTel(I.to.tel):I.to.tel;}
const boxes=qa('.ip-otp input'),val=()=>boxes.map(b=>b.value).join('');
const sync=()=>{q('.ip-verify').disabled=val().length!==6;};
const setOtp=s=>{s=s.replace(/\D/g,'').slice(0,6);boxes.forEach((b,i)=>b.value=s[i]||'');sync();};
const clearOtp=()=>{boxes.forEach(b=>b.value='');q('.ip-otp').classList.remove('bad');q('.ip-e2').textContent='';sync();};
const tick=()=>{const r=q('.ip-resend');if(!r)return;if(left>0){r.textContent=`You can request a new code in 0:${String(left).padStart(2,'0')}`;left--;}
else{clearInterval(resendT);r.innerHTML='';const b=document.createElement('button');b.type='button';b.className='ip-link';b.textContent='Text me a new code';b.onclick=()=>{clearOtp();send();};r.appendChild(b);}};
const send=()=>{code=String(100000+Math.floor(Math.random()*900000));
clearTimeout(autoT);const my=code;
setTimeout(()=>{if(R)showNb(I.kind!=='claim'?`Your Ushuaïa code is ${code}. It confirms ${I.table?I.table.name:'your entry'} for ${I.ev.short}. Don't share it.`:`Your Ushuaïa code is ${code}. It confirms your spot at ${I.first}'s table. Don't share it.`);},900);
autoT=setTimeout(()=>{if(!R||my!==code||q('.ip-s2').hidden||val()===code)return;setOtp(code);const o=q('.ip-otp');o.classList.remove('fill');void o.offsetWidth;o.classList.add('fill');
autoT=setTimeout(()=>{if(!R||q('.ip-s2').hidden)return;hideNb();q('.ip-verify').click();},750);},2300);
left=30;clearInterval(resendT);tick();resendT=setInterval(tick,1000);};
q('.ip-tel').addEventListener('input',e=>{const d=e.target.value.replace(/\D/g,'').slice(0,12);e.target.value=q('.ip-cc').value==='971'?fmtTel(d):d;e.target.classList.remove('bad');q('.ip-e1').textContent='';});
q('.ip-name').addEventListener('input',e=>{e.target.classList.remove('bad');q('.ip-e1').textContent='';});
q('.ip-s1').addEventListener('submit',e=>{e.preventDefault();
const nm=q('.ip-name').value.trim().replace(/\s+/g,' '),dg=q('.ip-tel').value.replace(/\D/g,'').replace(/^0+/,'');
if(nm.length<2){q('.ip-name').classList.add('bad');q('.ip-e1').innerHTML=I.kind!=='claim'?`Add your name so <em>${esc((I.from&&I.from.first)||'we')}</em> can hold your table.`:`Add your name so <em>${esc(I.first)}</em> knows who's coming.`;q('.ip-name').focus();return;}
if(dg.length<7||dg.length>12){q('.ip-tel').classList.add('bad');q('.ip-e1').textContent='Enter your mobile number, 7 to 12 digits, without the country code.';q('.ip-tel').focus();return;}
const b=q('.ip-send');b.disabled=true;b.textContent='Sending';
setTimeout(()=>{if(!R)return;b.disabled=false;b.textContent='Send code';
q('.ip-to').textContent='+'+q('.ip-cc').value+' '+(q('.ip-cc').value==='971'?fmtTel(dg):dg);
q('.ip-s1').hidden=true;q('.ip-s2').hidden=false;send();setTimeout(()=>boxes[0].focus({preventScroll:true}),60);},650);});
q('.ip-chg').addEventListener('click',()=>{clearInterval(resendT);clearTimeout(autoT);hideNb();clearOtp();q('.ip-s2').hidden=true;q('.ip-s1').hidden=false;q('.ip-tel').focus();});
boxes.forEach((b,i)=>{
b.addEventListener('input',()=>{const v=b.value.replace(/\D/g,'');q('.ip-otp').classList.remove('bad');q('.ip-e2').textContent='';
if(v.length>1){setOtp(v);boxes[Math.min(5,v.length-1)].focus();if(v.length>=6)q('.ip-verify').focus();return;}
b.value=v;if(v&&i<5)boxes[i+1].focus();sync();if(val().length===6)q('.ip-verify').focus();});
b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&i>0){boxes[i-1].focus();boxes[i-1].value='';sync();e.preventDefault();}});
b.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(t){e.preventDefault();setOtp(t);}});
b.addEventListener('focus',()=>b.select());});
q('.ip-s2').addEventListener('submit',e=>{e.preventDefault();const v=val();if(v.length!==6)return;
if(v!==code){const o=q('.ip-otp');o.classList.remove('shake');void o.offsetWidth;o.classList.add('bad','shake');q('.ip-e2').textContent="That code doesn't match. Check the text we just sent, or request a new one.";return;}
const b=q('.ip-verify');b.disabled=true;b.textContent='Confirming';
setTimeout(()=>{if(!R)return;clearInterval(resendT);hideNb();myName=q('.ip-name').value.trim().split(' ')[0];renderGuests(I);
if(I.kind!=='claim'){q('.ip-dh').textContent=`You're confirmed, ${myName}.`;q('.ip-dp').innerHTML=`<em>${esc((I.from&&I.from.first)||'The team')}</em> can see you're coming${I.table?', and '+esc(I.table.name)+' is held for you':''}.`;}else{q('.ip-dh').textContent=`You're on the table, ${myName}.`;q('.ip-dp').innerHTML=`<em>${esc(I.first)}</em> can see you're coming.`;}
q('.ip-ch').style.display='none';q('.ip-why').style.display='none';q('.ip-s2').hidden=true;q('.ip-done').hidden=false;
q('.ip-claim').scrollIntoView({behavior:'smooth',block:'start'});},800);});
(function(){const nb=q('.ip-nb');let y=null,dy=0,mv=false;
nb.addEventListener('pointerdown',e=>{y=e.clientY;dy=0;mv=false;nb.classList.add('drag');clearTimeout(nbT);});
nb.addEventListener('pointermove',e=>{if(y===null)return;dy=e.clientY-y;if(Math.abs(dy)>4)mv=true;nb.style.transform=`translate3d(0,${dy<0?dy:Math.pow(dy,.62)}px,0)`;});
const end=()=>{if(y===null)return;y=null;nb.classList.remove('drag');nb.style.transform='';
if(!mv){if(code&&!q('.ip-s2').hidden){setOtp(code);q('.ip-verify').focus({preventScroll:true});}hideNb();}else if(dy<-26)hideNb();else nbT=setTimeout(hideNb,4000);};
nb.addEventListener('pointerup',end);nb.addEventListener('pointercancel',end);})();
}
function close(){
if(!R)return;clearTimeout(nbT);clearInterval(resendT);clearTimeout(autoT);clearTimeout(armT);
if(ipFrame){try{ipFrame.remove();}catch(_){}ipFrame=null;}if(ipUrl){try{URL.revokeObjectURL(ipUrl);}catch(_){}ipUrl=null;}
const r=R;R=null;st='closed';r.classList.remove('on');setTimeout(()=>r.remove(),320);document.body.classList.remove('ipv-open');
removeEventListener('message',onVenueMsg);removeEventListener('keydown',onKey);
setTimeout(()=>{try{parent.__invClose&&parent.__invClose();}catch(_){}},300);
}
function onKey(e){if(e.key==='Escape')close();}
window.openInvitePreview=function(){
if(R)return;
const I=info();
st='sealed';dir=0;p=0;cracked=false;tries=0;myName='';code='';
R=document.createElement('div');R.id='ipv';R.className='sealed';R.setAttribute('role','dialog');R.setAttribute('aria-modal','true');R.setAttribute('aria-label','Invitation preview');
R.innerHTML=markup(I);
(document.querySelector('.screen')||document.body).appendChild(R);document.body.classList.add('ipv-open');
buildEnv(I);renderGuests(I);wireForm(I);fitLine(q('.ip-h1'));fillIpNight(q('.ip-night'));fillIpInt(q('.ip-int'));
const env=q('.ip-env');
env.addEventListener('pointerdown',e=>{if(st!=='sealed')return;drag=true;x0=e.clientX;y0=e.clientY;dir=0;try{env.setPointerCapture(e.pointerId);}catch(_){}});
env.addEventListener('pointermove',e=>{if(!drag||st!=='sealed')return;const dx=e.clientX-x0,dy=e.clientY-y0;
if(!dir){if(Math.abs(dx)<6)return;if(Math.abs(dy)>Math.abs(dx)*1.4){drag=false;return;}dir=dx>0?1:-1;env.classList.add('tearing');}
p=Math.max(0,Math.min(1,(dx*dir)/(W*.62)));draw();if(p>=1){drag=false;openEnv();}});
const up=()=>{if(!drag)return;drag=false;if(st!=='sealed')return;if(p>.45)openEnv();else springBack();};
env.addEventListener('pointerup',up);env.addEventListener('pointercancel',up);
env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();autoTear();}});
let tapT=0;env.addEventListener('click',()=>{if(st!=='sealed'||dir)return;const n=Date.now();if(n-tapT<600)autoTear();tapT=n;});
q('.ip-x').addEventListener('click',close);q('.ip-close2').addEventListener('click',close);
addEventListener('message',onVenueMsg);addEventListener('keydown',onKey);
requestAnimationFrame(()=>R&&R.classList.add('on'));
q('.ip-env').classList.add('armed');
armT=setTimeout(()=>{if(R&&st==='sealed'&&!dir&&!ipFrame)mountVenue();},350);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(R){fitLine(q('.ip-h1'));if(st==='sealed'&&!dir)buildEnv(I);}});
};
window.openInvitePreview();
})();

function shinePulse(){document.querySelectorAll('animateTransform[data-shine]').forEach(a=>{try{a.beginElement();}catch(_){}});
  document.querySelectorAll('.eh-sh').forEach(e=>{e.classList.remove('go');void e.offsetWidth;e.classList.add('go');});}
setTimeout(()=>{shinePulse();setInterval(shinePulse,6800);},1500);
