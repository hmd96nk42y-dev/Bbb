<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>bubl · Showcase studio</title>
<link rel="icon" type="image/svg+xml" href="media/bubl-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="bar">
  <img src="media/bubl-mark.svg" alt="bubl">
  <span class="bar-title">Showcase studio</span>
  <span class="pill" id="mode"><span id="modeShort"></span><span class="more" id="modeMore"></span></span>
  <span class="grow"></span>
  <span class="pill meta off" id="meta" hidden></span>
  <button class="sbtn" id="reset" type="button" hidden>Reset</button>
  <button class="sbtn" id="signout" type="button" hidden>Sign out</button>
</header>

<!-- test mode only: the studio is for its operators, by mobile number -->
<section class="gate" id="gate" hidden>
  <form class="card" id="gateForm" novalidate>
    <h1>Showcase studio</h1>
    <p id="gateText">Sign in with the mobile number that was added as a studio operator.</p>
    <div id="gatePhone">
      <label for="phone">Mobile number, with country code</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+971 50 123 4567">
    </div>
    <div id="gateCode" hidden>
      <label for="code">The six-digit code</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    </div>
    <button class="go" id="gateGo" type="submit">Send code</button>
    <button class="link" id="gateBack" type="button" hidden>Use another number</button>
    <p class="err" id="gateErr" role="alert"></p>
  </form>
</section>

<main class="stage" id="stage" hidden>
  <aside class="side">
    <!-- who is being played: tap a name to hold their phone -->
    <div class="strip people" id="people" hidden></div>
    <div class="strip" id="strip" hidden></div>
    <p class="note" id="note" role="status"></p>
  </aside>
  <div class="phones" id="phones"></div>
</main>

<!-- one phone: Sk's frame from his screens canvas -->
<template id="phoneT">
  <div class="phone">
    <div class="dev"><div class="scr wa">
      <div class="wa-top">
        <button class="wa-back" type="button" aria-label="Chats"></button>
        <div class="wa-av"></div>
        <div style="flex:1;min-width:0"><div class="wa-nm"></div><div class="wa-sb"></div></div>
      </div>
      <div class="wa-body" aria-live="polite"></div>
      <form class="comp" autocomplete="off">
        <input class="cfield" type="text" placeholder="Message" aria-label="Message" enterkeyhint="send" autocapitalize="sentences">
        <button class="cmic" type="submit" aria-label="Send"></button>
      </form>
    </div></div>
    <div class="dlab"></div>
  </div>
</template>

<script src="config.js"></script>
<script type="module" src="studio.js"></script>
</body>
</html>
