/* ---------- table sheet: turn and revenue-per-minute strip ---------- */
.tz{position:relative;height:44px;border-radius:10px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.tz i{position:absolute;top:8px;height:18px;border-radius:5px;background:var(--g4);min-width:3px}
.tz i.done{background:var(--g3)}.tz i.live{background:linear-gradient(90deg,var(--ok),#22a877);box-shadow:0 0 10px -2px rgba(52,211,153,.7)}.tz i.next{background:none;border:1.5px solid var(--acc)}.tz i.pen{background:none;border:1.5px dashed var(--acc-bd)}
.tz i.pred{background:repeating-linear-gradient(135deg,rgba(52,211,153,.55) 0 2px,transparent 2px 5px);border-radius:0 5px 5px 0}
.tz i.eng::after{content:'';position:absolute;left:0;right:0;top:-4px;height:2px;border-radius:1px;background:var(--acc)}
.tz em{position:absolute;top:3px;bottom:14px;width:1.5px;background:var(--t1)}
.tz span{position:absolute;bottom:2px;font:500 9.5px var(--mono);color:var(--t4);transform:translateX(-50%)}
.cue{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;font-size:13px;line-height:1.4;background:linear-gradient(135deg,rgba(90,168,255,.16),rgba(90,168,255,.04));border:1px solid var(--acc-bd);color:var(--t2)}
.cue b{color:var(--acc-s);font-weight:700}.cue .bubl{width:26px;height:26px;flex-shrink:0}
.cue.bad{background:var(--bad-bg);border-color:var(--bad-bd)}.cue.bad b{color:#fca5a5}

/* ---------- seat ring: order for one seat, charge one seat (from BUBL OPS · La Cave) ---------- */
.spw{display:flex;flex-direction:column;gap:12px}
.sp-ring{position:relative;margin:4px auto 2px;flex-shrink:0}
.sp-nuc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px;
  background:radial-gradient(circle,#241C10,#0A0B0E);border:1.5px solid var(--line2);transition:transform .12s,box-shadow .2s,border-color .2s}
.sp-nuc:active{transform:translate(-50%,-50%) scale(.96)}
.sp-nuc.on{border-color:var(--acc);box-shadow:0 0 0 4px rgba(90,168,255,.18),0 0 34px -6px rgba(90,168,255,.55)}
.sp-nuc small{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.sp-nuc b{font:500 21px/1 var(--mono);letter-spacing:-.04em;color:var(--t1)}
.sp-nuc em{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.sp-seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:64px;gap:3px;z-index:2}
.sp-av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--disp);color:var(--t2);background:var(--card2);border:1.5px solid var(--line2);position:relative;transition:box-shadow .2s,border-color .2s,transform .12s}
.sp-seat:active .sp-av{transform:scale(.94)}
.sp-av.t2{color:#03111F;background:linear-gradient(135deg,var(--acc-s),var(--acc) 45%,var(--acc-d));border-color:transparent}
.sp-av.t1{color:var(--acc-s);background:var(--acc-bg);border-color:var(--acc-bd)}
.sp-av.un{border-style:dashed;color:var(--t3)}
.sp-av.sel{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--acc),0 0 22px rgba(90,168,255,.6)}
.sp-av.paid::after{content:'';position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:var(--ok);border:2px solid var(--bg2);box-shadow:0 0 8px rgba(52,211,153,.7)}
.sp-av.diet::before{content:'!';position:absolute;left:-3px;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--warn);color:#062544;font:700 10.5px/16px var(--mono);text-align:center;border:2px solid var(--bg2)}
.sp-seat b{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.sp-seat span{font:500 10.5px var(--mono);color:var(--acc-s)}
.sp-li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;min-height:38px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sp-li:last-child{border-bottom:0}
.sp-li>span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.sp-li .n{color:var(--t1)}
.sp-li.cpd>span:first-child,.sp-li.cpd .n{text-decoration:line-through;color:var(--t4)}
.sp-tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.sp-tag.sent{color:var(--acc);background:var(--acc-bg)}.sp-tag.prep{color:var(--warn);background:var(--warn-bg)}.sp-tag.ready{color:var(--ok);background:var(--ok-bg)}.sp-tag.served{color:var(--t3);background:var(--card2)}.sp-tag.shr{color:var(--t2);background:var(--card2)}
.sp-box{padding:4px 12px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
.sp-who{display:flex;align-items:center;gap:8px;padding:9px 0 3px;font-size:12.5px;font-weight:700;color:var(--acc-s)}
.sp-who .n{margin-left:auto;color:var(--t1)}
.sp-res{display:grid;grid-template-columns:1fr auto 30px;gap:10px;align-items:center;width:100%;min-height:46px;padding:0 6px 0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.sp-res .n{color:var(--t3);font-size:12.5px}
.sp-res i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--acc-bg);color:var(--acc);font-style:normal}
.sp-res.armed{border-color:var(--acc);background:linear-gradient(135deg,rgba(90,168,255,.16),var(--card) 72%);box-shadow:0 0 0 1px rgba(90,168,255,.3)}
.sp-res.armed i{background:var(--acc);color:var(--on-acc)}
.sp-list{display:flex;flex-direction:column;gap:6px}
.sp-cf{display:flex;gap:8px;animation:tin .2s var(--ease)}
.sp-tot{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:13px;padding:2px 2px 0}
.sp-tot span{color:var(--t3)}.sp-tot b{text-align:right;font-weight:500}
.sp-tot .tt{font-size:15px;font-weight:700;color:var(--t1);padding-top:7px;border-top:1px solid var(--line2);margin-top:3px}
.sp-ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp-ins>div{padding:10px 11px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.sp-ins span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3)}
.sp-ins b{display:block;font:500 17px var(--mono);margin-top:3px;letter-spacing:-.03em}

/* ---------- settle flow: terminal, receipt, approved ---------- */
.payf{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 26px;gap:8px;background:linear-gradient(165deg,#0E1014,#0A0B0E 55%,#08090C);animation:posIn .3s ease;overflow:hidden;color:#fff}
@keyframes posIn{from{opacity:0}}
.payf .ey{position:absolute;top:calc(34px + var(--sat));font:700 10.5px var(--disp);letter-spacing:.28em;text-transform:uppercase;color:var(--t4)}
.payf .who{font-size:14px;font-weight:600;color:var(--t3)}
.payf .amt{position:relative;font:500 54px/1 var(--mono);letter-spacing:-.04em;text-shadow:0 0 30px rgba(90,168,255,.5),0 0 60px rgba(90,168,255,.25)}
.payf .amt small{font-size:22px;vertical-align:super;color:var(--acc-s);margin-right:6px;letter-spacing:0}
.payf .shine{position:absolute;top:-30%;height:160%;left:-70%;width:46%;background:linear-gradient(105deg,transparent,rgba(240,206,140,.2),transparent);transform:skewX(-16deg);animation:posShine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes posShine{0%{left:-70%}60%,100%{left:130%}}
.payf .ln{width:62px;height:2px;border-radius:2px;margin:18px 0 12px;background:linear-gradient(90deg,transparent,var(--acc-s),transparent);box-shadow:0 0 10px var(--acc)}
.payf .ins{font:700 12px var(--disp);letter-spacing:.24em;text-transform:uppercase;color:var(--acc-s)}
.payf .mth{position:absolute;bottom:calc(84px + var(--sab));display:flex;gap:8px}
.payf .mth button{height:44px;padding:0 15px;border-radius:12px;border:1px solid var(--line2);font-size:12.5px;font-weight:700;color:var(--t2);background:rgba(255,255,255,.04)}
.payf .mth button.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.payf .tap{position:absolute;bottom:calc(22px + var(--sab));left:24px;right:24px}
.payf .cx{position:absolute;right:14px;top:calc(18px + var(--sat));width:44px;height:44px;display:grid;place-items:center;color:var(--t3)}
.payf.rc{justify-content:center}
.rcpt{position:relative;width:250px;background:linear-gradient(180deg,#191b22,#141620);border:1px solid var(--line2);border-radius:14px;padding:16px 18px;z-index:2;animation:rcIn .5s var(--ease);transition:border-color .5s,box-shadow .5s;text-align:left}
@keyframes rcIn{from{opacity:0;transform:translateY(18px)}}
.rcpt h5{font:700 15px var(--disp);letter-spacing:.3em;text-align:center}.rcpt h6{font:600 9.5px var(--disp);letter-spacing:.22em;text-align:center;color:var(--t3);margin-top:3px}
.rcpt .mt{font:500 10.5px var(--mono);color:var(--t3);text-align:center;margin-top:8px}
.rcpt .ds{border-top:1px dashed var(--line2);margin:10px 0}
.rcpt .li{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--t2);padding:2px 0}.rcpt .li b{font:500 12px var(--mono);color:var(--t1)}
.rcpt .tt{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px;margin-top:4px}.rcpt .tt b{font:500 20px var(--mono);letter-spacing:-.03em}
.rcpt .pd{text-align:center;font:700 10.5px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--ok);margin-top:12px;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s}
.rc-scan{position:absolute;left:50%;top:50%;width:274px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#4ade80 28%,#fff 50%,#4ade80 72%,transparent);box-shadow:0 0 18px 3px rgba(74,222,128,.85);z-index:3;opacity:0;animation:rcScan 1.45s ease-in-out forwards}
@keyframes rcScan{0%{opacity:0;transform:translate(-50%,-170px)}9%{opacity:1}88%{opacity:1;transform:translate(-50%,170px)}100%{opacity:0;transform:translate(-50%,190px)}}
.rc-glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:420px;border-radius:32px;transition:background .55s,box-shadow .55s;pointer-events:none}
.payf.ok .rc-glow{background:radial-gradient(ellipse 62% 62% at 50% 50%,rgba(52,211,153,.24),transparent 66%);box-shadow:0 0 64px 12px rgba(52,211,153,.24)}
.payf.ok .rcpt{border-color:rgba(52,211,153,.42);box-shadow:0 0 30px -6px rgba(52,211,153,.4)}.payf.ok .rcpt .pd{opacity:1;transform:none;text-shadow:0 0 14px rgba(52,211,153,.55)}
.payf.sum{justify-content:flex-start;padding:calc(54px + var(--sat)) 20px calc(20px + var(--sab));overflow-y:auto;text-align:left;align-items:stretch;gap:14px}
.payf.sum .hd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.payf.sum .hd .ey2{font:700 11px var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--ok)}
.payf.sum .amt{font-size:46px}
.sum-g{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sum-g>div{background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:14px;padding:12px 13px}
.sum-g span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.sum-g b{display:block;font:500 21px var(--mono);margin-top:4px;letter-spacing:-.03em}
.sum-g .au b{color:var(--acc-s)}.sum-g .gr b{color:var(--ok)}

/* ---------- Do Now: hold to complete, swipe to skip (from BUBL OPS · La Cave) ---------- */
.now{position:relative;overflow:hidden;padding:15px 15px 13px;border-radius:18px;border:1.5px solid var(--ok-bd);background:linear-gradient(160deg,rgba(52,211,153,.13),var(--card) 74%);box-shadow:0 0 0 1px rgba(52,211,153,.18),0 0 22px -6px rgba(52,211,153,.45);touch-action:none;user-select:none;-webkit-user-select:none;animation:nowIn .34s var(--ease)}
@keyframes nowIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
.now.t-bad{border-color:var(--bad-bd);background:linear-gradient(160deg,rgba(248,113,113,.14),var(--card) 74%);box-shadow:0 0 0 1px rgba(248,113,113,.2),0 0 22px -6px rgba(248,113,113,.5)}
.now.t-warn{border-color:var(--warn-bd);background:linear-gradient(160deg,rgba(251,191,36,.13),var(--card) 74%);box-shadow:0 0 0 1px rgba(251,191,36,.18),0 0 22px -6px rgba(251,191,36,.45)}
.now.t-neu{border-color:var(--acc-bd);background:linear-gradient(160deg,rgba(90,168,255,.15),var(--card) 74%);box-shadow:0 0 0 1px rgba(90,168,255,.18),0 0 22px -6px rgba(90,168,255,.45)}
.now.skipping{opacity:.8}
.now-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,rgba(52,211,153,.34),rgba(52,211,153,.08));pointer-events:none}
.now-hd{display:flex;align-items:center;gap:7px;margin-bottom:12px;position:relative}
.now-ey{display:inline-flex;align-items:center;gap:6px;font:700 10.5px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ok)}
.now-ey i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s ease-in-out infinite}
.now-tag{font:700 10px var(--mono);letter-spacing:.04em;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.07);color:var(--t2)}
.now-num{margin-left:auto;font:600 20px var(--mono);letter-spacing:-.03em;padding:3px 10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25)}
.now.t-ok .now-num{color:#6ee7b7;border-color:rgba(74,222,128,.55);text-shadow:0 0 14px rgba(74,222,128,.8)}.now.t-bad .now-num{color:#fca5a5;border-color:rgba(248,113,113,.6);text-shadow:0 0 14px rgba(248,113,113,.85)}
.now.t-warn .now-num{color:#fcd34d;border-color:rgba(251,191,36,.6);text-shadow:0 0 14px rgba(251,191,36,.8)}.now.t-neu .now-num{color:var(--acc-s);border-color:var(--acc-bd);text-shadow:0 0 14px rgba(90,168,255,.8)}
.now-bd{display:flex;align-items:center;gap:13px;position:relative}
.now-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.28);border:1px solid var(--line);flex-shrink:0;color:var(--t1)}
.now-bd h4{font:600 19px/1.15 var(--disp);letter-spacing:-.01em}
.now-bd .it{font:500 12.5px var(--mono);color:var(--acc-s);margin-top:4px}
.now-bd p{font-size:12.5px;color:var(--t2);margin-top:4px;line-height:1.35}
.now-ft{margin-top:13px;font-size:11.5px;color:var(--t3);text-align:center;position:relative}.now-ft b{color:var(--t1)}
.now-ring{position:absolute;right:13px;bottom:10px;width:38px;height:38px;opacity:0;transition:opacity .15s}
.now.holding .now-ring{opacity:1}
.now-ring circle{fill:none;stroke-width:4}.now-ring .bg{stroke:rgba(255,255,255,.12)}.now-ring .fg{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.urow{display:grid;grid-template-columns:34px auto 1fr auto;gap:10px;align-items:center;min-height:50px;padding:7px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);width:100%}
.urow .gl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--t2)}
.urow .tc{font:600 12px var(--mono);padding:3px 7px;border-radius:7px;border:1px solid var(--line2)}
.urow .tx{font-size:13.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .tg{font:700 9.5px var(--mono);color:var(--t3);white-space:nowrap}
.urow.ok .tc{color:var(--ok);border-color:var(--ok-bd)}.urow.bad .tc{color:var(--bad);border-color:var(--bad-bd)}.urow.warn .tc{color:var(--warn);border-color:var(--warn-bd)}.urow.neu .tc{color:var(--acc);border-color:var(--acc-bd)}
/* manager in the earpiece */
.vb{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;background:linear-gradient(150deg,var(--card2),var(--card) 72%);border:1px solid var(--line)}
.vb .vi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--acc-bg);color:var(--acc);border:1px solid var(--acc-bd);flex-shrink:0}
.vb .vt{flex:1;min-width:0}.vb .vt b{display:block;font:700 10px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}.vb .vt span{display:block;font-size:13px;color:var(--t2);line-height:1.35;margin-top:2px}
.vb .bars{display:flex;align-items:center;gap:2px;height:22px;flex-shrink:0}.vb .bars i{width:2.5px;border-radius:2px;background:var(--acc);animation:vbar 1s ease-in-out infinite}
@keyframes vbar{0%,100%{height:4px;opacity:.5}50%{height:20px;opacity:1}}
.vb.mute .bars i{animation:none;height:3px;opacity:.3}.vb.mute .vt span{color:var(--t4)}

/* ---------- Guest Line ---------- */
.line{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.ln-top{flex-shrink:0;padding:2px 14px 10px;display:flex;flex-direction:column;gap:10px}
.ln-body{flex:1;min-height:0;overflow-y:auto;padding:0 14px 28px;display:flex;flex-direction:column;gap:var(--gap);scrollbar-width:none}.ln-body::-webkit-scrollbar{display:none}
.th{display:grid;grid-template-columns:44px 1fr auto;gap:11px;align-items:center;min-height:68px;padding:10px 12px;border-radius:14px;background:linear-gradient(150deg,var(--card2),var(--card) 72%);border:1px solid var(--line);width:100%;text-align:left}
.th.un{border-color:var(--acc-bd);box-shadow:0 0 20px -12px rgba(90,168,255,.7)}
.th.on{border-color:var(--acc)}
.th-av{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--disp);color:var(--t2);background:var(--card2);border:1px solid var(--line2)}
.th-av.t2{color:#03111F;background:linear-gradient(135deg,var(--acc-s),var(--acc) 45%,var(--acc-d));border-color:transparent}.th-av.t1{color:var(--acc-s);background:var(--acc-bg);border-color:var(--acc-bd)}
.th-av i{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line2);color:var(--t2);font-style:normal}
.th-t{min-width:0}.th-t>b{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th-t>span{display:block;font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.th.un .th-t>span{color:var(--t1);font-weight:600}
.th-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:var(--t3)}
.th-n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:var(--on-acc);font:600 11px/20px var(--mono);text-align:center}
.chat{display:flex;flex-direction:column;gap:9px}
.bub{max-width:84%;padding:10px 13px;font-size:14.5px;line-height:1.45;border-radius:16px}
.bub.them{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.us{align-self:flex-end;background:var(--acc-bg);border:1px solid var(--acc-bd);border-bottom-right-radius:5px}
.bub.dylan{align-self:stretch;max-width:none;background:none;border:1px dashed var(--line2);color:var(--t2);font-size:13px;display:flex;gap:9px;align-items:flex-start}
.bub time{display:block;font:500 10px var(--mono);color:var(--t4);margin-top:4px}
.bub.us time{text-align:right}
.bub.lk{align-self:flex-end;max-width:92%;padding:0;background:none;border:0}
.intent{display:flex;flex-wrap:wrap;gap:6px}
.cmp{display:flex;gap:8px;align-items:flex-end}
.cmp textarea{flex:1;min-width:0;min-height:50px;max-height:120px;border-radius:13px;background:linear-gradient(180deg,#0a0b0e,#101218);border:1px solid var(--line2);padding:13px 14px;font-size:16px;line-height:1.35;color:var(--t1);outline:none;resize:none}
.cmp textarea:focus{border-color:var(--acc)}
.cmp button{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;color:var(--on-acc);background:linear-gradient(135deg,var(--acc-s),var(--acc) 45%,var(--acc-d))}

.lk-steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative}

/* what the guest sees */
.gpv{align-self:center;width:100%;max-width:330px;border-radius:26px;padding:16px 15px 15px;background:linear-gradient(180deg,#F7F2E7,#EEF3F6);color:#13294F;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 0 7px #0c0c0f,0 0 0 8px rgba(255,255,255,.08),0 18px 44px -14px rgba(0,0,0,.9);display:flex;flex-direction:column;gap:11px;font-family:var(--body)}

/* rules */

/* ---------- seating engine ---------- */

/* ---------- door ---------- */

.jr::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.jr>div,.jr>button{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:46px;padding:6px 0;text-align:left;width:100%}

.jr .on i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px rgba(52,211,153,.6)}.jr .dn i{background:var(--g3)}.jr .nx i{border-color:var(--acc)}.jr .sg i{border-style:dashed;border-color:var(--acc)}

.panel .pv.gold{color:var(--acc-s);text-shadow:0 0 24px rgba(90,168,255,.35)}

.gc{--tc:var(--acc);--tg:rgba(90,168,255,.15);flex:1;display:flex;flex-direction:column;min-width:0;padding:12px 12px 11px;border-radius:14px;position:relative;text-align:left;
  background:radial-gradient(130% 75% at 100% 0%,var(--tg),transparent 62%);box-shadow:inset 10px 10px 0 -8.5px var(--tc),inset -10px -10px 0 -8.5px var(--tc)}
.gc.t-ok{--tc:var(--ok);--tg:rgba(52,211,153,.13)}.gc.t-warn{--tc:var(--warn);--tg:rgba(251,191,36,.13)}.gc.t-bad{--tc:var(--bad);--tg:rgba(248,113,113,.14)}

/* mini charts */

i.m-exact{background:var(--acc)}i.m-section{background:var(--cyan)}i.m-type{background:var(--ok)}i.m-request{background:var(--warn)}i.m-closed{background:var(--g3)}

.su-l{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.su-r{display:grid;grid-template-columns:8px 1fr auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);text-align:left;min-width:0}
.su-r>i{grid-row:span 2;width:8px;height:28px;border-radius:4px}.su-r b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.su-r span{grid-column:2;font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.su-r em{grid-row:1/3;grid-column:3;color:var(--t4)}.su-r em.ok{color:var(--ok)}
.vipc{color:var(--gold)}
.atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:stretch}
.atiles .tile.w2{grid-column:span 2}
.atiles .tile.gx{min-height:208px}
/* floor modes */
.fl-modes{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.fl-modes button{flex:1;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--t3)}
.fl-modes button.on{color:var(--t1);background:var(--bg);box-shadow:0 0 0 1px var(--line2)}
.fl-modes button.on.m-rules,.fl-modes button.on.m-setup{color:var(--cyan);box-shadow:0 0 0 1px var(--cyan-bd);background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(34,211,238,.03))}
.fl-modes button.on.m-link{color:var(--gold);box-shadow:0 0 0 1px var(--gold-bd);background:linear-gradient(135deg,rgba(224,178,87,.18),rgba(224,178,87,.03))}
.fl-modes button.on.m-live{color:var(--acc-s);box-shadow:0 0 0 1px var(--acc-bd);background:linear-gradient(135deg,rgba(90,168,255,.18),rgba(90,168,255,.03))}
.fl-sec.rs{gap:4px}.fl-sec.rs .mtag{align-self:flex-start;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
.mdot{display:inline-block;width:12px;height:12px;border-radius:4px}.mdot.m-exact{background:var(--acc)}.mdot.m-section{background:var(--cyan)}.mdot.m-type{background:var(--ok)}.mdot.m-request{background:var(--warn)}.mdot.m-closed{background:var(--g3)}
.su-steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 1px 3px}.su-steps::-webkit-scrollbar{display:none}
.su-steps button{flex-shrink:0;display:flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 6px;border-radius:19px;font-size:12.5px;font-weight:700;color:var(--t2);background:var(--card);border:1px solid var(--line2)}
.su-steps button i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--mono);font-style:normal;background:var(--card2);color:var(--t3)}
.su-steps button.ok i{background:var(--ok);color:#04130c}.su-steps button.on{border-color:var(--cyan);color:var(--t1);box-shadow:0 0 18px -6px rgba(34,211,238,.6)}.su-steps button.on i{background:var(--cyan);color:#032029}
/* the card in the floor dock */
.fl-card{max-height:56vh;overflow-y:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:radial-gradient(ellipse 90% 160px at 100% 0,rgba(34,211,238,.09),transparent 70%)}
.fl-card::-webkit-scrollbar{display:none}
.sucard,.lkcard{display:flex;flex-direction:column;gap:14px;padding:14px 14px 16px}
.lkcard{background:radial-gradient(ellipse 90% 160px at 100% 0,rgba(224,178,87,.1),transparent 70%)}
.su-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;--tc:var(--cyan);--tg:rgba(34,211,238,.35)}
.su-top .lbl{display:flex;align-items:center;gap:6px}.su-top h3{font:700 21px/1.15 var(--disp);margin-top:4px;letter-spacing:-.01em}.su-top .sub{display:block;margin-top:3px;font-size:12.5px}
.su-foot{position:sticky;bottom:-16px;padding:10px 0 2px;background:linear-gradient(180deg,transparent,var(--bg2) 30%)}
/* how guests book: five option cards */
.mopts{display:flex;flex-direction:column;gap:6px}
.mopt{display:grid;grid-template-columns:36px 1fr 20px;gap:10px;align-items:center;padding:9px 11px;border-radius:13px;background:var(--card);border:1px solid var(--line);text-align:left;--mc:var(--acc);--mb:var(--acc-bg)}
.mopt.m-section{--mc:var(--cyan);--mb:var(--cyan-bg)}.mopt.m-type{--mc:var(--ok);--mb:var(--ok-bg)}.mopt.m-request{--mc:var(--warn);--mb:var(--warn-bg)}.mopt.m-closed{--mc:var(--g2);--mb:rgba(255,255,255,.06)}
.mopt .mi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--mc);background:var(--mb)}
.mopt .mt b{display:block;font-size:14px}.mopt .mt span{display:block;font-size:11.5px;color:var(--t3);line-height:1.3;margin-top:1px}
.mopt em{color:var(--mc)}.mopt.on{border-color:var(--mc);background:linear-gradient(135deg,var(--mb),transparent 75%);box-shadow:0 0 22px -12px var(--mc)}
/* the bar slide widget */
.slw{display:flex;flex-direction:column;padding:12px 13px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);--sc:var(--acc);--sg:rgba(90,168,255,.55)}
.slw[data-f="dep"]{--sc:var(--gold);--sg:rgba(224,178,87,.55)}.slw[data-f="hold"]{--sc:var(--warn);--sg:rgba(251,191,36,.5)}.slw[data-f="walk"]{--sc:var(--silver);--sg:rgba(213,220,230,.45)}.slw[data-f="stay"]{--sc:var(--ok);--sg:rgba(52,211,153,.5)}.slw[data-f="wind"]{--sc:var(--cyan);--sg:rgba(34,211,238,.5)}
.slw-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.slw-h b{font-size:22px;font-weight:600;color:var(--sc);letter-spacing:-.03em;text-shadow:0 0 18px var(--sg)}
.slw .note{margin-top:4px;font-size:12px}
.slw-t{display:flex;justify-content:space-between;font-size:9.5px;color:var(--t4);padding:0 2px}
input.bar{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:6px 0 0;touch-action:pan-y;cursor:pointer}
input.bar:focus{outline:none}
input.bar::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--sc) 0,var(--sc) var(--p),rgba(255,255,255,.08) var(--p));box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 16px -6px var(--sg)}
input.bar::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;margin-top:-8px;background:radial-gradient(circle at 35% 30%,#fff,#e9eef5 45%,var(--sc));border:3px solid var(--bg);box-shadow:0 0 0 1px var(--sc),0 0 16px var(--sg)}
input.bar::-moz-range-track{height:14px;border-radius:8px;background:rgba(255,255,255,.08)}input.bar::-moz-range-progress{height:14px;border-radius:8px;background:var(--sc)}
input.bar::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--sc),0 0 14px var(--sg)}
input.bar:disabled{opacity:.5}
.rstp{display:flex;flex-direction:column;gap:6px}
.rs{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 6px 6px 13px;border-radius:13px;background:var(--card);border:1px solid var(--line)}.rs>span{font-size:13px;font-weight:700;color:var(--t2)}
.step.sm button{width:40px;height:40px}.step.sm b{min-width:56px;font-size:16px}
.oosg{display:flex;flex-wrap:wrap;gap:5px}.oosg button{height:30px;min-width:40px;padding:0 9px;border-radius:9px;font:600 11.5px var(--mono);color:var(--t2);background:var(--card);border:1px solid var(--line2)}
.oosg button.on{color:var(--bad);border-color:var(--bad-bd);background:repeating-linear-gradient(135deg,rgba(248,113,113,.18) 0 3px,transparent 3px 7px)}
/* importance levels */
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lvl{height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--t2);background:var(--card);border:1px solid var(--line2)}
.lvl.l1.on{color:var(--acc-s);border-color:var(--acc);background:var(--acc-bg)}.lvl.l0.on{color:var(--t1);border-color:var(--t3);background:rgba(255,255,255,.07)}
.lvl.l2.on{color:var(--gold);border-color:var(--gold);background:var(--gold-bg);box-shadow:0 0 18px -8px var(--gold)}
.lvl.l3.on{color:#241a06;border-color:var(--gold);background:linear-gradient(135deg,#f3d48d,var(--gold) 50%,#b8862e);box-shadow:0 0 22px -6px rgba(224,178,87,.8)}
.lvl-d{margin-top:6px}
.lvt{font:800 9px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:6px;vertical-align:.15em;color:var(--acc-s);background:var(--acc-bg)}.lvt.l2,.lvt.l3{color:var(--gold);background:var(--gold-bg)}
.lk.vip{border-color:var(--gold-bd)!important}
.lkc-n{display:flex;flex-direction:column;gap:8px}.lkc-n .pchips:empty{display:none}.pchip.vip{border-color:var(--gold-bd)}
.lkc-r{display:flex;align-items:center;justify-content:space-between;gap:10px}.lkc-r .chips{flex:1;min-width:0}
/* the WhatsApp inbox */
.wa-h{display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:center;padding:11px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(37,211,102,.13),rgba(37,211,102,.02) 70%),var(--card);border:1px solid rgba(37,211,102,.3)}
.wa-h.off{background:var(--card);border-color:var(--bad-bd)}
.wa-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#04130c;background:linear-gradient(135deg,#5ef08f,#25D366)}
.wa-h.off .wa-ic{background:var(--bad-bg);color:var(--bad)}
.wa-h b{display:block;font-size:14px}.wa-h div>span{display:block;font-size:11.5px;color:var(--t3);margin-top:1px}
.wa-live{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#25D366}.wa-live i{width:7px;height:7px;border-radius:50%;background:#25D366;box-shadow:0 0 8px #25D366;animation:lvp 2.2s infinite}
.wa-h.off .wa-live{color:var(--bad)}.wa-h.off .wa-live i{background:var(--bad);box-shadow:none}
.wa-k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wa-k div{padding:9px 6px 8px;border-radius:12px;text-align:center;background:var(--card);border:1px solid var(--line)}.wa-k b{display:block;font-size:17px;font-weight:600}.wa-k span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:3px}
.wa-k .warn b{color:var(--warn)}
.th.dn{opacity:.62}.th-ok{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#04130c;background:var(--ok)}
.th-av i.ch-wa{color:#25D366}.th-av i.ch-ig{color:#F472B6}
.tick{font:700 11px/1 var(--body);letter-spacing:-.18em;margin-right:.2em;color:var(--t4)}.tick.read{color:#53BDEB}
.bub.us{background:linear-gradient(160deg,#0f5a4a,#0a4a3d);border-color:rgba(37,211,102,.25);color:#eafff6}
.bub.us time{color:rgba(234,255,246,.55)}
.bub.bot{align-self:flex-end;max-width:84%;background:var(--card);border:1px dashed var(--line2);color:var(--t2);font-size:13px;border-bottom-right-radius:5px}.bub.bot .bt{display:block;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.bub.sys{align-self:center;display:flex;align-items:center;gap:6px;max-width:none;padding:6px 11px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-bd)}
.bub .tpl{display:block;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#25D366;text-align:right;margin-bottom:4px}
.wa-win{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:11px;font-size:11.5px;font-weight:600;color:#25D366;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.22)}
.wa-win.shut{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}.wa-win.ig{color:#F472B6;background:rgba(244,114,182,.08);border-color:rgba(244,114,182,.25)}
/* tablet: the floor's side column */
#aview .apage.fl .col.side#flSide{padding:0}
#aview .apage.fl #flSide .sucard{padding:18px 18px 20px}
#aview .apage.fl #flSide .su-foot{bottom:-20px;background:linear-gradient(180deg,transparent,var(--bg2) 30%)}
.dcount{padding:14px;display:flex;flex-direction:column;gap:12px;border-color:var(--cyan-bd)!important;background:radial-gradient(circle at 100% 0,rgba(34,211,238,.13),transparent 45%),linear-gradient(160deg,#191c24,var(--card) 75%)!important}
.dcount h3{font:600 30px/1.1 var(--mono);letter-spacing:-.04em;color:var(--cyan)}.dcount h3 small{font:700 13px var(--body);color:var(--t3);letter-spacing:0}
.dcount .kp4{margin-top:0}.dcount .kp4 .hot{background:radial-gradient(circle at 50% 0,rgba(224,178,87,.22),rgba(224,178,87,.05));box-shadow:inset 0 0 0 1px var(--gold-bd)}.dcount .kp4 .hot b{color:var(--gold)}
.fl-card.ex{max-height:66vh}
.fl-card:not(.ex){max-height:none;overflow:visible}
.pk{display:flex;flex-direction:column;gap:10px;padding:12px 14px 12px}
.pk-h{display:flex;justify-content:space-between;align-items:center;gap:10px;--tc:var(--cyan);--tg:rgba(34,211,238,.35)}.pk-h .lbl{display:block}.pk-h b{display:block;font:700 17px/1.2 var(--disp);margin-top:2px}
.pk-m{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.pk-m button{height:34px;border-radius:9px;font-size:11.5px;font-weight:800;border:1px solid transparent;opacity:.62}.pk-m button.on{opacity:1;border-color:currentColor;box-shadow:0 0 14px -6px currentColor}
.pk-s{display:flex;flex-wrap:wrap;gap:6px}.pk-s span{font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.05)}.pk-s .gd{color:var(--gold)}.pk-s .am{color:var(--warn)}.pk-s .sv{color:var(--silver)}.pk-s .rd{color:var(--bad)}
.pk .note{margin:-2px 0 0;font-size:11.5px}
.lkpk{background:radial-gradient(ellipse 90% 140px at 100% 0,rgba(224,178,87,.1),transparent 70%)}
.lkpk .pk-h{--tc:var(--gold)}
#aview .su-l{grid-template-columns:repeat(4,1fr)}

function engStats(s){const k=W.rev+':'+Math.floor(s.t/60000);if(W._eng&&W._engK===k)return W._eng;const t=s.t,e={covDay:0,revDay:0,covNow:0,revNow:0,bySess:{},n:0,maeE:0,maeF:0,in10:0,turnsE:0,turnsF:0,covE:0,covF:0,idle:0,pat:{}};

      if(b.leave<=t){e.n++;e.maeE+=Math.abs(b.perr);e.maeF+=Math.abs(120-b.dur);if(Math.abs(b.perr)<=10)e.in10++;}}});
  const R=W.bySec.rest.filter(q=>!q.min);R.forEach(q=>{const L=W.byUnit[q.id].filter(b=>!b.ns);e.turnsE+=L.length;e.turnsF+=L.filter(b=>!b.ext).length;L.forEach(b=>{e.covE+=b.party;if(!b.ext)e.covF+=b.party;e.idle+=Math.max(0,120-b.dur);});});

/* ---------- links: status is a read of its timestamps ---------- */
const LST=['Sent','Opened','Picked','Confirmed'];
function linkSt(l,t){if(l.revoked&&l.revoked<=t)return {k:'revoked',i:-1,l:'Revoked',c:'mut'};if(l.confAt&&l.confAt<=t)return {k:'conf',i:3,l:'Confirmed',c:'ok'};if(l.exp<=t)return {k:'exp',i:-1,l:'Expired',c:'bad'};if(l.pickAt&&l.pickAt<=t)return {k:'pick',i:2,l:'Picked',c:'neu'};if(l.openAt&&l.openAt<=t)return {k:'open',i:1,l:'Opened',c:'warn'};return {k:'sent',i:0,l:'Sent',c:'mut'};}

/* a confirmed link for today becomes a booking on the spot the guest picked; the other spots are released */
function applyLinks(){const t=now();let ch=false;W.links.forEach(l=>{const st=linkSt(l,t);if(st.k==='conf'&&!l.applied){l.applied=true;ch=true;W.holds.forEach(h=>{if(h.link===l.id)h.rel=t;});const q=W.U[l.pick];

  return N;}

function searchAll(q,lim){q=q.toLowerCase().trim();const out=[],t=now();if(q.length<2)return out;const qs=q.replace(/\s/g,'');

const TONES={acc:'acc',ok:'ok',warn:'warn',bad:'bad',cyan:'cyan',gold:'gold',orange:'orange',mut:'mut'};

function vzBars(v,o){o=o||{};const w=o.w||150,h=o.h||40,n=v.length,gap=o.gap!=null?o.gap:3,bw=(w-gap*(n-1))/n,mx=Math.max(o.max||0,...v,1);let s='';

    if(o.lab&&o.lab[i]!=null)s+='<text class="vt" x="'+(i*(bw+gap)+bw/2).toFixed(1)+'" y="'+(h-1)+'" text-anchor="middle">'+o.lab[i]+'</text>';});
  return '<svg class="vz" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="height:'+h+'px">'+s+'</svg>';}

function vzArea(v,o){o=o||{};const w=o.w||150,h=o.h||38,n=v.length,mx=Math.max(o.max||0,...v,1)*1.08,mn=o.min!=null?o.min:0,X=i=>i/(n-1)*w,Y=x=>h-2-(x-mn)/Math.max(1e-9,mx-mn)*(h-6),cut=o.now!=null?o.now:n-1;

/* ==== 50-shell.js ==== */
/* ============================================================
   50 · shell
   The BUBL OPS shell: one delegated click handler, bottom sheets
   (right drawer on the tablet), toasts with undo, Manager PIN, top
   bar, the day's time bar, profile and role.
   ============================================================ */
const ON={};let pointerDown=false;
document.addEventListener('pointerdown',()=>{pointerDown=true;},true);
['pointerup','pointercancel'].forEach(e=>document.addEventListener(e,()=>{setTimeout(()=>pointerDown=false,60);},true));
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;const f=ON[el.dataset.act];if(f){e.preventDefault();f(el,e);}});

/* ---------- sheets ---------- */
const Sheet={stack:[],
  open(o){const el=document.createElement('div');el.className='sheet'+(o.tall?' tall':'')+(o.modal?' modal':'');
    el.innerHTML='<div class="sh-grip"></div><div class="sh-hd"><div class="t"><h3></h3><p></p></div><button class="sh-x" data-act="sheetClose" aria-label="Close">'+I('x',20)+'</button></div><div class="sh-body"></div><div class="sh-foot"></div>';
    o.el=el;$('#sheets').appendChild(el);this.stack.push(o);this.paint(o);$('#sheets').classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
    this.drag(o);if(o.onOpen)o.onOpen(el);return o;},
  paint(o){o=o||this.top();if(!o)return;const el=o.el,body=$('.sh-body',el),st=body.scrollTop,v=f=>typeof f==='function'?f():f||'';
    $('h3',el).innerHTML=v(o.title);const sub=v(o.sub);$('.sh-hd p',el).innerHTML=sub;$('.sh-hd p',el).style.display=sub?'':'none';
    const ae=document.activeElement,typing=(ae&&body.contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))||window._rdDrag;
    const b=v(o.body);if(b!==o._b&&!(typing&&!o._force)){body.innerHTML=b;o._b=b;body.scrollTop=st;if(o.onPaint)o.onPaint(el);}o._force=false;
    const f=v(o.foot),ft=$('.sh-foot',el);if(f!==o._f){ft.innerHTML=f;o._f=f;}ft.style.display=f?'':'none';},
  top(){return this.stack[this.stack.length-1];},
  refresh(force){const o=this.top();if(o&&(!o.static||force)){if(force)o._force=true;this.paint(o);}},
  close(all){const o=this.stack.pop();if(!o)return;o.el.classList.remove('on');setTimeout(()=>o.el.remove(),320);if(o.onClose)o.onClose();
    if(!this.stack.length)$('#sheets').classList.remove('on');if(all&&this.stack.length)this.close(true);},
  drag(o){const hd=$('.sh-hd',o.el);let y0=null,dy=0;if(UI.device==='atlas')return;
    hd.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;y0=e.clientY;dy=0;o.el.style.transition='none';hd.setPointerCapture(e.pointerId);});
    hd.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);o.el.style.transform='translateY('+dy+'px)';});
    const end=()=>{if(y0==null)return;y0=null;o.el.style.transition='';o.el.style.transform='';if(dy>90&&Sheet.top()===o)Sheet.close();};
    hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);}
};
ON.sheetClose=()=>Sheet.close();
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('scrim'))Sheet.close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&Sheet.stack.length)Sheet.close();});

/* ---------- toasts, with undo ---------- */
function toast(msg,opt){opt=opt||{};const host=$('#toasts');if(!host)return;const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
  el.innerHTML='<span>'+msg+'</span>'+(opt.undo?'<button type="button">'+I('undo',15)+'Undo <b class="n">10</b></button>':'');
  host.appendChild(el);let left=opt.undo?10:0,iv=null;const kill=()=>{clearInterval(iv);el.remove();};
  if(opt.undo){const b=$('button',el);iv=setInterval(()=>{left--;$('b',b).textContent=left;if(left<=0)kill();},1000);b.addEventListener('click',()=>{kill();opt.undo();});}
  else setTimeout(kill,opt.ms||2800);}

/* ---------- the time bar: Open ── Day ── Sunset ── Night ── Close. It only moves the clock ---------- */
const TB_A=8,TB_Z=27;
const TBar={drag:false,el:null,
  toP(t){return clamp((hrs(t)-TB_A)/(TB_Z-TB_A),0,1);},
  toT(p){return W.D0+Math.round((TB_A+(TB_Z-TB_A)*p)*12)*5*MIN;},
  mount(slot){if(!slot)return;slot.innerHTML='<div class="tbar" data-tbar><div class="tb-track" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="100"><div class="tb-rail" style="gap:2px">'+PARTS.map(p=>'<i data-p="'+p[0]+'" style="flex:'+(p[3]-p[2])+'"></i>').join('')+'</div><i class="tb-fill"></i><i class="tb-sun"></i><i class="tb-now"></i><span class="tb-bub"></span><span class="tb-thumb"></span></div>'+
    '<div class="tb-lab parts" style="display:flex;gap:2px">'+PARTS.map(p=>'<span data-p="'+p[0]+'" style="flex:'+(p[3]-p[2])+'">'+p[1]+'</span>').join('')+'</div></div><div class="tb-read" id="tbRead"></div>';this.el=slot;this.bind();this.paint();},
  read(t){const sim=Clock.mode==='sim',p=partAt(t);
    return '<button class="tb-a" data-act="clock"><b class="n">'+fT(t)+'</b><span>'+PART_L[p]+(p==='day'||p==='sunset'?' · sunset '+N(fT(W.H(W.sun))):p==='night'?' · closes '+N('01:00'):p==='pre'?' · opens '+N('10:00'):'')+'</span></button><span class="tb-b">'+(sim?(Clock.speed!==1?'<em class="warn" style="font-style:normal;font-weight:700;font-size:11px">'+(Clock.speed?Clock.speed+'×':'PAUSED')+'</em>':'')+'<button class="tb-nowb" data-act="tbNow">'+I('undo',13)+'Now</button>':N(fD(t)))+'</span>';},
  paint(){const el=this.el;if(!el||!el.isConnected||!W)return;const t=now(),p=this.toP(t),pt=partAt(t);
    $('.tb-thumb',el).style.left=(p*100).toFixed(2)+'%';$('.tb-fill',el).style.width=(p*100).toFixed(2)+'%';$('.tb-track',el).setAttribute('aria-valuenow',Math.round(p*100));$('.tb-track',el).setAttribute('aria-valuetext',fT(t));
    $('.tb-sun',el).style.left=(this.toP(W.H(W.sun))*100).toFixed(2)+'%';
    const rn=Date.now(),nw=$('.tb-now',el);if(Clock.mode==='sim'&&dayOf(rn)===W.D0&&hrs(rn)>=TB_A&&hrs(rn)<=TB_Z){nw.style.display='';nw.style.left=(this.toP(rn)*100).toFixed(2)+'%';}else nw.style.display='none';
    $$('.tb-lab span',el).forEach(s=>s.classList.toggle('on',s.dataset.p===pt));$$('.tb-rail i',el).forEach(s=>s.classList.toggle('on',s.dataset.p===pt));$('.tb-bub',el).textContent=fT(t);$('.tb-bub',el).style.left=(p*100).toFixed(2)+'%';
    const r=$('#tbRead',el),h=this.read(t);if(r._h!==h){r.innerHTML=h;r._h=h;}},
  commit(t,final){Clock.set(t,Clock.mode==='sim'&&Clock.speed!==1?Clock.speed:1);_snap=null;this.paint();const ph=part();if(ph!==UI._pt){haptic(12);applyPhase(final);}else if(final)renderAll();else refresh(true);},
  bind(){const tr=$('.tb-track',this.el),self=this;let raf=0,pend=null,last=0,pid=null;
    const pAt=e=>{const r=tr.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1);};
    const loop=()=>{raf=0;if(pend==null)return;const t=pend;pend=null;Clock.set(t,1);self.paint();const n=performance.now();if(n-last>160){last=n;self.commit(t,false);}};
    tr.addEventListener('pointerdown',e=>{pid=e.pointerId;tr.setPointerCapture(pid);self.drag=true;self.el.classList.add('drag');pend=self.toT(pAt(e));if(!raf)raf=requestAnimationFrame(loop);});
    tr.addEventListener('pointermove',e=>{if(!self.drag||e.pointerId!==pid)return;pend=self.toT(pAt(e));if(!raf)raf=requestAnimationFrame(loop);});
    const end=e=>{if(!self.drag||e.pointerId!==pid)return;self.drag=false;self.el.classList.remove('drag');const t=self.toT(pAt(e));pend=null;cancelAnimationFrame(raf);raf=0;self.commit(t,true);haptic(8);};
    tr.addEventListener('pointerup',end);tr.addEventListener('pointercancel',end);
    tr.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();self.commit(clamp(now()+(e.key==='ArrowRight'?15:-15)*MIN,W.H(TB_A),W.H(TB_Z)),true);}});}
};

let _nowT=null;
M.donow={t:'Do now',hero:s=>{const sec=mySec(),T=tasksFor(UI.role==='runner'?null:sec,s).filter(x=>UI.role!=='runner'||x.act==='deliver'),x=T[0];_nowT=x||null;

function attachHold(){const card=$('#nowCard');if(!card||card._w)return;card._w=1;const fill=$('#nowFill'),arc=$('#nowArc'),x=_nowT;if(!x)return;let sx=0,sy=0,dx=0,dy=0,down=false,moved=false,raf=0,t0=0,done=false;
  const set=f=>{if(arc)arc.setAttribute('stroke-dashoffset',(119.4*(1-f)).toFixed(1));if(fill)fill.style.height=(f*100)+'%';},reset=()=>{cancelAnimationFrame(raf);raf=0;card.classList.remove('holding');set(0);};
  const step=()=>{const p=Math.min(1,(performance.now()-t0)/620);set(p);if(p>=1){finish();return;}raf=requestAnimationFrame(step);};
  const finish=()=>{if(done)return;done=true;down=false;haptic([10,28,12]);W.done[x.k]=now();const b=x.b;let msg='Done.';
    if(x.act==='deliver'){Act.deliver(b,x.o);msg=esc(x.o.nm)+' delivered to '+esc(x.u.label)+'.';}else if(x.act==='seat'){Act.seat(b);msg=esc(bName(b))+' seated at '+esc(x.u.label)+'.';}else{log('Task done',x.title+' · '+uName(x.u));bump();}
    card.style.transition='transform .28s ease,opacity .28s';card.style.transform='scale(.96)';card.style.opacity='0';setTimeout(()=>{pointerDown=false;refresh(true);const n=$('#nowCard');if(n)n.style.animation='nowIn .34s var(--ease)';if(x.act==='open')openUnit(x.u.id,b.id);},260);toast(msg,{ms:1800});};
  const skip=()=>{done=true;const mx=Math.max(0,...Object.values(W.skipN));W.skipN[x.k]=mx+1;card.style.transition='transform .3s ease,opacity .3s';card.style.transform='translate3d('+dx*4+'px,'+dy*4+'px,0) rotate('+dx*.05+'deg)';card.style.opacity='0';setTimeout(()=>{pointerDown=false;_snap=null;refresh(true);const n=$('#nowCard');if(n)n.style.animation='nowIn .34s var(--ease)';},240);};
  card.addEventListener('pointerdown',e=>{if(e.button)return;down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;card.style.transition='none';try{card.setPointerCapture(e.pointerId);}catch(_){}card.classList.add('holding');t0=performance.now();haptic(6);raf=requestAnimationFrame(step);});
  card.addEventListener('pointermove',e=>{if(!down||done)return;dx=e.clientX-sx;dy=e.clientY-sy;const d=Math.hypot(dx,dy);if(!moved&&d>8){moved=true;reset();}if(moved){card.style.transform='translate3d('+dx+'px,'+dy+'px,0) rotate('+(dx*.014)+'deg)';card.classList.toggle('skipping',d>12);}});
  const fin=()=>{if(!down||done)return;down=false;const d=Math.hypot(dx,dy);if(moved&&d>60)skip();else{reset();card.style.transition='transform .3s cubic-bezier(.22,.68,.32,1.25)';card.style.transform='';card.classList.remove('skipping');}};
  card.addEventListener('pointerup',fin);card.addEventListener('pointercancel',fin);}

   80 · the direct line to the guest

const CH={wa:['msg','WhatsApp'],ig:['ig','Instagram'],web:['spark','Sirene booking page']};
const dayLabel=d=>d===0?'Today':d===1?'Tomorrow':fD(W.D0+d*DAY+12*HOUR);
function withDay(d,fn){if(!d)return fn();const D=W.D0+d*DAY,Wd=Worlds[D]||(Worlds[D]=buildWorld(D)),k=W;W=Wd;try{return fn();}finally{W=k;}}
const sessWin=(sess,sec)=>sess==='lunch'?[13,15]:sess==='dinner'?[20.5,22.3]:sess==='sunset'?[17,19]:sess==='night'?[21,25]:[10,W.sun];
const SVC={lunch:[12.5,15,13],dinner:[18.5,22.75,20.5],sunset:[16.5,19,17]};
const SLOTS={};Object.keys(SVC).forEach(k=>{const v=SVC[k],L=[];for(let h=v[0];h<=v[1]+.001;h+=.25)L.push(h);SLOTS[k]=L.sort((x,y)=>Math.abs(x-v[2])-Math.abs(y-v[2])||x-y);});
function slotOn(q,d,sess,party){return withDay(d,()=>{const qq=W.U[q.id],t=d?W.H(8):Math.max(now(),W.H(8));
  if(sess==='day'){const a=Math.max(W.H(10),d?0:now());return a<W.H(W.sun-1)&&freeFor(qq,a,W.H(W.sun),t)?a:0;}
  if(sess==='night'){const a=Math.max(W.H(21),d?0:now());return a<W.H(24.5)&&freeFor(qq,a,W.H(25),t)?a:0;}
  for(const h of SLOTS[sess]){const a=W.H(h),dur=defDur(qq,party,a);if(!d&&a<now()+10*MIN)continue;if(freeFor(qq,a,a+dur*MIN,t))return a;}return 0;});}
const lsSlot=q=>slotOn(q,LS.day,LS.sess,LS.party);
const lsMeal=()=>LS.sess==='lunch'||LS.sess==='dinner'||LS.sess==='sunset';
const lsAt=id=>lsMeal()?' · '+fT(lsSlot(W.U[id])):'';

function thRow(th,t,on){const G=th.g>=0?GUESTS[th.g]:null,l=thLast(th,t),u=unread(th,t),nr=needsReply(th,t),dn=th.done&&th.done<=t;return '<button class="th '+(u?'un ':'')+(on?'on ':'')+(dn?'dn':'')+'" data-act="thread" data-id="'+th.id+'"><span class="th-av '+(G?'t'+G.tier:'')+'">'+esc(G?initials(G.n):th.name.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()||'#')+'<i class="ch-'+th.ch+'">'+I(CH[th.ch][0],11)+'</i></span><span class="th-t"><b>'+esc(th.name)+(G&&G.tier===2?' <span class="vipc">★</span>':'')+'</b><span>'+(l.who==='us'?TICK(waSt(l,t))+' ':l.who==='bot'?'Auto-reply: ':l.who==='sys'?'':l.who==='dylan'?'Dylan: ':'')+esc(l.m)+'</span></span><span class="th-r"><span class="n">'+(t-l.at<DAY/2?fT(l.at):fDS(l.at))+'</span>'+(u?'<span class="th-n">'+u+'</span>':dn?'<span class="th-ok">'+I('check',12)+'</span>':nr?tag('warn',null,'Reply'):tag('mut',null,th.tag))+'</span></button>';}
const threadsAt=t=>W.threads.filter(th=>thVisible(th,t)).sort((a,b)=>thLast(b,t).at-thLast(a,t).at);
const TF=[['all','All'],['un','Unread'],['nr','Needs reply'],['lk','Links'],['dn','Done']];
function thFilter(T,t,f){return f==='un'?T.filter(th=>unread(th,t)):f==='nr'?T.filter(th=>needsReply(th,t)):f==='lk'?T.filter(th=>W.links.some(l=>(th.g>=0&&l.g===th.g||l.name===th.name)&&l.sentAt<=t)):f==='dn'?T.filter(th=>th.done&&th.done<=t):T;}
function waStats(t){const T=threadsAt(t);let n=0,rs=0,rn=0;T.forEach(th=>{const M=th.msgs.filter(m=>m.at<=t);n+=M.length;const fi=M.find(m=>!fromUs(m)&&m.at>=W.H(10)),fu=fi&&M.find(m=>m.who==='us'&&m.at>fi.at);if(fu){rs+=fu.at-fi.at;rn++;}});return {T,chats:T.length,msgs:n,nr:T.filter(th=>needsReply(th,t)).length,un:T.filter(th=>unread(th,t)).length,avg:rn?Math.round(rs/rn/MIN):0};}

  return '<div class="wa-h '+(on?'':'off')+'"><span class="wa-ic">'+I('msg',18)+'</span><div><b>WhatsApp Business API</b><span>'+(on?'Connected · <span class="n">'+esc(VENUE.wa)+'</span> · webhook live':'Switched off in the stack. Nothing is sent or received.')+'</span></div><span class="wa-live"><i></i>'+(on?'Live':'Off')+'</span></div>'+
    '<div class="wa-k"><div><b class="n">'+x.chats+'</b><span>chats today</span></div><div><b class="n">'+x.msgs+'</b><span>messages</span></div><div class="'+(x.nr?'warn':'')+'"><b class="n">'+x.nr+'</b><span>need a reply</span></div><div><b class="n">'+(x.avg?x.avg+'m':'—')+'</b><span>first reply</span></div></div>'+

ON.thF=el=>{UI.line.f=el.dataset.f;Line._h='';if(UI.device==='atlas'){Atlas._lt='';const L=$('#alList');if(L)L._h='';Atlas.lineUpdate(true);}else Line.update(true);};
function intentChips(th){const i=th.intent,c=[];if(i.day!=null)c.push(tag('neu','cal',dayLabel(i.day)));if(i.party)c.push(tag('neu','users',i.party+' guests'));if(i.sec)c.push(tag('neu','pin',SEC[i.sec].l+(i.zone?' · '+i.zone:'')));if(i.occ)c.push(tag('neu','gift',i.occ));if(i.hold)c.push(tag('warn','clock','Running late'));if(i.list)c.push(tag('neu','list','Guestlist'));if(i.info)c.push(tag('mut','note','Asking for prices'));if(i.park)c.push(tag('mut','pin','Directions'));if(i.dress)c.push(tag('mut','note','Dress code'));if(i.lost)c.push(tag('warn','alert','Lost item'));if(i.cancel)c.push(tag('warn','x','Cancel or move'));if(i.chg)c.push(tag('neu','users','Party size change'));if(i.thanks)c.push(tag('ok','star','Thank-you'));return c.join('');}
function draftsFor(th){const i=th.intent,G=th.g>=0?GUESTS[th.g]:null,fn=G?G.n.split(' ')[0]:'',D=[];
  if(i.hold){const b=W.B[i.hold];if(b)D.push('Of course'+(fn?' '+fn:'')+'. '+uName(W.U[b.unit])+' is held for you until '+fT(Math.max(b.rel,b.at+60*MIN))+'. See you soon.');}
  if(i.list)D.push((fn?fn+', you':'You')+' are on the list for Little Mykonos tonight with '+(i.party-1)+' guests. Doors at 22:00, name at the door. Want me to hold a table instead? I can send you the ones still free.');
  if(i.info)D.push('Hello and thank you for getting in touch. Pool sunbeds are AED 300 per guest and beach sunbeds AED 200, both credited on food and drinks. Children under 12 are free. Shall I set two aside for you?');
  if(i.park)D.push('Valet is at the J1 entrance and complimentary for our guests. The door is on the beach walk, past the fountain.');
  if(i.dress)D.push('Smart beachwear by day and elegant after sunset. No sportswear or flip-flops at Little Mykonos.');
  if(i.lost)D.push('So sorry'+(fn?' '+fn:'')+'. I have asked lost and found to check the spot and the pool. I will message you within the hour.');
  if(i.cancel)D.push('No problem'+(fn?' '+fn:'')+', it is cancelled with no charge. Shall I hold the same for next week?');
  if(i.chg)D.push('Of course'+(fn?' '+fn:'')+', I have updated it to '+(i.party||'the new number')+'. See you soon.');
  if(i.thanks)D.push('Thank you'+(fn?' '+fn:'')+', it was a pleasure having you. See you very soon!');

  D.push('Thank you'+(fn?' '+fn:'')+', leave it with me. I will come back to you within a few minutes.');return D.slice(0,2);}
function lkCard(l,t,inChat){const st=linkSt(l,t),dead=st.i<0,lv=l.lvl||0;return '<button class="lk '+(lv>=2?'vip':'')+'" data-act="linkOpen" data-id="'+l.id+'"><span class="lk-h"><span class="ri '+(st.c==='mut'?'':st.c)+'" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card2)">'+I('link',17)+'</span><div><b>'+(inChat?'Custom link':esc(l.name))+(lv?' <span class="lvt l'+lv+'">'+LVL[lv].l+'</span>':'')+'</b><span>'+esc(dayLabel(l.day))+' · '+esc(SESS_L[l.sess])+' · '+l.party+' guests · '+l.units.length+' spots</span></div>'+tag(st.c,null,st.l)+'</span>'+

M.tomorrow.tile=s=>{const L=W.week;return GC('acc',gt({tone:'acc',ic:'cal',tag:L[0].conf+'% conf',l:'Locked · next 6 days',v:canMoney()?pre('AED')+kfmt(sum(L,d=>d.locked)):n0(sum(L,d=>d.covers)),u:canMoney()?'':'covers',viz:vzBars(L.map(d=>d.locked),{lab:L.map(d=>DOW[g(d.D0+12*HOUR).getUTCDay()].slice(0,2)),h:40,cls:L.map(d=>d.ev?'c-gold':'')}),sub:N(n0(L[0].covers))+' covers booked for tomorrow'}));};

M.events.tile=s=>{const t=s.t,m=s.sec.myk,gl=W.glist.length,inn=W.glist.filter(x=>x.inAt&&x.inAt<=t).length,night=hrs(t)>=21.5;
  if(night)return GC('gold',gt({tone:'gold',ic:'music',tag:'doors open',l:'Little Mykonos · in now',v:n0(s.crowd.club),u:'of '+n0(VENUE.clubCap),viz:vzSeg([{v:s.crowd.club,c:'gold',l:'In the club'},{v:Math.max(0,VENUE.clubCap-s.crowd.club),c:'line2',l:'Capacity left'}],{leg:1}),sub:N(m.booked)+' of 10 tables · '+N(inn)+' of '+N(gl)+' on the list in'}));
  return GC('gold',gt({tone:'gold',ic:'music',tag:'tonight',l:'Little Mykonos',v:m.booked,u:'of 10 tables',viz:vzSeg([{v:m.booked,c:'gold',l:m.booked+' tables'},{v:10-m.booked,c:'line2',l:(10-m.booked)+' open'}],{leg:1}),sub:N(gl)+' on the list · doors '+N('22:00')}));};

M.follow.tile=s=>{const L=followList(s),c=k=>L.filter(x=>x.k[0]===k).length;
  return GC('acc',gt({tone:'acc',ic:'send',tag:N(L.filter(x=>W.sent[x.k]).length)+' sent',l:'Follow-ups ready',v:L.length,u:'messages',viz:vzSeg([{v:c('r'),c:'bad',l:c('r')+' recoveries'},{v:c('t'),c:'gold',l:c('t')+' thank-yous'},{v:c('o'),c:'cyan',l:c('o')+' occasions'},{v:c('n'),c:'acc',l:c('n')+' invites'},{v:c('m'),c:'warn',l:c('m')+' missed'}],{leg:1})}),true);};

M.rules={t:'Booking rules'};M.rules.tile=s=>{const on=SEC_ORDER.filter(k=>RULES[k].sess.some(x=>x.mode!=='closed')).length,rd=SEC_ORDER.filter(k=>RULES[k].ready).length;
  return GC('cyan',gt({tone:'cyan',ic:'filter',tag:rd?rd+' of 8 set today':'on the floor',l:'How guests book',v:on,u:'sections online',viz:'<div class="vmodes">'+SEC_ORDER.map(k=>{const m=RULES[k].sess[0].mode;return '<span class="m-'+m+'">'+esc(SEC[k].s)+'</span>';}).join('')+'</div>'}));};
M.rules.go=()=>{Sheet.close(true);floorMode('rules');};

/* the door: everyone in the venue right now, not only the parties on a spot */
M.door={t:'In the venue',tile:s=>{const c=dayCurves().occ,ni=clamp(Math.floor((hrs(s.t)-10)/.5),0,c.length-1),tone='cyan';
  return GC(tone,gt({tone,ic:'gate',tag:'door count',l:'In the venue now',v:n0(s.covIn),u:'of '+n0(VENUE.cap),viz:vzArea(c,{now:ni,h:38}),sub:(s.crowd.club?N(n0(s.crowd.club))+' in the club · ':s.crowd.bar?N(n0(s.crowd.bar))+' at the bars · ':'')+N(n0(s.crowd.entries))+' through the door'}));},go:()=>{if(ROLES[UI.role].tabs.includes('door')&&UI.device!=='atlas'){UI.door=UI.door||{view:'arr',q:''};UI.door.view='in';setTab('door');}else openMod('hourly');}};
['manager','host'].forEach(r=>['day','sunset','night'].forEach(p=>{const L=HOME[r][p];if(!L.includes('door'))L.splice(Math.min(L.length,r==='manager'?4:2),0,'door');}));

/* ---------- the money hero, OPS style: the number, the day's curve, where it came from ---------- */
function revCum(s){const c=dayCurves().rev,cum=[0];let a=0;c.forEach(v=>{a+=v;cum.push(a);});const ni=clamp(Math.floor(hrs(s.t)-10),0,cum.length-1);return {cum,ni};}
M.position.hero=s=>{const pt=part(),S2=s.sec,beach=S2.beachR.spend+S2.beachL.spend+S2.pool.spend,cab=S2.cabanas.spend+S2.lounge.spend,rest=S2.rest.spend+S2.terrace.spend,myk=S2.myk.spend,e=engStats(s);
  if(pt==='pre'){const prepaid=s.fees+s.dep;return '<div class="hud hero hx"><div class="hx-t"><span class="lbl"><i class="lv"></i>Today · before open</span><button class="btn xs" data-act="week">'+I('cal',14)+'Week ahead</button></div>'+
    '<div class="big n"><small class="pre">AED</small>'+kfmt(prepaid)+'<small>paid before open</small></div><p class="hx-s">Forecast <b class="n">'+AK(s.fcLo)+'</b> to <b class="n">'+AK(s.fcHi)+'</b> by close · '+N(n0(s.covBook))+' covers on the book</p>'+
    vzSeg([{v:s.fees,c:'slate',l:'Entry fees '+AK(s.fees)},{v:s.dep,c:'acc',l:'Deposits '+AK(s.dep)},{v:Math.max(0,s.fc-prepaid),c:'line2',l:'Still to come '+AK(Math.max(0,s.fc-prepaid)),hatch:1}],{leg:1})+
    '<div class="kp4"><div><b class="n">'+N(sum(SEC_ORDER,k=>S2[k].booked))+'</b><span>Bookings</span></div><div><b class="n">'+N(s.unplaced.length+s.pencil)+'</b><span>To place</span></div><div><b class="n">'+W.wx(W.H(13)).temp+'°</b><span>At 13:00</span></div><div class="hot"><b class="n">'+SEC_ORDER.filter(k=>RULES[k].ready).length+'/8</b><span>Sections set</span></div></div></div>';}
  const tot=s.total,left=Math.max(0,s.fc-tot),rm=revLast(s.t,30),rc=revCum(s),up=s.fc>0?Math.round(tot/s.fc*100):0;
  return '<div class="hud hero hx"><div class="hx-t"><span class="lbl"><i class="lv"></i>Live revenue · today</span><button class="btn xs" data-act="mod" data-id="hourly">'+I('chart',14)+'By hour</button></div>'+
    '<div class="big n"><small class="pre">AED</small>'+kfmt(tot)+'<small>so far</small></div><p class="hx-s"><span class="up">▲ '+up+'% of forecast</span> on pace for <b class="n">'+AK(s.fc)+'</b> · range '+AK(s.fcLo)+' to '+AK(s.fcHi)+'</p>'+
    '<div class="hx-ch">'+vzArea(rc.cum,{now:rc.ni,h:50,w:300})+'<div class="hx-ax n"><span>10:00</span><span>14:00</span><span>18:00</span><span>22:00</span><span>01:00</span></div></div>'+
    vzSeg([{v:s.fees,c:'slate',l:'Entry '+AK(s.fees)},{v:beach,c:'acc',l:'Beach and pool '+AK(beach)},{v:cab,c:'cyan',l:'Cabanas and lounge '+AK(cab)},{v:rest,c:'ok',l:'Restaurant '+AK(rest)},{v:myk,c:'gold',l:'Mykonos tables '+AK(myk)},{v:s.bar,c:'orange',l:'Bars and club '+AK(s.bar)},{v:left,c:'line2',l:'Still to come '+AK(left),hatch:1}].filter(x=>x.v>0),{leg:1})+
    '<div class="kp4"><div><b class="n">'+N(n0(s.covIn))+'</b><span>In venue</span></div><div><b class="n">'+N(n0(s.per))+'</b><span>Per cover</span></div><div><b class="n">'+N(n0(rm))+'</b><span>AED / min</span></div><div class="hot"><b class="n">+'+e.covDay+'</b><span>Engine</span></div></div></div>';};

/* ---------- before open: walk the floor and set every section ---------- */
M.setup={t:'Pre-open setup',hero:s=>{const rd=SEC_ORDER.filter(k=>RULES[k].ready),pub=W.rulesPub;
  return '<div class="hud hero hx"><div class="hx-t"><span class="lbl"><i class="lv"></i>Pre-open setup · '+fD(W.D0+12*HOUR)+'</span>'+(pub?tag('ok','check','Published '+fT(pub.at)):tag('warn','clock','Doors 10:00'))+'</div>'+
    '<div class="su-h">'+vzRing(rd.length/8,rd.length+'/8',{size:74})+'<div><div class="h2">'+(pub?'Rules are live for today':rd.length?'Keep walking the floor':'Walk the floor, section by section')+'</div><p class="sub">Holding times, deposits, walk-in share, pacing and spots out of service. Set each section once and publish before the doors open.</p></div></div>'+
    '<div class="su-l">'+SEC_ORDER.map(k=>{const R=RULES[k],m=R.sess[0].mode;return '<button class="su-r" data-act="setupGo" data-k="'+k+'"><i class="m-'+m+'"></i><b>'+esc(SEC[k].l)+'</b><span class="n">'+R.hold+'m hold · '+(R.sess[0].dep?'AED '+R.sess[0].dep:'no dep')+'</span>'+(R.ready?'<em class="ok">'+I('check',14)+'</em>':'<em>'+I('right',14)+'</em>')+'</button>';}).join('')+'</div>'+
    '<button class="btn pri full" data-act="setupGo" style="margin-top:12px">'+I('floor',17)+(rd.length?'Continue on the floor':'Start on the floor')+'</button></div>';},
};
['manager','res'].forEach(r=>{const L=HOME[r].pre;if(!L.includes('setup'))L.unshift('setup');const i=L.indexOf('rules');if(i>=0&&r==='manager')L.splice(i,1);});

/* ==== 99-boot.js ==== */
/* ============================================================
   99 · boot
   ============================================================ */
function boot(){
  Object.keys(FONTS).forEach(k=>{try{const ff=new FontFace(FAM[k.slice(0,2)],b64bytes(FONTS[k].b64).buffer,{weight:k[2]==='5'?'100 599':'600 900'});ff.load().then(x=>document.fonts.add(x)).catch(()=>{});}catch(_){}});
  loadDay(dayOf(now()));const app=$('#app');app.dataset.phase=phase();app.dataset.part=part();UI._ph=phase();UI._pt=part();layout();
  let lw=window.innerWidth;window.addEventListener('resize',()=>{const w=window.innerWidth;if((w>=900)!==(lw>=900)){lw=w;layout();}else{lw=w;if(Floor.host&&Floor.host.isConnected&&Floor.atFit)Floor.fit(true);}});
  setInterval(tick,1000);
  /* test hook: lets the build be verified at any hour and role without touching the UI */
  window.BUBL={UI,Clock,S,W:()=>W,jump:h=>{Clock.set(W.H(h),1);_snap=null;applyPhase();},role:r=>{UI.role=r;if(!ROLES[r].tabs.includes(UI.tab))UI.tab='home';renderAll();},tab:k=>setTab(k),av:k=>ON.av({dataset:{v:k}}),open:openMod,unit:openUnit,ON,Floor,Agent,FA,Sheet,pdf:()=>pdfBytes(buildReport()),engStats:()=>engStats(S()),studio:openStudio,applyLinks};
}
document.addEventListener('DOMContentLoaded',boot);
