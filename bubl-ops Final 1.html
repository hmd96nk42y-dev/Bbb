<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>BUBL</title>
<meta name="theme-color" content="#08060f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="BUBL"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--c-guest:#D4A0B8;--c-staff:#E0B257;--c-kitchen:#E89A4F;--c-owner:#7B4FB8;--acc:var(--c-guest);
        --sat:env(safe-area-inset-top,0px);}
  html,body{height:100%;width:100%;overflow:hidden;background:#08060f;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}

  /* Default (Safari tab): inset:0 + 100% works perfectly. */
  iframe#screen{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;z-index:1;
    background:transparent;opacity:0;transition:opacity .4s ease;}
  /* STANDALONE ONLY: html/body get .pwa, and we drive the iframe height from JS in px.
     In standalone, inset:0/100%/100% measure short against iOS's broken ICB; an explicit
     px height from the live measurement is the only thing that fills to the true bottom. */
  body.pwa #screen{height:var(--ph,100%);}
  iframe#screen.ready{opacity:1;}
  @media(min-width:640px){
    iframe#screen{width:min(440px,100vw);left:50%;transform:translateX(-50%);
      box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 120px -30px rgba(0,0,0,.7);}
  }

  /* notch band keeps the iOS clock legible regardless of app colour */
  .topscrim{position:fixed;top:0;left:0;right:0;height:var(--sat);z-index:900;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,0));}

  .loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
    pointer-events:none;opacity:0;transition:opacity .25s ease;}
  .loader.on{opacity:1;}
  .loader .ring{width:30px;height:30px;border-radius:50%;
    border:2.5px solid rgba(150,150,160,.3);border-top-color:rgba(150,150,160,.85);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── small visible draggable switch button ── */
  #scrim{position:fixed;inset:0;z-index:998;background:transparent;display:none;}
  #scrim.on{display:block;}
  #sbtn{position:fixed;z-index:1000;width:46px;height:46px;border-radius:50%;cursor:grab;touch-action:none;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 32%, rgba(150,120,210,.95), rgba(18,11,30,.94) 82%);
    border:1.5px solid var(--acc);
    box-shadow:0 7px 18px -4px rgba(0,0,0,.62),0 0 0 3px rgba(0,0,0,.2),inset 0 1px 1px rgba(255,255,255,.28);
    opacity:.95;transition:transform .14s ease;}
  #sbtn:active{cursor:grabbing;transform:scale(.93);}
  #sbtn svg{width:19px;height:19px;color:#fff}
  #sbtn .pr{position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--acc);opacity:0;animation:hello 2.2s ease 2;}
  @keyframes hello{0%{opacity:.7;transform:scale(1)}60%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
  #menu{position:fixed;z-index:1001;width:216px;left:0;top:0;transform:scale(.9);opacity:0;pointer-events:none;
    transform-origin:bottom right;background:rgba(14,9,22,.94);border:1px solid rgba(255,255,255,.10);
    border-radius:18px;padding:7px;box-shadow:0 24px 60px -16px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    transition:transform .2s cubic-bezier(.2,.9,.3,1.15),opacity .18s ease;}
  #switcher.open #menu{transform:scale(1);opacity:1;pointer-events:auto;}
  #menu .mh{font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.34);padding:7px 10px 8px;}
  #menu button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;
    cursor:pointer;font-family:inherit;padding:9px 10px;border-radius:11px;transition:background .15s;}
  #menu button:hover{background:rgba(255,255,255,.06)}
  #menu button[aria-selected="true"]{background:rgba(255,255,255,.10)}
  #menu .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
  #menu .lab{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  #menu .nm{font-size:13px;font-weight:700;color:#fff}
  #menu .rl{font-size:10px;font-weight:500;color:rgba(255,255,255,.42)}
  #menu .chk{margin-left:auto;color:#fff;opacity:0;font-size:13px}
  #menu button[aria-selected="true"] .chk{opacity:.9}
  #menu button[data-app="guest"] .dot{background:var(--c-guest);color:var(--c-guest)}
  #menu button[data-app="staff"] .dot{background:var(--c-staff);color:var(--c-staff)}
  #menu button[data-app="kitchen"] .dot{background:var(--c-kitchen);color:var(--c-kitchen)}
  #menu button[data-app="owner"] .dot{background:var(--c-owner);color:var(--c-owner)}
</style>
</head>
<body>
  <iframe id="screen" title="BUBL app"></iframe>
  <div class="topscrim"></div>
  <div class="loader" id="loader"><div class="ring"></div></div>
  <div id="scrim"></div>
  <div id="switcher">
    <div id="menu" role="menu" aria-label="Switch BUBL view">
      <div class="mh">BUBL Ops</div>
      <button role="menuitem" data-app="staff"   aria-selected="true"><span class="dot"></span><span class="lab"><span class="nm">Staff</span><span class="rl">FOH floor</span></span><span class="chk">✓</span></button>
      <button role="menuitem" data-app="kitchen" aria-selected="false"><span class="dot"></span><span class="lab"><span class="nm">Kitchen</span><span class="rl">BOH line</span></span><span class="chk">✓</span></button>
      <button role="menuitem" data-app="owner"   aria-selected="false"><span class="dot"></span><span class="lab"><span class="nm">Owner</span><span class="rl">Dashboard</span></span><span class="chk">✓</span></button>
    </div>
    <div id="sbtn" title="Tap to switch · drag to move" aria-label="Switch view">
      <span class="pr"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h11M4 9l3-3M4 9l3 3"/><path d="M20 15H9M20 15l-3-3M20 15l-3 3"/>
      </svg>
    </div>
  </div>

const frame=document.getElementById("screen"),loader=document.getElementById("loader");
const menu=document.getElementById("menu"),btn=document.getElementById("sbtn");

function b64ToUtf8(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder("utf-8").decode(u);}

let current=null;
function switchTo(k){if(!APPS[k])return;closeMenu();if(k===current)return;current=k;
  [...menu.querySelectorAll("button")].forEach(b=>b.setAttribute("aria-selected",b.dataset.app===k));
  document.documentElement.style.setProperty("--acc","var("+META[k]+")");
  document.body.style.background=BG[k];                 /* notch/surround = app colour, never purple */
  frame.classList.remove("ready");loader.classList.add("on");
  requestAnimationFrame(()=>{frame.srcdoc=b64ToUtf8(APPS[k]);});}
frame.addEventListener("load",()=>{if(!current)return;loader.classList.remove("on");frame.classList.add("ready");});

   normal Safari tab this whole block is skipped and the default inset:0/100% is used. */
(function(){
  var isStandalone = (window.navigator.standalone===true) ||
                     (window.matchMedia && window.matchMedia('(display-mode:standalone)').matches);
  if(!isStandalone) return;
  document.body.classList.add('pwa');
  function setPH(){
    /* in standalone the layout viewport equals the full screen; take the largest
       trustworthy measure to avoid the toolbar-short value */
    var h = Math.max(
      document.documentElement.clientHeight||0,
      window.innerHeight||0,
      (window.visualViewport&&window.visualViewport.height)||0
    );
    if(h>200){ document.documentElement.style.setProperty('--ph', h+'px'); }
  }
  setPH();
  [50,200,500,1000].forEach(function(t){setTimeout(setPH,t);});
  window.addEventListener('resize',setPH);
  window.addEventListener('orientationchange',function(){setTimeout(setPH,150);setTimeout(setPH,500);});
  window.addEventListener('pageshow',setPH);
  if(window.visualViewport){window.visualViewport.addEventListener('resize',setPH);}
})();

function openMenu(){const r=btn.getBoundingClientRect(),mw=216,mh=menu.offsetHeight||236;
  let left=r.right-mw, top=r.top-mh-10; if(top<10) top=r.bottom+10;
  left=Math.max(10,Math.min(window.innerWidth-mw-10,left)); top=Math.max(10,Math.min(window.innerHeight-mh-10,top));
  menu.style.left=left+"px";menu.style.top=top+"px";menu.style.transformOrigin=(top<r.top?"bottom":"top")+" right";
  sw.classList.add("open");scrim.classList.add("on");}
function closeMenu(){sw.classList.remove("open");scrim.classList.remove("on");}
function toggleMenu(){sw.classList.contains("open")?closeMenu():openMenu();}
scrim.addEventListener("click",closeMenu);
menu.addEventListener("click",e=>{const b=e.target.closest("button[data-app]");if(b)switchTo(b.dataset.app);});

let pos={x:0,y:0},drag=false,moved=false,start={x:0,y:0},off={x:0,y:0};
function clampBtn(){const m=10,s=46;pos.x=Math.max(m,Math.min(window.innerWidth-s-m,pos.x));pos.y=Math.max(m,Math.min(window.innerHeight-s-m,pos.y));btn.style.left=pos.x+"px";btn.style.top=pos.y+"px";}
function placeBtn(){pos.x=window.innerWidth-46-16;pos.y=Math.round(window.innerHeight*0.72);clampBtn();}
btn.addEventListener("pointerdown",e=>{drag=true;moved=false;start={x:e.clientX,y:e.clientY};off={x:e.clientX-pos.x,y:e.clientY-pos.y};btn.setPointerCapture(e.pointerId);});
btn.addEventListener("pointermove",e=>{if(!drag)return;if(Math.abs(e.clientX-start.x)+Math.abs(e.clientY-start.y)>6)moved=true;if(moved){pos.x=e.clientX-off.x;pos.y=e.clientY-off.y;clampBtn();if(sw.classList.contains("open"))closeMenu();}});
btn.addEventListener("pointerup",()=>{drag=false;if(!moved)toggleMenu();});
window.addEventListener("resize",clampBtn);
window.addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="4"){switchTo(ORDER[+e.key-1]);return;}const i=ORDER.indexOf(current),n=ORDER.length;if(e.key==="ArrowRight")switchTo(ORDER[(i+1)%n]);if(e.key==="ArrowLeft")switchTo(ORDER[(i+n-1)%n]);if(e.key==="Escape")closeMenu();});

placeBtn();switchTo("staff");
</script>
