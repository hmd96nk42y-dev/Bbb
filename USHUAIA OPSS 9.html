<style>
/* ============================================================
   BUBL OPS · Ushuaïa operator · tokens and phase themes
   PRE calm dark · LIVE pure black, max contrast · POST bone and brass
   green / amber / red are states only and never re-skinned
   ============================================================ */
:root{
  --disp:'Space Grotesk',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
#app,#app[data-phase="pre"]{
  --bg:#0B0C10;--bg2:#101218;--card:#14161D;--card2:#1B1E27;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --t1:#FFFFFF;--t2:rgba(255,255,255,.80);--t3:rgba(255,255,255,.55);--t4:rgba(255,255,255,.32);
  --gold:#E0B257;--gold-d:#B98A33;--gold-s:#F0CE8C;--gold-bg:rgba(224,178,87,.12);--gold-bd:rgba(224,178,87,.38);--on-gold:#17110A;
  --ok:#34D399;--ok-bg:rgba(52,211,153,.13);--ok-bd:rgba(52,211,153,.45);
  --warn:#FBBF24;--warn-bg:rgba(251,191,36,.13);--warn-bd:rgba(251,191,36,.45);
  --bad:#F87171;--bad-bg:rgba(248,113,113,.13);--bad-bd:rgba(248,113,113,.45);
  --g1:#ECECEF;--g2:#A6A8B1;--g3:#6A6D77;--g4:#3A3D46;
  --gap:12px;--pad:16px;--hero:40px;--scrim:rgba(0,0,0,.6);
}
#app[data-phase="live"]{
  --bg:#000000;--bg2:#0A0A0C;--card:#0C0C0F;--card2:#16161A;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.26);
  --t2:rgba(255,255,255,.88);--t3:rgba(255,255,255,.62);--t4:rgba(255,255,255,.38);
  --gap:10px;--pad:14px;--hero:54px;
}
#app[data-phase="post"]{
  --bg:#0B0B0E;--bg2:#111116;--card:#15151B;--card2:#1C1C24;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:inherit}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:500}
.ic{flex-shrink:0;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
#app{position:fixed;inset:0;background:#000;color:var(--t1);display:flex;align-items:stretch;justify-content:center}
#stage{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;transition:background-color .45s ease,color .45s ease;isolation:isolate}
#app[data-device="hand"] #stage{max-width:520px}
#app.framed{align-items:center;background:radial-gradient(120% 90% at 50% 0%,#1a1c22,#050506 70%)}
#app.framed #stage{flex:none;width:390px;height:min(844px,calc(100vh - 48px));border-radius:36px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 0 9px #0c0c0f,0 0 0 10px rgba(255,255,255,.08),0 40px 120px -20px rgba(0,0,0,.9)}
#frameNote{display:none}
#app.framed #frameNote{display:flex;position:fixed;left:24px;top:24px;gap:10px;align-items:center;color:rgba(255,255,255,.6);font-size:13px}
#frameNote button{height:40px;padding:0 16px;border-radius:10px;border:1px solid rgba(224,178,87,.4);color:#E0B257;font-weight:700}

/* ---------- HUD bracket: the frame language shared with BUBL OPS ---------- */
.hud{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px}
.hud::before,.hud::after{content:'';position:absolute;width:15px;height:15px;border:1.5px solid var(--gold);pointer-events:none}
.hud::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.hud::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.hair{height:1px;background:linear-gradient(90deg,var(--gold-bd),transparent 85%);margin:14px 0}

/* ---------- top bar ---------- */
#top{flex-shrink:0;padding:calc(8px + var(--sat)) 14px 6px;display:flex;flex-direction:column;gap:4px;background:var(--bg);z-index:20;transition:background-color .45s ease}
.top-r1{display:flex;align-items:center;gap:8px;min-height:44px}
.evbtn{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:44px}
.evbtn b{font:600 17px/1.15 var(--disp);letter-spacing:-.01em;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evbtn b .ic{color:var(--t3)}
.evbtn>span{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--t2);background:var(--card);border:1px solid var(--line);flex-shrink:0;position:relative}
.ibtn:active{transform:scale(.95)}
.ibtn.av{background:var(--gold-bg);border-color:var(--gold-bd);color:var(--gold);font:700 13px var(--disp)}
.syncp{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--t3);border:1px solid var(--line);white-space:nowrap}
.syncp i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.syncp.q{color:var(--warn);border-color:var(--warn-bd)}.syncp.q i{background:var(--warn)}
.syncp.off{color:var(--bad);border-color:var(--bad-bd)}.syncp.off i{background:var(--bad)}
.top-r2{display:flex;align-items:center;gap:10px}
.phase{display:flex;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line);flex-shrink:0}
.phase button{height:32px;padding:0 13px;border-radius:9px;font:600 12px/1 var(--disp);letter-spacing:.09em;color:var(--t3);display:flex;align-items:center;gap:5px}
.phase button.on{background:var(--gold);color:var(--on-gold)}
.phase button.on.live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--on-gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.clock{flex:1;min-width:0;text-align:right;font-size:12px;color:var(--t3);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock b{display:block;color:var(--t1);font-size:14px;font-weight:500}
.clock .ov{color:var(--warn)}

/* ---------- views + tabs ---------- */
#view{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.page{padding:4px 14px 28px;display:flex;flex-direction:column;gap:var(--gap)}
#tabs{flex-shrink:0;display:flex;padding:6px 10px calc(8px + var(--sab));gap:6px;background:var(--bg);border-top:1px solid var(--line);z-index:20;transition:background-color .45s ease}
#tabs button{flex:1;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 10.5px/1 var(--disp);letter-spacing:.12em;color:var(--t3)}
#tabs button.on{color:var(--gold);background:var(--gold-bg)}
#tabs button .bdg{position:absolute;transform:translate(16px,-14px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:600 10.5px/18px var(--mono);text-align:center;letter-spacing:0}
#tabs button{position:relative}

/* ---------- type ---------- */
.h1{font:600 22px/1.15 var(--disp);letter-spacing:-.015em}
.h2{font:600 16px/1.2 var(--disp);letter-spacing:-.01em}
.lbl{font-size:12.5px;font-weight:600;color:var(--t3)}
.sub{font-size:12.5px;color:var(--t3)}
.mut{color:var(--t3)}.gold{color:var(--gold)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.big{font-size:var(--hero);line-height:1;font-weight:500;letter-spacing:-.04em}
.big small{font-family:var(--body);font-weight:600;font-size:.34em;color:var(--t3);letter-spacing:0;margin-left:4px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 2px 0}
.sech span{font-size:12px;color:var(--t3)}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;color:var(--t2)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid var(--line2);color:var(--t2)}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd)}
.pill.neu{color:var(--gold);background:var(--gold-bg);border-color:var(--gold-bd)}
.pill.mut{color:var(--t3)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border-radius:13px;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line2);color:var(--t1);white-space:nowrap;transition:transform .1s ease}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.full{width:100%}
.btn.ok{border-color:var(--ok-bd);color:var(--ok);background:var(--ok-bg)}
.btn.bad{border-color:var(--bad-bd);color:var(--bad);background:var(--bad-bg)}
.btn.warn{border-color:var(--warn-bd);color:var(--warn);background:var(--warn-bg)}
.btn.sm{height:44px;padding:0 14px;font-size:13.5px;border-radius:11px}
.btn.xs{height:36px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:8px}.btnrow .btn{flex:1;min-width:0}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--card2);border:1px solid var(--line);gap:2px}
.seg button{flex:1;height:36px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--t3);text-align:center;white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--t1);box-shadow:0 0 0 1px var(--line2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:18px;font-size:12.5px;font-weight:700;color:var(--t2);background:var(--card);border:1px solid var(--line2);white-space:nowrap}
.chip.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}

/* ---------- modules ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:var(--pad);transition:background-color .45s ease,border-color .45s ease}
.hero{padding:calc(var(--pad) + 2px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);grid-auto-flow:dense}
.tile{display:flex;flex-direction:column;gap:3px;min-height:112px;padding:13px 13px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;transition:background-color .45s ease}
.tile:active{background:var(--card2)}
.tile.w2{grid-column:span 2}
.tile .tl{font-size:12.5px;font-weight:600;color:var(--t3);display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .tv{font:500 27px/1.1 var(--mono);letter-spacing:-.04em;margin-top:4px;white-space:nowrap}
.tile .tv small{font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--t3);letter-spacing:0;margin-left:3px}
#app[data-phase="live"] .tile .tv{font-size:31px}
.tile .ts{font-size:12px;color:var(--t3);line-height:1.3}
.tile .tviz{margin-top:auto;padding-top:8px}
.tile .al{position:absolute;right:10px;top:10px}
.dotb{width:8px;height:8px;border-radius:50%;display:inline-block}
.dotb.ok{background:var(--ok)}.dotb.warn{background:var(--warn)}.dotb.bad{background:var(--bad)}.dotb.gold{background:var(--gold)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;min-height:58px;padding:9px 0;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.row .ri{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--t2);font:600 12px var(--disp)}
.row .ri.ok{color:var(--ok);background:var(--ok-bg)}.row .ri.warn{color:var(--warn);background:var(--warn-bg)}.row .ri.bad{color:var(--bad);background:var(--bad-bg)}.row .ri.neu{color:var(--gold);background:var(--gold-bg)}
.row .rt{min-width:0}
.row .rt>b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt>span{display:block;font-size:12.5px;color:var(--t3);line-height:1.35}
.row .ra{display:flex;align-items:center;gap:6px;text-align:right;font-size:13px}
.row.tap:active{background:var(--card2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px}
.kv>span{color:var(--t3)}.kv>b{font-weight:600;text-align:right}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);margin-top:12px}
.stat3 div{padding:10px 0 0 12px;border-left:1px solid var(--line)}.stat3 div:first-child{border-left:0;padding-left:0}
.stat3 div>b,.stat3 button>b{display:block;font:500 18px/1.1 var(--mono);letter-spacing:-.03em}.stat3 div>span,.stat3 button>span{display:block;font-size:11.5px;color:var(--t3);margin-top:3px}
.note{font-size:12.5px;color:var(--t3);line-height:1.45}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;font-size:13px;line-height:1.4;border:1px solid var(--line2)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}.banner.bad{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad)}.banner.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}.banner.neu{background:var(--gold-bg);border-color:var(--gold-bd);color:var(--gold)}
.banner b{color:var(--t1);font-weight:700}.banner span{color:var(--t2)}

/* ---------- financial position bar ---------- */
.pos{margin-top:30px}
.pos-bar{position:relative;height:30px;border-radius:7px;background:var(--card2);overflow:visible}
.pos-l{position:absolute;inset:0;display:flex;border-radius:7px;overflow:hidden}
.pos-l i{display:block;height:100%;flex-shrink:0}
.pos-l .dep{background:var(--g2)}.pos-l .tix{background:var(--g3)}.pos-l .on{background:var(--g1)}
.pos-l .com{background:repeating-linear-gradient(135deg,var(--g3) 0 2px,transparent 2px 6px)}
.pos-l.au .dep,.pos-l.au .tix,.pos-l.au .on{background:var(--gold)}
.pos-l.au .dep{box-shadow:inset -1px 0 0 var(--bg)}.pos-l.au .tix{box-shadow:inset -1px 0 0 var(--bg)}
.pos-l.au .com{background:repeating-linear-gradient(135deg,var(--gold) 0 2px,transparent 2px 6px)}
.pos-be{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--t1);border-radius:1px}
.pos-be b{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;color:var(--t1)}
.pos-be.r b{left:auto;right:0;transform:none}.pos-be.l b{left:0;transform:none}
.pos-ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t4);margin-top:9px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--t2)}
.leg>span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.leg .n{color:var(--t1)}
.sw-dep{background:var(--g2)}.sw-tix{background:var(--g3)}.sw-on{background:var(--g1)}.sw-com{background:repeating-linear-gradient(135deg,var(--g3) 0 2px,transparent 2px 5px);box-shadow:0 0 0 1px var(--line2)}.sw-au{background:var(--gold)}
.sw-g1{background:var(--g1)}.sw-g2{background:var(--g2)}.sw-g3{background:var(--g3)}.sw-g4{background:var(--g4)}.sw-ok{background:var(--ok)}.sw-warn{background:var(--warn)}.sw-bad{background:var(--bad)}.sw-open{box-shadow:inset 0 0 0 1.5px var(--g3)}
.sw-dot{background:repeating-linear-gradient(90deg,var(--gold) 0 3px,transparent 3px 6px);height:2px!important;border-radius:0!important}

/* bars */
.hb{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;min-height:34px;font-size:13px}
.hb .tr{height:8px;border-radius:4px;background:var(--card2);position:relative;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--gold)}
.hb .tr i.g{background:var(--g2)}.hb .tr i.h{background:repeating-linear-gradient(135deg,var(--g3) 0 2px,transparent 2px 5px)}
.hb .tr em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--t1)}
.hb .tr i.ok{background:var(--ok)}.hb .tr i.warn{background:var(--warn)}.hb .tr i.bad{background:var(--bad)}
.hb b{font-weight:500;font-size:12.5px;white-space:nowrap}
.meter{height:10px;border-radius:5px;background:var(--card2);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:5px}
.meter i.pre{background:var(--g2)}
.meter em{position:absolute;top:0;bottom:0;width:2px;background:var(--t1)}

/* charts */
svg.ch{display:block;width:100%;height:auto;overflow:visible}
.f-gold{fill:var(--gold)}.f-g1{fill:var(--g1)}.f-g2{fill:var(--g2)}.f-g3{fill:var(--g3)}.f-g4{fill:var(--g4)}.f-ok{fill:var(--ok)}.f-warn{fill:var(--warn)}.f-bad{fill:var(--bad)}.f-card{fill:var(--card2)}.f-bg{fill:var(--bg)}.f-none{fill:none}
.s-gold{stroke:var(--gold)}.s-g1{stroke:var(--g1)}.s-g2{stroke:var(--g2)}.s-g3{stroke:var(--g3)}.s-g4{stroke:var(--g4)}.s-line{stroke:var(--line2)}.s-t1{stroke:var(--t1)}.s-ok{stroke:var(--ok)}.s-warn{stroke:var(--warn)}.s-bad{stroke:var(--bad)}.s-bg{stroke:var(--bg)}
.ct{font:500 10px var(--body);fill:var(--t3)}.cn{font:500 10px var(--mono);fill:var(--t3);letter-spacing:-.02em}.cb{font:700 11px var(--body);fill:var(--t1)}.cnb{font:500 12px var(--mono);fill:var(--t1);letter-spacing:-.03em}.c-on{fill:var(--on-gold)}.c-bg{fill:var(--bg)}

/* ---------- sheets ---------- */
#sheets{position:absolute;inset:0;z-index:60;pointer-events:none}
#sheets .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s ease}
#sheets.on{pointer-events:auto}#sheets.on .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--gold-bd);transform:translateY(102%);transition:transform .3s var(--ease);color:var(--t1);box-shadow:0 -20px 60px rgba(0,0,0,.4)}
.sheet.on{transform:none}
.sheet.tall{height:92%}
.sh-grip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 2px;flex-shrink:0}
.sh-hd{display:flex;align-items:flex-start;gap:10px;padding:8px 16px 12px;flex-shrink:0;touch-action:none}
.sh-hd .t{flex:1;min-width:0}
.sh-hd h3{font:600 20px/1.15 var(--disp);letter-spacing:-.015em}
.sh-hd p{font-size:13px;color:var(--t3);margin-top:3px}
.sh-x{width:44px;height:44px;margin:-6px -8px 0 0;border-radius:12px;display:grid;place-items:center;color:var(--t3)}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sh-body::-webkit-scrollbar{display:none}
.sh-foot{flex-shrink:0;padding:10px 16px calc(12px + var(--sab));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--bg2)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>.lbl{margin-bottom:1px}
.fld{display:flex;flex-direction:column;gap:6px}
.inp{height:50px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line2);width:100%;font-size:16px;color:var(--t1);outline:none}
.inp:focus{border-color:var(--gold)}
textarea.inp{height:84px;padding:12px 14px;resize:none}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:12px;background:var(--card);overflow:hidden;width:max-content}
.step button{width:50px;height:50px;display:grid;place-items:center;color:var(--t2)}
.step b{min-width:54px;text-align:center;font:500 20px var(--mono)}

/* toasts */
#toasts{position:absolute;left:12px;right:12px;bottom:calc(78px + var(--sab));z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:13px;background:var(--card2);border:1px solid var(--gold-bd);font-size:13.5px;font-weight:600;color:var(--t1);box-shadow:0 12px 34px rgba(0,0,0,.45);animation:tin .22s var(--ease)}
.toast span{flex:1;min-width:0}
.toast button{height:36px;padding:0 12px;border-radius:9px;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* PIN */
.pin-dots{display:flex;justify-content:center;gap:14px;margin:6px 0 4px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold-bd)}
.pin-dots i.on{background:var(--gold);border-color:var(--gold)}
.pin-dots.err{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-pad button{height:62px;border-radius:14px;background:var(--card);border:1px solid var(--line);font:500 24px var(--mono);text-align:center;display:grid;place-items:center}
.pin-pad button:active{background:var(--gold-bg)}

/* search */
.srch{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:13px;background:var(--card);border:1px solid var(--line2)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px}
.vlist{position:relative;overflow-y:auto;flex:1;min-height:200px}
.vlist .vrow{position:absolute;left:0;right:0}

/* ---------- FLOOR ---------- */
.floor{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.fl-top{flex-shrink:0;padding:2px 14px 8px;display:flex;flex-direction:column;gap:8px;z-index:5}
.fl-map{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:var(--bg)}
.fl-map>svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.fl-ctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:4}
.fl-ctl .ibtn{background:var(--bg2);border-color:var(--line2)}
.fl-leg{position:absolute;left:12px;bottom:12px;z-index:4;display:flex;flex-direction:column;gap:5px;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--bg2) 92%,transparent);border:1px solid var(--line);font-size:11.5px;color:var(--t2);max-width:60%}
.fl-leg>span{display:flex;align-items:center;gap:7px;white-space:nowrap}
.fl-leg svg{flex-shrink:0}
.fl-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.fl-strip::-webkit-scrollbar{display:none}
.fl-sec{flex-shrink:0;min-width:118px;padding:8px 10px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fl-sec.on{border-color:var(--gold)}
.fl-sec b{font-size:12px;font-weight:700;white-space:nowrap}
.fl-sec>span{font-size:11.5px;color:var(--t3);white-space:nowrap}
.fl-sec .meter{height:4px;margin-top:4px}
.fl-bar{flex-shrink:0;padding:8px 14px 10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--bg);z-index:5}
.fl-bar input[type=range]{flex:1;accent-color:var(--gold);height:44px}
.tb{cursor:pointer}
.tb rect.b{fill:var(--bg);stroke:var(--g3);stroke-width:1.1;transition:fill .25s,stroke .25s,opacity .25s}
.tb text{font:600 5.2px var(--mono);fill:var(--t2);pointer-events:none;text-anchor:middle;letter-spacing:-.02em}
.tb .gl{fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tb.dim{opacity:.22}
.tb.st-open rect.b{stroke:var(--g3);stroke-dasharray:2.4 1.8}
.tb.st-held rect.b{stroke:var(--g2);fill:url(#hatchG)}
.tb.st-requested rect.b{stroke:var(--gold);stroke-dasharray:3 2;fill:var(--gold-bg)}
.tb.st-oos rect.b{stroke:var(--g4);fill:var(--card2);opacity:.6}
.tb.st-booked rect.b{fill:var(--gold);stroke:var(--gold)}.tb.st-booked text{fill:var(--on-gold)}.tb.st-booked .gl{stroke:var(--on-gold)}
.tb.st-expected rect.b{stroke:var(--gold);stroke-width:1.5}.tb.st-expected .gl{stroke:var(--gold)}
.tb.st-seated rect.b{fill:var(--ok);stroke:var(--ok)}.tb.st-seated text{fill:#04130c}.tb.st-seated .gl{stroke:#04130c}
.tb.st-partial rect.b{fill:url(#halfW);stroke:var(--warn);stroke-width:1.5}.tb.st-partial .gl{stroke:var(--warn)}
.tb.st-noshow rect.b{stroke:var(--bad);stroke-width:1.5;fill:var(--bad-bg)}.tb.st-noshow .gl{stroke:var(--bad)}
.tb.st-above rect.b{fill:var(--gold);stroke:var(--gold)}.tb.st-above text{fill:var(--on-gold)}.tb.st-above .gl{stroke:var(--on-gold)}
.tb.st-below rect.b{stroke:var(--warn);stroke-width:1.5;fill:var(--warn-bg)}.tb.st-below .gl{stroke:var(--warn)}
.tb.st-unsold rect.b{stroke:var(--g3);stroke-dasharray:2.4 1.8}
.tb.sel rect.b{stroke:var(--t1);stroke-width:2.4}
.tb .fx{fill:var(--bad);stroke:var(--bg);stroke-width:.8}
.tb .fxa{fill:var(--warn);stroke:var(--bg);stroke-width:.8}
.tb .ping{fill:none;stroke:var(--gold);stroke-width:2;animation:ping 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(2.4)}}
.seatd{stroke:var(--bg);stroke-width:.5}
.seatd.cl{fill:var(--bg);stroke:var(--gold);stroke-width:.9}.seatd.un{fill:var(--bg);stroke:var(--g3);stroke-width:.8;stroke-dasharray:1.2 1}.seatd.ar{fill:var(--warn)}.seatd.se{fill:var(--ok)}.seatd.ns{fill:var(--bg);stroke:var(--bad);stroke-width:1}
.zone{fill:var(--card);stroke:var(--line2);stroke-width:1}
.zone.deck{fill:var(--card)}.zone.ga{fill:none;stroke-dasharray:4 4}
.zlbl{font:600 11px var(--disp);fill:var(--t3);text-anchor:middle;pointer-events:none}
.zlbl.sm{font-size:9px}
.zsum{font:500 11px var(--mono);fill:var(--t1);text-anchor:middle;pointer-events:none}
.dens{transition:opacity .4s}
.lod1 .tb text,.lod1 .tb .gl{display:none}
.lod1 .seatg,.lod2 .seatg{display:none}
.lod3 .zlbl.big,.lod3 .zsum{opacity:.25}

/* table sheet bits */
.seatc{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.seatc .sn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:500 13px var(--mono);border:1.5px solid var(--g3);color:var(--t2)}
.seatc .sn.se{background:var(--ok);border-color:var(--ok);color:#04130c}.seatc .sn.ar{border-color:var(--warn);color:var(--warn)}.seatc .sn.cl{border-color:var(--gold);color:var(--gold)}.seatc .sn.ns{border-color:var(--bad);color:var(--bad)}.seatc .sn.un{border-style:dashed}
.seatc div>b,.seatc button>b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seatc div>span:not(.pill){display:block;font-size:12px;color:var(--t3)}
.tline{position:relative;height:38px;margin:4px 0}
.tline .ax{position:absolute;left:0;right:0;top:18px;height:1px;background:var(--line2)}
.tline i{position:absolute;top:12px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--bg2);transform:translateX(-50%)}
.tline i.o{background:var(--gold);border-radius:3px;top:13px;width:10px;height:10px}
.tline em{position:absolute;top:2px;bottom:6px;width:1.5px;background:var(--t1);font-style:normal}
.tline span{position:absolute;top:27px;font:500 10px var(--mono);color:var(--t3);transform:translateX(-50%)}

/* ---------- SCAN ---------- */
.scan{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden;display:flex;flex-direction:column}
.scan video,.scan .sim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .sim{background:radial-gradient(90% 60% at 50% 42%,#1c1d22,#060607 75%)}
.scan .sim::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.sc-top{position:relative;z-index:3;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}
.sc-mode{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;background:rgba(0,0,0,.6);border:1px solid rgba(224,178,87,.5);color:#E0B257;font-size:12.5px;font-weight:700}
.sc-count{text-align:right;font-size:12px;color:rgba(255,255,255,.65);line-height:1.3}
.sc-count b{display:block;font:500 26px/1 var(--mono);color:#fff;letter-spacing:-.04em}
.sc-ret{position:absolute;left:50%;top:44%;width:min(66vw,260px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:2}
#app.framed .sc-ret{width:250px}
.sc-ret::before,.sc-ret::after,.sc-ret i::before,.sc-ret i::after{content:'';position:absolute;width:34px;height:34px;border:3px solid #E0B257}
.sc-ret::before{left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.sc-ret::after{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.sc-ret i::before{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.sc-ret i::after{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}

.sc-q{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.sc-q::-webkit-scrollbar{display:none}
.sc-q button{flex-shrink:0;height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}

.sc-res .big-ic{width:96px;height:96px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;margin:8px auto 14px}
.sc-res h2{font:600 34px/1.05 var(--disp);letter-spacing:-.02em;text-align:center}
.sc-res .who{font:600 24px/1.15 var(--disp);text-align:center;margin-top:10px}
.sc-res .why{font-size:15px;text-align:center;margin-top:8px;opacity:.92;line-height:1.4}
.sc-res .facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:18px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.22)}
.sc-res .facts div{background:rgba(0,0,0,.26);padding:11px 13px}
.sc-res .facts div>span{display:block;font-size:11.5px;opacity:.75}
.sc-res .facts b{display:block;font-size:17px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-res .idl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14px;font-weight:600}
.sc-res .acts{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sc-res .acts .btn{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.4);color:#fff;height:56px}
.sc-res .acts .btn.pri{background:#fff;color:#111;border-color:#fff}
.sc-res .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:auto}
.sc-res .bar i{display:block;height:100%;background:#fff;width:100%;transform-origin:left;animation:drain 1.5s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.qrbox{background:#fff;border-radius:16px;padding:14px;width:max-content;margin:0 auto}
.qrbox svg{display:block}

/* ---------- report preview ---------- */
.rp-pages{display:flex;flex-direction:column;gap:14px;align-items:center}
.rp-pages svg{width:100%;max-width:620px;height:auto;background:#FBF8F1;border-radius:4px;box-shadow:0 6px 30px rgba(0,0,0,.28)}

/* ---------- ATLAS (tablet) ---------- */
#app[data-device="atlas"] #stage{flex-direction:row;max-width:none}
#rail{width:84px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:calc(14px + var(--sat)) 8px 12px;border-right:1px solid var(--line);background:var(--bg2);z-index:10;transition:background-color .45s ease}
#rail .logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);font:700 15px var(--disp);margin-bottom:10px}
#rail button{width:68px;height:60px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 10.5px/1 var(--disp);color:var(--t3);letter-spacing:.02em;position:relative}
#rail button.on{color:var(--gold);background:var(--gold-bg)}
#rail .sp{flex:1}
#amain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#atop{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:calc(12px + var(--sat)) 20px 12px;border-bottom:1px solid var(--line)}
#atop .evbtn{flex:0 1 auto}
#atop .evbtn b{font-size:20px}
#atop .sp{flex:1}
#atop .clock{flex:0 0 auto}
#aview{flex:1;min-height:0;overflow-y:auto;position:relative;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.agrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding:18px 20px 40px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;min-width:0;display:flex;flex-direction:column;gap:10px;transition:background-color .45s ease}
.panel>.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.panel>.ph h4{font:600 15px/1.2 var(--disp)}
.panel>.ph span{font-size:12px;color:var(--t3)}
.panel .pv{font:500 30px/1.05 var(--mono);letter-spacing:-.04em}
.panel .pv small{font-family:var(--body);font-size:13px;color:var(--t3);letter-spacing:0;margin-left:4px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1020px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c5,.c7,.c8{grid-column:span 12}}
.atitle{grid-column:span 12;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:-2px}
.atitle h2{font:600 26px/1.1 var(--disp);letter-spacing:-.02em}
.atitle p{font-size:13.5px;color:var(--t3);margin-top:4px}
#app[data-device="atlas"] #sheets .sheet{left:auto;right:0;top:0;bottom:0;width:min(440px,92vw);max-height:none;height:100%;border-radius:0;border-top:0;border-left:1px solid var(--gold-bd);transform:translateX(102%)}
#app[data-device="atlas"] #sheets .sheet.on{transform:none}
#app[data-device="atlas"] #sheets .sheet.modal{left:50%;right:auto;top:50%;bottom:auto;height:auto;max-height:86%;width:min(420px,92vw);border-radius:18px;border:1px solid var(--gold-bd);transform:translate(-50%,-46%);opacity:0;transition:opacity .2s,transform .2s}
#app[data-device="atlas"] #sheets .sheet.modal.on{transform:translate(-50%,-50%);opacity:1}
#app[data-device="atlas"] .sh-grip{display:none}
#app[data-device="atlas"] .sh-hd{padding-top:18px}
#app[data-device="atlas"] #toasts{left:auto;right:20px;bottom:20px;width:380px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:600;color:var(--t3);text-align:left;padding:6px 10px 8px 0;font-size:12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;padding-right:0}
.tbl tr.tap{cursor:pointer}.tbl tr.tap:hover td{background:var(--card2)}
.asplit{position:absolute;inset:0;display:grid;grid-template-columns:1fr 400px}
.asplit>.side{border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg2)}
@media(max-width:1020px){.asplit{grid-template-columns:1fr 330px}}
.cost-inp{width:120px;height:40px;border-radius:9px;background:var(--bg);border:1px solid var(--line2);text-align:right;padding:0 10px;font:500 14px var(--mono);outline:none}
.cost-inp:focus{border-color:var(--gold)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.stat3 .n{font-family:var(--mono)}
.rt .n,.note .n,.sub .n{font-size:.96em}
#stage.scanres #top,#stage.scanres #tabs{display:none}
.panel svg.ch{max-height:250px}
.panel .tile{border:0;padding:0;min-height:0;background:none}

/* ---------- time bar ---------- */
#tslot{min-width:0}
.tbar{position:relative;padding:2px 13px 0;user-select:none;-webkit-user-select:none}
.tb-track{position:relative;height:34px;touch-action:none;cursor:pointer;outline:none}
.tb-rail{position:absolute;left:0;right:0;top:14px;height:6px;display:flex;gap:5px}
.tb-rail i{flex:1;border-radius:3px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line2)}
.tb-fill{position:absolute;left:0;top:14px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold-d),var(--gold));pointer-events:none}
.tb-mid{position:absolute;left:50%;top:7px;width:2px;height:20px;margin-left:-1px;border-radius:1px;background:var(--t2);pointer-events:none}
.tb-now{position:absolute;top:9px;width:6px;height:16px;margin-left:-3px;border-radius:3px;border:1.5px solid var(--t1);background:var(--bg);pointer-events:none}
.tb-thumb{position:absolute;top:5px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--bg),0 3px 12px rgba(0,0,0,.6);pointer-events:none;transition:transform .12s}
.drag .tb-thumb{transform:scale(1.18)}
.tb-track:focus-visible .tb-thumb{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--gold)}
.tb-bub{position:absolute;bottom:34px;transform:translateX(-50%);padding:5px 9px;border-radius:9px;background:var(--card2);border:1px solid var(--gold-bd);font:500 13px var(--mono);color:var(--t1);white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;z-index:5}
.drag .tb-bub{opacity:1}
.tb-lab{display:flex;justify-content:space-between;margin:-2px -13px 0;font:600 10.5px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--t4)}
.tb-lab span{width:60px;text-align:center}
.tb-lab span.on{color:var(--gold)}
.tb-read{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;min-height:30px;font-size:12px;color:var(--t3)}
.tb-a{display:flex;align-items:baseline;gap:7px;min-width:0;min-height:30px;white-space:nowrap;overflow:hidden;color:var(--t3);font-size:12px}
.tb-a b{font-size:16px;color:var(--t1);font-weight:500}
.tb-a em{font-style:normal;font-weight:700;font-size:11px}
.tb-b{display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.tb-nowb{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--gold-bd);color:var(--gold);font-weight:700;font-size:12px}
#atop{gap:18px}#atop #atopL{flex:0 1 auto;min-width:0}#atop #tslot{flex:1;max-width:640px;margin:0 auto}#atop #atopR{display:flex;gap:10px;align-items:center}
#atop .tbar{padding-top:6px}

/* ---------- manager agent ---------- */
.agent{padding:15px}
.ag-top{display:flex;gap:11px;align-items:center}
.ag-top>div{flex:1;min-width:0}
.ag-badge{width:44px;height:44px;display:grid;place-items:center;flex-shrink:0;position:relative}
.ag-top b{display:block;font:600 16px/1.2 var(--disp)}
.ag-top span{display:block;font-size:12.5px;color:var(--t3);margin-top:1px}
.ag-in{display:flex;gap:8px;margin-top:12px}
.ag-in input{flex:1;min-width:0;height:50px;border-radius:13px;background:var(--bg);border:1px solid var(--line2);padding:0 14px;font-size:16px;color:var(--t1);outline:none}
.ag-in input:focus{border-color:var(--gold)}
.ag-in button{width:50px;height:50px;border-radius:13px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;flex-shrink:0}
.agent .chips{margin-top:10px}
.ag-thread{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;font-size:14.5px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--gold-bg);border:1px solid var(--gold-bd);padding:10px 13px;border-radius:15px 15px 4px 15px}
.msg.ai{align-self:stretch;max-width:none;background:var(--card);border:1px solid var(--line);padding:13px 14px;border-radius:15px 15px 15px 4px;display:flex;flex-direction:column;gap:10px}
.msg.ai .rows .row{min-height:48px}
.ai-acts{display:flex;flex-wrap:wrap;gap:8px}
.ai-src{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t4)}
.msg.typing{flex-direction:row;gap:6px;align-self:flex-start;padding:14px 16px}
.msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1s ease-in-out infinite}
.msg.typing i:nth-child(2){animation-delay:.18s}.msg.typing i:nth-child(3){animation-delay:.36s}
.ir{padding:14px;display:flex;flex-direction:column;gap:10px}
.ir-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ir-h b{font:600 15px/1.25 var(--disp)}.ir-h span{font-size:12px;color:var(--t3)}
.ir-p{font-size:13.5px;color:var(--t2);line-height:1.5}
.lnk{color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* ---------- floor overlays: each one encodes its own meaning ---------- */
.tb .lv{fill:var(--gold);pointer-events:none}
.tb.ov-p1 rect.b{fill:var(--gold);fill-opacity:.14;stroke:var(--gold);stroke-opacity:.45}
.tb.ov-p2 rect.b{fill:var(--gold);fill-opacity:.32;stroke:var(--gold);stroke-opacity:.65}
.tb.ov-p3 rect.b{fill:var(--gold);fill-opacity:.55;stroke:var(--gold)}
.tb.ov-p4 rect.b{fill:var(--gold);fill-opacity:.82;stroke:var(--gold)}
.tb.ov-p5 rect.b{fill:var(--gold-s);stroke:var(--gold-s);stroke-width:1.6}
.tb.ov-p1 text,.tb.ov-p2 text,.tb.ov-p3 text{fill:var(--t1)}
.tb.ov-on rect.b{fill:var(--gold);stroke:var(--gold)}
.tb.ov-grey rect.b{fill:var(--g2);stroke:var(--g2)}.tb.ov-grey text{fill:var(--bg)}
.tb.ov-out rect.b{fill:var(--bg);stroke:var(--g3)}
.tb.ov-lvl rect.b{fill:var(--bg);stroke:var(--gold);stroke-width:1.2}
.tb.ov-lvl text,.tb.ov-heat text{fill:var(--t1);paint-order:stroke;stroke:var(--bg);stroke-width:1.6px}
.tb.ov-ok rect.b{fill:var(--ok);stroke:var(--ok)}
.tb.ov-warn rect.b{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.5}.tb.ov-warn text{fill:var(--warn)}
.tb.ov-bad rect.b{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.6}.tb.ov-bad text{fill:var(--bad)}
.tb.ov-pulse rect.b{fill:var(--gold-bg);stroke:var(--gold);stroke-width:2;animation:tpulse 1.1s ease-in-out infinite}.tb.ov-pulse text{fill:var(--gold)}
@keyframes tpulse{50%{stroke-opacity:.15;stroke-width:3}}
.tb.ov-heat rect.b{fill:var(--gold);stroke:var(--gold);stroke-opacity:.5}
.tb.ink text{fill:var(--on-gold);paint-order:normal;stroke:none}
.tb.ov-ok.ink text{fill:#04130c}
.tb.tgt rect.b{stroke:var(--t1);stroke-width:2;stroke-dasharray:none}
.dens{fill-opacity:0;transition:fill-opacity .4s}
.dens.zsel{stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4}
.fl-leg{overflow-y:auto;scrollbar-width:none}
.fl-leg::-webkit-scrollbar{display:none}
.lg-t{display:block;font:600 11.5px/1.2 var(--disp);color:var(--t1);margin-bottom:3px;letter-spacing:.01em}
.lg-s{margin-top:5px}
.fl-leg .tb.dim{opacity:.4}
.lg-h{gap:6px!important}.lg-h b{display:inline-block;min-width:22px;color:var(--gold);font-size:11px}
.dz{display:inline-block;width:14px;height:10px;border-radius:2px;flex-shrink:0}
.dz.a{background:var(--gold);opacity:.3}.dz.b{background:var(--warn);opacity:.45}.dz.c{background:var(--bad);opacity:.55}
.lg-grad i{display:block;width:120px;height:9px;border-radius:3px;background:linear-gradient(90deg,rgba(224,178,87,.12),var(--gold))}
.lg-ax{display:flex!important;justify-content:space-between;width:120px;font-size:10px;color:var(--t3);margin-top:-3px}.lg-ax em{font-style:normal}
.chip-l{flex-shrink:0;align-self:center;font-size:12px;font-weight:700;color:var(--t3);padding:0 2px}
/* zone data, drawn into the empty floor */
.fl-over{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.zl{position:absolute;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;pointer-events:none;overflow:hidden;gap:1px}
.zl b{font:600 10px var(--disp);color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.zl .n{font-size:13.5px;color:var(--t1)}
.zl em{font-style:normal;font-size:10.5px;color:var(--t3)}
.zl em.warn{color:var(--warn)}.zl em.bad{color:var(--bad)}
.zcard{position:absolute;pointer-events:auto;background:color-mix(in srgb,var(--bg2) 95%,transparent);border:1px solid var(--gold-bd);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;box-shadow:0 14px 40px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:tin .18s var(--ease)}
.zc-h{display:flex;align-items:center;justify-content:space-between;gap:6px}.zc-h b{font:600 15px var(--disp)}.zc-h .sh-x{margin:-8px -8px -8px 0}
.zc-v{font-size:26px;line-height:1;letter-spacing:-.04em}.zc-v small{font-family:var(--body);font-weight:600;font-size:12px;color:var(--t3);letter-spacing:0;margin-left:5px}
.zcard .kv{font-size:12.5px;gap:6px 10px;grid-template-columns:auto 1fr}.zcard .kv>span{white-space:nowrap}.zcard .kv>b{font-weight:600}
.zcard .btnrow .btn{flex:1}
.zc-w{font-size:12px;color:var(--t3);margin-top:-2px}
.lg-dz{gap:5px!important}.lg-dz .dz{margin-left:4px}.lg-dz .dz:first-child{margin-left:0}
.agrid>section[data-mod="agent"]{align-self:stretch;display:flex}.agrid>section[data-mod="agent"]>.agent{flex:1;display:flex;flex-direction:column}
.agrid .agent .chips{flex-wrap:wrap;overflow:visible}
.agrid .agent .ag-last{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--t2)}
.agrid .agent .ag-last b{display:block;font-size:12px;color:var(--t3);font-weight:600;margin-bottom:3px}

/* ===================== v3 ===================== */
/* legend: docked outside the plan. Handheld: a bar along the bottom. Atlas: a panel on the left */
.fl-leg{left:0!important;right:0;bottom:0!important;max-width:none!important;top:auto;border-radius:0!important;border:0!important;border-top:1px solid var(--line2)!important;
  flex-direction:row!important;flex-wrap:wrap;align-items:center;gap:6px 14px!important;padding:9px 14px 10px!important;max-height:38%;
  background:linear-gradient(180deg,rgba(18,19,25,.97),rgba(11,12,16,.99))!important;box-shadow:0 -14px 30px -18px rgba(0,0,0,.9)}
.fl-leg .lg-t{flex-basis:100%;margin:0 0 1px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.fl-leg .lg-s{flex-basis:auto;margin:0;color:var(--t3)}
.fl-leg .lg-h em{font-style:normal;color:var(--t3)}
#aview .fl-leg{left:16px!important;right:auto;top:14px;max-width:none!important;bottom:auto!important;width:208px;max-height:calc(100% - 28px);flex-direction:column!important;flex-wrap:nowrap;align-items:stretch;
  border-radius:14px!important;border:1px solid var(--line2)!important;padding:12px 14px!important;gap:6px!important;box-shadow:0 18px 40px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
#aview .fl-leg .lg-t{margin-bottom:3px}
.fl-ctl{transition:bottom .2s ease}

/* BUBL bubble */
.bubl{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 8px rgba(212,176,112,.38)) drop-shadow(0 2px 10px rgba(20,12,6,.5))}
.ag-badge .bubl{width:44px;height:44px;animation:bbWob 3.6s ease-in-out infinite}
.ag-badge::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(224,178,87,.22),transparent 68%);pointer-events:none}
.bb-a{transform-origin:32px 32px;animation:bbSpin 15s linear infinite}.bb-b{transform-origin:32px 32px;animation:bbSpin 23s linear infinite reverse}
.bb-glint{transform-origin:32px 32px;animation:bbGlint 7s cubic-bezier(.45,.05,.2,1) infinite}.bb-spec{animation:bbSpec 5.2s ease-in-out infinite}

@keyframes bbSpin{to{transform:rotate(360deg)}}
@keyframes bbGlint{0%{transform:rotate(-20deg);opacity:0}8%{opacity:1}42%{transform:rotate(340deg);opacity:1}50%,100%{transform:rotate(340deg);opacity:0}}
@keyframes bbWob{0%,100%{transform:scale(1,1) translateY(0)}50%{transform:scale(1.02,.982) translateY(-1px)}}

.msg.ai{position:relative;padding-left:52px!important}

/* table sheet: the table code glows in its state colour (FOH) */
.tsh{display:flex;align-items:center;gap:12px}
.tsh .tc{width:54px;height:54px;flex-shrink:0;border-radius:15px;display:grid;place-items:center;font:600 16px var(--mono);letter-spacing:-.02em;border:1.5px solid var(--line2);background:var(--card2);color:var(--t2)}
.tsh .tc.g{color:#6ee7b7;border-color:rgba(74,222,128,.6);text-shadow:0 0 16px rgba(74,222,128,.85);box-shadow:0 0 22px -5px rgba(74,222,128,.55),inset 0 0 18px -9px rgba(74,222,128,.85);animation:tcG 2.6s ease-in-out infinite}
.tsh .tc.a{color:#fcd34d;border-color:rgba(251,191,36,.62);text-shadow:0 0 16px rgba(251,191,36,.85);box-shadow:0 0 22px -5px rgba(251,191,36,.55),inset 0 0 18px -9px rgba(251,191,36,.85);animation:tcA 2.6s ease-in-out infinite}
.tsh .tc.r{color:#fca5a5;border-color:rgba(248,113,113,.64);text-shadow:0 0 16px rgba(248,113,113,.9);box-shadow:0 0 22px -5px rgba(248,113,113,.55),inset 0 0 18px -9px rgba(248,113,113,.85);animation:tcR 2.6s ease-in-out infinite}
.tsh .tc.au{color:var(--gold-s);border-color:var(--gold-bd);text-shadow:0 0 16px rgba(224,178,87,.85);box-shadow:0 0 22px -5px rgba(224,178,87,.5),inset 0 0 18px -9px rgba(224,178,87,.8)}
@keyframes tcG{50%{box-shadow:0 0 28px -3px rgba(74,222,128,.7),inset 0 0 20px -8px rgba(74,222,128,.9)}}
@keyframes tcA{50%{box-shadow:0 0 28px -3px rgba(251,191,36,.7),inset 0 0 20px -8px rgba(251,191,36,.9)}}
@keyframes tcR{50%{box-shadow:0 0 30px -3px rgba(248,113,113,.75),inset 0 0 20px -8px rgba(248,113,113,.92)}}

/* guest rows: whole row opens the profile, payment status in front */
button.seatc{width:100%;text-align:left;font:inherit;color:inherit}
.seatc{grid-template-columns:34px minmax(0,1fr) auto!important;background:linear-gradient(150deg,var(--card2),var(--card) 75%)!important;transition:transform .12s,border-color .2s}
.seatc.tap:active{transform:scale(.985);border-color:var(--gold-bd)}
.seatc .sw{min-width:0}
.seatc .sw b{display:flex!important;align-items:center;gap:5px}
.pyr{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--gold-bg);color:var(--gold);flex-shrink:0}
.pay{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}

/* expanded guest profile */
.gp-hero{display:flex;gap:15px;align-items:center;padding:16px;border-radius:18px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 100% 0,rgba(224,178,87,.2),transparent 45%),linear-gradient(150deg,#23262f,#14161c 75%);border:1px solid var(--gold-bd);box-shadow:0 16px 34px -18px rgba(224,178,87,.35),inset 0 1px 0 rgba(255,240,210,.07)}
.gp-av{position:relative;width:68px;height:68px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font:700 23px var(--disp);color:#1a1206;background:linear-gradient(135deg,var(--gold-s),var(--gold) 45%,var(--gold-d));box-shadow:0 0 26px rgba(224,178,87,.45),inset 0 1px 0 rgba(255,255,255,.45)}
.gp-av.bl{box-shadow:0 0 0 2px var(--bg2),0 0 0 3.5px var(--gold),0 0 30px rgba(224,178,87,.55)}

.gp-steps{display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.gp-steps::before{content:'';position:absolute;left:8px;right:8px;top:7px;height:2px;background:var(--line2)}

#tabs{background:rgba(8,8,11,.8);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

.sheet{background:radial-gradient(ellipse 70% 140px at 50% 0,rgba(224,178,87,.13),transparent 72%),var(--bg2)!important;box-shadow:0 -20px 50px -20px rgba(0,0,0,.9)}

.tb-lab span.on{text-shadow:0 0 12px rgba(224,178,87,.7)}

.fl-sec.on{box-shadow:0 0 20px -8px rgba(224,178,87,.6),inset 0 1px 0 rgba(255,240,210,.08)}

.gp-hero,.gp-stats,.gp-card,.gp-with,.tsh,.gp-cons{flex-shrink:0}

/* ===================== v4 · floor agent ===================== */
.fl-dock{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(18,19,25,.97),rgba(11,12,16,.99));border-top:1px solid var(--line2);box-shadow:0 -14px 30px -18px rgba(0,0,0,.9)}
.fl-dock .fl-leg,#aview .fl-dock .fl-leg{position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:auto!important;max-height:none!important;
  border:0!important;border-radius:0!important;box-shadow:none!important;background:none!important}
#aview .fl-dock{left:16px;right:auto;top:14px;bottom:auto;width:268px;max-height:calc(100% - 28px);overflow-y:auto;scrollbar-width:none;border:1px solid var(--line2);border-radius:16px;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
#aview .fl-dock .fa-card{border-bottom:1px solid var(--line)}
.fa-card{display:flex;flex-direction:column;gap:9px;padding:12px 14px 11px;max-height:46vh;overflow-y:auto;scrollbar-width:none;border-bottom:1px solid var(--line);
  background:radial-gradient(ellipse 80% 120px at 0 0,rgba(224,178,87,.13),transparent 70%);animation:tin .2s var(--ease)}
.fa-card::-webkit-scrollbar{display:none}
.fa-h{display:flex;align-items:center;gap:9px;min-width:0}
.fa-h b{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa-av{width:28px;height:28px;flex-shrink:0;display:block}
.fa-x{width:34px;height:34px;margin:-6px -8px -6px 0;display:grid;place-items:center;border-radius:10px;color:var(--t3);flex-shrink:0}
.fa-t{font-size:14px;line-height:1.48;color:var(--t1)}
.fa-th{font-size:13px;color:var(--t3)}
.fa-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fa-lab{font:600 10.5px/1.25 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 12px rgba(224,178,87,.45)}
.fa-step{display:flex;align-items:center;gap:4px;flex-shrink:0}
.fa-step button{width:34px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line2);color:var(--t1)}
.fa-step .fa-all{width:auto;padding:0 10px;font-size:12px;font-weight:700;color:var(--gold)}
.fa-step b{min-width:40px;text-align:center;font-size:12.5px;color:var(--t2)}
.fa-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 1px 3px}
.fa-list::-webkit-scrollbar{display:none}
#aview .fa-list{flex-wrap:wrap;overflow:visible}
.fa-tb{flex-shrink:0;height:32px;padding:0 11px;border-radius:16px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--card);border:1px solid var(--gold-bd);color:var(--gold)}
.fa-tb.bad{border-color:rgba(248,113,113,.5);color:#fca5a5}.fa-tb.warn{border-color:rgba(251,191,36,.5);color:#fcd34d}.fa-tb.ok{border-color:rgba(52,211,153,.5);color:#6ee7b7}
.fa-tb.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);box-shadow:0 0 16px -4px rgba(224,178,87,.8)}
.fa-tb.bad.on{background:var(--bad);color:#2a0606;border-color:var(--bad);box-shadow:0 0 16px -4px rgba(248,113,113,.8)}
.fa-tb.warn.on{background:var(--warn);color:#2a1a02;border-color:var(--warn);box-shadow:0 0 16px -4px rgba(251,191,36,.8)}
.fa-tb.ok.on{background:var(--ok);color:#04130c;border-color:var(--ok);box-shadow:0 0 16px -4px rgba(52,211,153,.8)}
.fa-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 4px;border-radius:18px;font-size:12.5px;font-weight:700;color:var(--gold);
  background:linear-gradient(135deg,rgba(224,178,87,.24),rgba(224,178,87,.06));border:1px solid var(--gold-bd);box-shadow:0 0 18px -7px rgba(224,178,87,.7)}
.fa-btn .bubl{width:28px;height:28px}
.fa-ask{display:flex;align-items:center;gap:8px}
.fa-ask .fa-av{width:34px;height:34px}
.fa-ask input{flex:1;min-width:0;height:44px;border-radius:12px;background:linear-gradient(180deg,#0a0b0e,#101218);border:1px solid var(--gold-bd);padding:0 13px;font-size:16px;color:var(--t1);outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 0 0 3px rgba(224,178,87,.1)}
.fa-go{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;color:var(--on-gold);background:linear-gradient(135deg,var(--gold-s),var(--gold) 45%,var(--gold-d));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px -8px rgba(224,178,87,.7)}
.fa-ask .fa-x{margin:0}
/* the floor answers on the objects themselves: tables, zones and gates light up; nothing is laid on top */
.tb.dim2{opacity:.12}
.tb{transition:opacity .35s ease}
.tb.spot rect.b{stroke-width:2.1;animation:spotG 1.8s ease-in-out infinite}
.tb.spot-gold rect.b{stroke:var(--gold-s)!important;filter:drop-shadow(0 0 4px rgba(224,178,87,.95))}
.tb.spot-bad rect.b{stroke:#ff8a8a!important;filter:drop-shadow(0 0 4px rgba(248,113,113,.95))}
.tb.spot-warn rect.b{stroke:#fcd34d!important;filter:drop-shadow(0 0 4px rgba(251,191,36,.95))}
.tb.spot-ok rect.b{stroke:#6ee7b7!important;filter:drop-shadow(0 0 4px rgba(52,211,153,.9))}
.tb.spot.sel rect.b{stroke-width:3;animation:none;filter:drop-shadow(0 0 7px rgba(255,236,190,1))}
@keyframes spotG{50%{stroke-opacity:.45}}
.dens.zspot{fill:var(--gold);fill-opacity:.28;stroke:var(--gold-s);stroke-width:1.6;animation:zspot 2.2s ease-in-out infinite}
@keyframes zspot{50%{fill-opacity:.14}}
.gate rect,.gate text{transition:fill .3s,stroke .3s}
.gate.gspot rect{fill:var(--gold-bg)!important;stroke:var(--gold-s)!important;stroke-width:1.6;filter:drop-shadow(0 0 5px rgba(224,178,87,.95))}
.gate.gspot text{fill:var(--gold-s)!important}
/* live alerts are carried by the table's own edge, not a dot laid over it */
.tb.fxr rect.b{stroke:var(--bad)!important;stroke-width:2.3px;animation:fxr 1.4s ease-in-out infinite}
.tb.fxa rect.b{stroke:var(--warn)!important;stroke-width:2.1px}
@keyframes fxr{50%{stroke-opacity:.35}}
.tb.pinged rect.b{stroke:#fff!important;stroke-width:2.4;animation:pingT .9s ease-in-out infinite}
@keyframes pingT{50%{stroke:var(--gold-s);stroke-opacity:.4}}
@media(prefers-reduced-motion:reduce){.tb.spot rect.b,.dens.zspot,.tb.fxr rect.b,.tb.pinged rect.b{animation:none}}
.seatd.sd{opacity:.12}

/* ===================== v5 · integrations ===================== */
.ig-hero{display:flex;gap:18px;align-items:center}
.ig-ring{position:relative;width:112px;height:112px;flex-shrink:0}
.ig-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ig-ring .rg-b{fill:none;stroke:var(--card2);stroke-width:10}
.ig-ring .rg-f{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(224,178,87,.6));transition:stroke-dasharray .6s var(--ease)}
.ig-ring>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ig-ring b{font-size:26px;font-weight:500;letter-spacing:-.04em;text-shadow:0 0 24px rgba(224,178,87,.35)}
.ig-ring span{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.ig-hx{display:flex;flex-direction:column;gap:7px;min-width:0}
.ig-hx .big{font-size:40px}
.ig-grid{display:grid;grid-template-columns:1fr;gap:10px}
#aview .ig-c2{grid-template-columns:repeat(2,1fr)}#aview .ig-c3{grid-template-columns:repeat(3,1fr)}
.ig-col{display:flex;flex-direction:column;gap:18px;min-width:0}.ig-side{position:sticky;top:12px}
.ig-side .ist{grid-template-columns:42px 1fr}.ig-side .ist-s{grid-column:2}.ig-side .ist-t{grid-column:2;white-space:normal}
.panel .gapc{border:0!important;background:none!important;padding:0}
.ig-page .ig-body{display:flex;flex-direction:column;gap:18px}
.ig-card{position:relative;display:flex;flex-direction:column;gap:11px;padding:14px;border-radius:15px;background:linear-gradient(150deg,var(--card2),var(--card) 72%);border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 34px -24px rgba(0,0,0,.95);transition:border-color .3s,box-shadow .3s}
.ig-card.on.pulse{border-color:rgba(52,211,153,.28)}
.ig-card.flash{animation:igFlash .9s ease-out}
@keyframes igFlash{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 0 0 1px rgba(224,178,87,.55),0 0 26px -6px rgba(224,178,87,.6)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 34px -24px rgba(0,0,0,.95)}}
.ig-card.off{border-color:rgba(248,113,113,.4);background:linear-gradient(150deg,rgba(248,113,113,.08),var(--card) 70%)}
.ig-card.add{border-style:dashed;border-color:var(--gold-bd);background:linear-gradient(150deg,rgba(224,178,87,.06),var(--card) 70%)}
.ig-h{display:flex;align-items:center;gap:11px}
.ig-ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-bd);box-shadow:0 0 14px -6px rgba(224,178,87,.6)}
.ig-card.off .ig-ic{color:var(--bad);background:var(--bad-bg);border-color:rgba(248,113,113,.4);box-shadow:none}
.ig-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ig-t b{font:600 15px/1.2 var(--disp)}.ig-t span{font-size:12px;color:var(--t3);line-height:1.3}
.ig-st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:11.5px;font-weight:700;flex-shrink:0}
.ig-st.on{color:var(--ok);background:var(--ok-bg,rgba(52,211,153,.12))}.ig-st.on i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.ig-st.add{color:var(--gold);border:1px dashed var(--gold-bd)}
.ig-sw{width:52px;height:30px;border-radius:15px;flex-shrink:0;position:relative;background:var(--card2);border:1px solid var(--line2);transition:background .25s}
.ig-sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--t3);transition:transform .25s var(--ease),background .25s}
.ig-sw.on{background:linear-gradient(135deg,#34d399,#15803d);border-color:transparent;box-shadow:0 0 14px -4px rgba(52,211,153,.7)}
.ig-sw.on i{transform:translateX(22px);background:#fff}
.ig-m{display:grid;grid-template-columns:auto auto 1fr;gap:16px;align-items:end}
.ig-m>div{display:flex;flex-direction:column;gap:2px}
.ig-m b{font-size:17px;font-weight:500;letter-spacing:-.03em}.ig-m span{font-size:10.5px;color:var(--t3)}
.ig-sp{align-self:stretch;justify-content:flex-end}
.isp{width:100%;height:26px;display:block}.isp rect{fill:var(--gold);opacity:.85}.isp.off rect{fill:var(--g3);opacity:.5}
.ig-last{font-size:12px;color:var(--t2);display:flex;gap:8px;align-items:baseline;padding-top:9px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig-last .n{color:var(--gold);flex-shrink:0}
.ig-last.off{color:#fca5a5;white-space:normal;align-items:center}.ig-last.add{color:var(--t3);white-space:normal;line-height:1.4}
.ig-more{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--gold);min-height:32px}
.ig-stream{padding:6px 14px;display:flex;flex-direction:column}
.ist{display:grid;grid-template-columns:46px 120px 1fr;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;animation:tin .35s var(--ease)}
.ist:last-child{border-bottom:0}
.ist .n{color:var(--t3)}.ist-s{font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ist-t{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ist.bad .ist-t{color:#fca5a5}.ist.warn .ist-t{color:#fcd34d}
@media(max-width:600px){.ist{grid-template-columns:42px 1fr}.ist-t{grid-column:2}}
.mx{display:flex;flex-direction:column;gap:2px;overflow-x:auto}
.mx-r{display:grid;grid-template-columns:minmax(118px,1.4fr) repeat(6,minmax(34px,1fr));gap:4px;align-items:center;min-height:34px;width:100%;text-align:left;font:inherit;color:inherit}
.mx-hd b{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.mx-n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-c{justify-self:center;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);font-style:normal}
.mx-c.on{background:var(--gold);color:var(--on-gold);box-shadow:0 0 10px -2px rgba(224,178,87,.7)}
.mx-c.off{border:1.5px solid var(--bad);color:#fca5a5;box-shadow:0 0 10px -3px rgba(248,113,113,.6)}
.mx-c.add{border:1.5px dashed var(--gold-bd);color:var(--gold)}
.mx-leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--t3)}.mx-leg span{display:flex;align-items:center;gap:6px}.mx-leg .mx-c{width:18px;height:18px;font-size:9px}
/* what the rest of the app looks like when a feed is off */
.tile.gap{border-style:dashed;border-color:rgba(248,113,113,.35);background:linear-gradient(150deg,rgba(248,113,113,.05),var(--card) 70%)}
.tile.gap .tv{color:#fca5a5;opacity:.85}.tile.gap .ts{color:#fca5a5}
.tile[data-gap]::after{content:attr(data-gap);position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;color:#fca5a5;background:var(--bad-bg);border-radius:8px;padding:2px 7px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gapc{padding:16px;display:flex;flex-direction:column;gap:9px;border-style:dashed!important;border-color:rgba(248,113,113,.35)!important;background:linear-gradient(150deg,rgba(248,113,113,.06),var(--card) 70%)!important}
.gapc-h{display:flex;align-items:center;gap:8px;color:#fca5a5}.gapc-h b{font:600 15px var(--disp);color:var(--t1)}
.gapc p{font-size:13px;color:var(--t2);line-height:1.45}.gapc .btn{align-self:flex-start}
.gapbar{display:flex;align-items:center;gap:7px;padding:8px 11px;margin-bottom:8px;border-radius:10px;font-size:12px;font-weight:600;color:#fca5a5;background:var(--bad-bg);border:1px dashed rgba(248,113,113,.4);cursor:pointer}
.chip.off{color:var(--t4);border-style:dashed;border-color:rgba(248,113,113,.35)}
.ig-tile .tviz .isp{height:30px}


/* ===================== v6 · scanning from the home screen ===================== */
html,body{overscroll-behavior:none}
.scan.nocam .sc-ret{opacity:.2}
.sc-cam{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;width:min(84vw,330px);padding:18px 18px 16px;border-radius:18px;
  background:rgba(10,10,14,.88);border:1px solid rgba(224,178,87,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 30px -12px rgba(224,178,87,.5);animation:tin .2s var(--ease)}
.sc-cam b{font:600 16px/1.25 var(--disp);color:#fff}
.sc-cam p{font-size:13px;line-height:1.45;color:rgba(255,255,255,.72)}
.sc-cam .btn{margin-top:3px}
.sc-cic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#E0B257;background:rgba(224,178,87,.12);border:1px solid rgba(224,178,87,.38)}
.sc-spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(224,178,87,.25);border-top-color:#E0B257;animation:scSpin .8s linear infinite}
@keyframes scSpin{to{transform:rotate(360deg)}}
.sc-acts button.na{opacity:.42}
.card.tq{display:flex;gap:16px;align-items:center}.card.tq .qrbox{margin:0;padding:9px;border-radius:12px;flex-shrink:0}
</style>
</head>

  f.int=(lo,hi)=>lo+Math.floor(f()*(hi-lo+1));f.pick=a=>a[Math.floor(f()*a.length)];f.chance=p=>f()<p;
  f.norm=()=>{let u=0,v=0;while(!u)u=f();while(!v)v=f();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v);};
  f.w=(pairs)=>{let t=0;for(const p of pairs)t+=p[1];let x=f()*t;for(const p of pairs){x-=p[1];if(x<=0)return p[0];}return pairs[pairs.length-1][0];};
  return f;}

const fD=ms=>{const d=g(ms);return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()];};
const fDS=ms=>{const d=g(ms);return d.getUTCDate()+' '+MON[d.getUTCMonth()];};

  return d>0?d+'d '+pad(h)+'h':h>0?h+'h '+pad(m)+'m':m+'m';}
function fAgo(ms){const a=Math.max(0,ms);return a<MIN?'now':a<HOUR?Math.floor(a/MIN)+'m ago':a<DAY?Math.floor(a/HOUR)+'h ago':Math.floor(a/DAY)+'d ago';}

const Clock={mode:'real',simAt:0,realAt:0,speed:1,
  now(){return this.mode==='real'?Date.now():this.simAt+(performance.now()-this.realAt)*this.speed;},

/* iPhone has no vibrate(). Safari gives a system haptic when a switch control toggles,
   so a hidden switch is toggled once per pulse: one for admit, two for a warning, three for a refusal. */
let _hl=null;
function iosTap(p){if(!isIOS())return;const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  if(!_hl){_hl=document.createElement('label');_hl.setAttribute('aria-hidden','true');_hl.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden';
    const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;_hl.appendChild(i);_hl.addEventListener('click',e=>e.stopPropagation());document.body.appendChild(_hl);}
  const n=Array.isArray(p)?(p[0]>=150?3:2):1;for(let k=0;k<n;k++)setTimeout(()=>{try{_hl.click();}catch(_){}},k*120);}
const haptic=p=>{try{if(navigator.vibrate&&!isIOS()){navigator.vibrate(p);return;}iosTap(p);}catch(_){}};

/* iPhone only plays sound after a tap, and mutes web audio on the silent switch.
   The first tap unlocks audio; the playback session keeps door beeps audible on silent. */
function audioUnlock(){if(_ac&&_ac.state==='running')return;try{if(navigator.audioSession&&UI&&UI.sound&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(_){}
  try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const r=_ac.resume();if(r&&r.catch)r.catch(()=>{});const b=_ac.createBuffer(1,1,22050),src=_ac.createBufferSource();src.buffer=b;src.connect(_ac.destination);src.start(0);}catch(_){}}
['touchend','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,audioUnlock,{capture:true,passive:true}));

  o.frequency.value=kind==='ok'?1180:kind==='warn'?620:300;o.type=kind==='ok'?'sine':'square';gn.gain.value=.06;o.connect(gn);gn.connect(_ac.destination);o.start();o.stop(_ac.currentTime+(kind==='ok'?.09:.22));}catch(_){}}

/* ---------- cost model ---------- */

  const ns=PAST[3];fc.att=t>=D?null:Math.round(Math.min(VENUE.capacity,(Math.min(7600,(tk.sold[0]+tk.sold[1])/pG+tk.sold[2]/pT))*(1-ns.noShowGA)+Math.min(2800,tb.seats/pT)*(1-ns.noShowSeat)+420));
  s.plan=planFor(Wd,t,fc);fc.door=t>=C?door:s.plan.door;fc.bar=t>=C?bar:Math.max(bar,s.plan.bar*(t>D?.5+.5*bar/Math.max(1,s.plan.bar):1));

/* ---------- search across guests, tables, bookings ---------- */
function searchAll(q,limit){q=q.trim().toLowerCase();if(q.length<2)return [];const out=[],t=now();
  if(canTables())for(const T of W.tables){if(T.name.toLowerCase().includes(q)||T.id.toLowerCase()===q)out.push({type:'table',T});if(out.length>5)break;}
  const seen={};
  for(const b of W.bookings){if(!bActive(b,t)&&!bPending(b,t))continue;for(const s of b.seats){if(s.g<0||seen[s.g])continue;const gst=W.guests[s.g];
    if(gst.n.toLowerCase().includes(q)||gst.ph.replace(/\s/g,'').includes(q.replace(/\s/g,''))||s.ref.toLowerCase()===q){seen[s.g]=1;out.push({type:'seat',s,gst,b});}}if(out.length>(limit||40))return out;}
  for(const x of W.tix){if(x.at>t||x.g<0||seen[x.g])continue;const gst=W.guests[x.g];if(gst.n.toLowerCase().includes(q)||x.ref.toLowerCase()===q||gst.ph.replace(/\s/g,'').includes(q.replace(/\s/g,''))){seen[x.g]=1;out.push({type:'tix',x,gst});if(out.length>(limit||40))break;}}
  return out;}
function conflicts(gi,tableId){const out=[],t=now(),ix=S().ix,T=W.T[tableId];
  W.rules.forEach(r=>{if(r.a!==gi&&r.b!==gi)return;const other=r.a===gi?r.b:r.a,ob=W.bookings.find(b=>bActive(b,t)&&b.booker===other);if(!ob)return;const OT=W.T[tableAt(ob,t)],d=Math.hypot(OT.x-T.x,OT.z-T.z);
    if(r.kind==='apart'&&d<70)out.push({r,other,OT,d,bad:1});if(r.kind==='near'&&d>120)out.push({r,other,OT,d,bad:0});});
  const e=ix[tableId];if(e&&e.st==='held')out.push({hold:e.h,bad:1});return out;}

/* co-attendance: who comes with whom */
function network(nodes,edges,sel){const Wp=340,Hp=240,R=rng(7);nodes.forEach((n,i)=>{const a=i/nodes.length*6.283;n.x=Wp/2+Math.cos(a)*90*(.5+R()*.6);n.y=Hp/2+Math.sin(a)*70*(.5+R()*.6);});
  const idx={};nodes.forEach((n,i)=>idx[n.id]=i);
  for(let it=0;it<140;it++){for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;const f=380/(d*d);dx/=d;dy/=d;a.x+=dx*f;a.y+=dy*f;b.x-=dx*f;b.y-=dy*f;}
    edges.forEach(e=>{const a=nodes[idx[e.a]],b=nodes[idx[e.b]];if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-34)*.02*Math.min(3,e.w);a.x+=dx/d*f;a.y+=dy/d*f;b.x-=dx/d*f;b.y-=dy/d*f;});
    nodes.forEach(n=>{n.x+=(Wp/2-n.x)*.012;n.y+=(Hp/2-n.y)*.016;n.x=clamp(n.x,14,Wp-14);n.y=clamp(n.y,14,Hp-14);});}
  let g='';edges.forEach(e=>{const a=nodes[idx[e.a]],b=nodes[idx[e.b]];if(a&&b)g+='<line x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'" class="'+(sel!=null&&(e.a===sel||e.b===sel)?'s-gold':'s-g3')+'" stroke-width="'+Math.min(3,.5+e.w*.5)+'" opacity=".7"/>';});
  nodes.forEach(n=>{const r=4+Math.min(9,n.deg*1.1);g+='<circle data-act="guest" data-g="'+n.id+'" cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="'+r.toFixed(1)+'" class="'+(n.hub?'f-gold':'f-g2')+' s-bg" stroke-width="1.5" style="cursor:pointer"/>';
    if(n.hub)g+='<text x="'+n.x.toFixed(1)+'" y="'+(n.y-r-4).toFixed(1)+'" text-anchor="middle" class="ct" style="fill:var(--t1);font-weight:700">'+esc(n.label)+'</text>';});
  return svgWrap(Wp,Hp,g);}
function coGraph(Wd,t){const deg={},edges=[],seen={};
  Wd.bookings.forEach(b=>{if(!bActive(b,t))return;const here=b.seats.filter(s=>s.g>=0&&(t<Wd.D||s.ar)).slice(0,5);const host=b.booker;here.forEach(s=>{if(s.g===host)return;edges.push({a:host,b:s.g,w:1+Wd.guests[s.g].v*.3});deg[host]=(deg[host]||0)+1;deg[s.g]=(deg[s.g]||0)+1;});});
  Wd.rules.forEach(r=>{if(r.kind==='near'){edges.push({a:r.a,b:r.b,w:3});deg[r.a]=(deg[r.a]||0)+2;deg[r.b]=(deg[r.b]||0)+2;}});
  const hubs=Object.keys(deg).map(Number).filter(i=>Wd.guests[i].crm===2).sort((a,b)=>deg[b]-deg[a]).slice(0,9),keep={};hubs.forEach(h=>keep[h]=1);
  const E=edges.filter(e=>keep[e.a]||keep[e.b]).slice(0,60);E.forEach(e=>{keep[e.a]=1;keep[e.b]=1;});
  /* bridges: people who link two hubs are the ones worth knowing */
  for(let i=0;i<hubs.length-1;i+=2)E.push({a:hubs[i],b:hubs[i+1],w:2});
  const nodes=Object.keys(keep).map(Number).map(i=>({id:i,label:Wd.guests[i].n.split(' ')[0]+' '+Wd.guests[i].n.split(' ').pop()[0]+'.',deg:deg[i]||1,hub:hubs.includes(i)}));
  return {nodes,edges:E,hubs};}

  detail:s=>{const rows=[['Early entry',s.tk.sold[0],.07],['Second wave',s.tk.sold[1],.105],['VIP standing',s.tk.sold[2],.05],['Table seats',s.tb.seats,PAST[3].noShowSeat],['Guest list and promoter lists',s.tk.sold[4]+s.tk.sold[5],.22]],exp=sum(rows,r=>r[1]*(1-r[2])),issued=sum(rows,r=>r[1]),fcIssued=s.fc.att?s.fc.att/(1-.1):issued,head=VENUE.capacity-(s.fc.att||exp)*.97;

    '<div class="hud" style="padding:14px"><div class="kv"><span>Issued so far</span><b class="n">'+n0(issued)+'</b><span>Expected attendance on the night</span><b class="n">'+n0(s.fc.att||exp)+'</b><span>Licensed capacity</span><b class="n">'+n0(VENUE.capacity)+'</b><span>Headroom at peak</span><b class="n '+(head<200?'warn':'')+'">'+n0(head)+'</b></div></div>'+
    '<p class="note">Rates are from Season 2: '+N((PAST[3].noShowGA*100).toFixed(1)+'%')+' of tickets and '+N((PAST[3].noShowSeat*100).toFixed(1)+'%')+' of table seats did not arrive. '+(head>300?'There is room to release about '+N(n0(Math.floor(head/100)*100))+' more Second wave tickets and stay under capacity at peak.':'Hold further releases. Peak is forecast close to capacity.')+'</p>';}};

M.ready={t:'Readiness',tile:s=>{const c=checkState(W,now()),d=c.filter(x=>x.done).length,late=c.some(x=>x.late);return tile('ready','Readiness',d+'<small>of '+c.length+'</small>',late?'Something is overdue':'On track for doors','<div class="meter"><i style="width:'+pct(d,c.length)+'"></i></div>',{dot:late?'bad':null});},

/* ============================================================
   62 · HOME · LIVE
   Largest numerals, only what changes a decision in the next
   ten minutes. Everything else is one tap down in a sheet.
   ============================================================ */
const mySec=()=>UI.role==='host'?ROLES.host.sec:null;
function unseatedTables(t){const sec=mySec(),out=[];W.bookings.forEach(b=>{if(!bActive(b,t)||(sec&&b.sec!==sec))return;let n=0,old=t;b.seats.forEach(s=>{if(s.ar&&s.ar<=t&&!(s.st&&s.st<=t)){n++;if(s.ar<old)old=s.ar;}});if(n&&t-old>8*MIN)out.push({b,n,wait:t-old});});return out.sort((a,b)=>b.wait-a.wait);}
function openSvc(t){const sec=mySec();return W.svc.filter(r=>r.at<=t&&!r.op&&r.res>t&&bActive(r.b,t)&&(!sec||r.b.sec===sec));}
const liveAlerts=t=>W.alerts.filter(a=>a.at<=t&&!a.ack&&t-a.at<50*MIN);
function noShowTables(s){const sec=mySec();return W.tables.filter(T=>T._st==='noshow'&&s.ix[T.id]&&(!sec||T.sec===sec)).map(T=>s.ix[T.id].b);}
function needsLive(s){const t=now(),out=[],r=UI.role,un=unseatedTables(t),sv=openSvc(t).filter(x=>t-x.at>6*MIN),al=liveAlerts(t),ns=noShowTables(s),gaps=(s.staff||[]).filter(x=>x.in/x.sp.plan<.92);
  if(s.ph==='pre')return out;
  if(s.capPct>.95&&r!=='runner')out.push({id:'head',tone:'bad',ic:'alert',title:'Venue at '+N(pct(s.head,VENUE.capacity))+' of capacity',sub:'Hold door sales and slow the GA lanes'});
  if(s.capAlert&&(r==='owner'||r==='door')){const g_=s.gates.slice().sort((a,b)=>b.load-a.load)[0];out.push({id:'gates',tone:'bad',ic:'gate',title:'Arrivals near gate throughput',sub:esc(g_.g.label)+' at '+N(pct(g_.load,1))+', wait '+N(g_.wait.toFixed(0))+' min'});}
  if(al.length&&(r==='owner'||r==='door'))out.push({id:'fraud',tone:'bad',ic:'shield',title:N(al.length)+' ticket alerts',sub:'Duplicate codes and name mismatches at the gates'});
  if(un.length&&r!=='door'&&r!=='runner')out.push({id:'unseated',tone:'warn',ic:'users',title:N(un.length)+pl(un.length,' table')+' waiting to be seated',sub:'Longest wait '+N(fDur(un[0].wait))+' at '+esc(W.T[tableAt(un[0].b,t)].name)});
  const bd=s.tb.balDue.filter(b=>!mySec()||b.sec===mySec());
  if(bd.length&&r!=='door'&&r!=='runner')out.push({id:'balances',tone:bd.some(b=>b.declined)?'bad':'warn',ic:'card',title:N(bd.length)+' balances to collect',sub:AK(sum(bd,b=>b._m.balance))+' open'+(bd.some(b=>b.declined)?', some cards declined':'')});
  if(sv.length&&r!=='door')out.push({id:'svc',tone:'warn',ic:'bell',title:N(sv.length)+' service requests over 6 minutes',sub:esc(sv[0].kind)+' at '+esc(W.T[tableAt(sv[0].b,t)].name)});
  if(ns.length&&(r==='owner'||r==='host'))out.push({id:'noshow',tone:'warn',ic:'x',title:N(ns.length)+' tables past their hold',sub:'Call, release, or offer to the waitlist'});
  if(gaps.length&&r==='owner')out.push({id:'staff',tone:'warn',ic:'user',title:'Coverage gap: '+esc(gaps[0].sp.role),sub:N(gaps[0].in)+' of '+N(gaps[0].sp.plan)+' clocked in'});
  return out;}

M.arrivals={t:'Arrival rate',hero:s=>{if(s.ph==='pre')return '';const tier=UI.home.arrTier,d=s.rate-s.ratePrev;
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="lbl">Arrivals, guests per minute</span><div class="seg" style="width:150px"><button class="'+(!tier?'on':'')+'" data-act="arrMode" data-m="">Type</button><button class="'+(tier?'on':'')+'" data-act="arrMode" data-m="1">Tier</button></div></div>'+

    (s.capAlert?'<div class="banner bad" style="margin-top:10px">'+I('alert',17)+'<span><b>Close to gate throughput.</b> Open the overflow lane at '+esc(s.gates.slice().sort((a,b)=>b.load-a.load)[0].g.label)+' and send table guests to Gate 3.</span></div>':'')+
