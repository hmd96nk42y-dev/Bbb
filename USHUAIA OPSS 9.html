M.head={t:'Headcount',tile:s=>tile('head','In the venue now',n0(s.head)+'<small>of '+n0(VENUE.capacity)+'</small>',N(n0(s.inAll))+' in · '+N(n0(s.exits))+' out · '+N(pct(s.head,VENUE.capacity,1)),'<div class="meter"><i class="'+(s.capPct>.95?'bad':'')+'" style="width:'+pct(s.head,VENUE.capacity)+';'+(s.capPct>.95?'background:var(--bad)':'')+'"></i><em style="left:95%"></em></div>',{w2:true,dot:s.capPct>.95?'bad':null}),
  detail:s=>{const zones=densityZones(s);return '<div class="big n">'+n0(s.head)+'<small>of '+n0(VENUE.capacity)+'</small></div><div class="meter" style="margin-top:4px"><i style="width:'+pct(s.head,VENUE.capacity)+'"></i><em style="left:95%"></em></div>'+
    '<div class="hud" style="padding:14px"><div class="kv"><span>Scanned in</span><b class="n">'+n0(s.inAll)+'</b><span>Counted out at the gates</span><b class="n">'+n0(s.exits)+'</b><span>Issued and not yet in</span><b class="n">'+n0(Math.max(0,s.issued-s.inAll))+'</b><span>Room before the 95% line</span><b class="n">'+n0(Math.max(0,VENUE.capacity*.95-s.head))+'</b></div></div>'+
    '<div class="grp"><div class="lbl">Crowd density by zone</div>'+zones.map(z=>hbar(z.l,z.n/z.cap,n0(z.n)+' / '+n0(z.cap),z.n/z.cap>.92?'bad':z.n/z.cap>.8?'warn':'g')).join('')+'</div><p class="note">No re-entry. Headcount is scans in less exits counted at the gate turnstiles. Zone numbers are estimated from scan times and the camera counters.</p>';}};
function densityZones(s){const ga=Math.max(0,s.head-s.tb.seatIn*Math.max(0,1-s.exits/Math.max(1,s.inAll))),vs=Math.min(760,s.tk.in[2]),rest=Math.max(0,ga-vs),ph=clamp((s.t-W.D)/(W.C-W.D),0,1),f=.30+.14*Math.sin(Math.min(1,ph*1.6)*1.57);
  const z=[{id:'pit',l:'Pit, VIP standing',n:vs,cap:800},{id:'front',l:'Front floor',n:rest*f,cap:2300},{id:'mid',l:'Mid floor',n:rest*.36,cap:2600},{id:'back',l:'Back floor',n:rest*(.5-f)*.8+rest*.1,cap:2000},{id:'plaza',l:'Entry plaza',n:rest*(.5-f)*.2+rest*.04+s.rate*3,cap:900}];
  const sp=(a,b,m)=>{const o=Math.max(0,z[a].n-z[a].cap*m);z[a].n-=o;z[b].n+=o;};sp(1,2,.96);sp(2,3,.95);sp(3,4,.97);return z;}

M.gates={t:'Gates',tile:s=>{if(!s.gates)return '';const g_=s.gates.slice().sort((a,b)=>b.wait-a.wait||b.load-a.load)[0];return tile('gates','Gate queues',g_.wait.toFixed(0)+'<small>min</small>','Longest at '+esc(g_.g.label)+' · '+N(Math.round(s.rate))+' of '+N(s.gateCap)+'/min',null,{dot:g_.wait>8||g_.load>.9?'bad':g_.load>.75?'warn':null});},
  detail:s=>'<div class="rows">'+s.gates.map(x=>'<div class="row" style="grid-template-columns:auto 1fr"><div class="ri '+(x.load>.9?'bad':x.load>.75?'warn':'ok')+'">'+I(x.load>.9?'alert':x.load>.75?'clock':'check',17)+'</div><div class="rt"><b>'+esc(x.g.label)+' · '+esc(x.g.sub)+'</b><span>'+N(x.rate.toFixed(0))+' of '+N(x.g.cap)+'/min · queue about '+N(x.queue)+' · wait '+N(x.wait.toFixed(0))+' min · '+N(n0(x.total))+' in tonight</span><div class="meter" style="margin-top:7px;height:6px"><i style="width:'+clamp(x.load*100,0,100)+'%;background:var(--'+(x.load>.9?'bad':x.load>.75?'warn':'ok')+')"></i></div></div></div>').join('')+'</div>'+
    (s.capAlert?'<div class="banner bad">'+I('alert',17)+'<span><b>What to do.</b> Open the overflow lane, move one scanner from Gate 4 to the busiest gate, and have hosts walk table guests to Gate 3.</span></div>':'<div class="banner ok">'+I('check',17)+'<span>All gates are inside comfortable throughput.</span></div>')+
    '<button class="btn sm full" data-act="incNew" data-z="Gates">'+I('flag',16)+'Log a gate action</button>'};

M.split={t:'Revenue: preordered and on-site',tile:s=>{const f=s.fin,pre=f.dep+f.tix;return tile('split','On-site revenue',kfmt(f.onsite)+'<small>AED</small>',N(pct(f.onsite,f.collected))+' of everything collected','<div class="meter"><i class="pre" style="width:'+pct(pre,f.collected)+'"></i><i style="left:'+pct(pre,f.collected)+';width:'+pct(f.onsite,f.collected)+';border-radius:0 5px 5px 0"></i></div>');},
  detail:s=>{const f=s.fin,mx=Math.max(f.tix,f.dep,f.bar,f.settled,f.door,1);return '<div class="grp"><div class="lbl">Paid before doors · '+AK(f.dep+f.tix)+'</div>'+hbar('Tickets',f.tix/mx,aedK(f.tix),'g')+hbar('Deposits, pre-orders',f.dep/mx,aedK(f.dep),'g')+'</div>'+
    '<div class="grp"><div class="lbl">Taken on site · '+AK(f.onsite)+'</div>'+hbar('Bars',f.bar/mx,aedK(f.bar))+hbar('Table bills settled',f.settled/mx,aedK(f.settled))+hbar('Door tickets',f.door/mx,aedK(f.door))+'</div>'+
    '<div class="hud" style="padding:14px"><div class="kv"><span>Table balances still open</span><b>'+A(f.committed)+'</b><span>Table spend above minimums</span><b>'+A(s.tb.over)+'</b><span>Forecast for the night</span><b>'+A(s.fc.gross)+'</b></div></div>';}};

M.noshow={t:'No-shows and releases',tile:s=>{const ns=s.tb.st.noshow,notIn=Math.max(0,s.issued-s.inAll);return tile('noshow','No-shows',ns+'<small>tables</small>',N(n0(notIn))+' tickets and seats not in yet',null,{dot:ns?'warn':null});},
  detail:s=>{const t=now(),list=noShowTables(s),wl=W.waitlist.filter(w=>w.at<=t&&!w.offered),ph=clamp((t-W.D)/(W.C-W.D),0,1),usual=clamp(.02+1.9*ph-1.0*ph*ph,0,.905);
    return '<div class="hud" style="padding:14px"><div class="kv"><span>Arrived so far</span><b class="n">'+pct(s.inAll,s.issued,1)+'</b><span>By this time last season</span><b class="n">'+(usual*100).toFixed(0)+'%</b><span>Early entry tickets now expired</span><b class="n">'+(t>W.D+VENUE.earlyCutMin*MIN?n0(s.tk.sold[0]-s.tk.in[0]):'0')+'</b></div></div>'+
    (list.length?'<div class="grp"><div class="lbl">Tables past their hold</div><div class="rows">'+list.map(b=>{const T=W.T[tableAt(b,t)],m=b._m,w=wl.filter(x=>x.grp===b.grp&&x.budget>=b.min*.8).sort((a,c)=>(c.walk||0)-(a.walk||0)||G(c.g).crm-G(a.g).crm)[0];
      return '<div class="row" style="grid-template-columns:auto 1fr"><div class="ri bad">'+I('x',17)+'</div><div class="rt"><b>'+esc(T.name)+' · '+esc(gName(b.booker))+'</b><span>Due '+N(fT(b.arriveBy))+', '+N(fDur(t-b.arriveBy))+' ago · paid '+N(aedK(m.collected))+' of '+N(aedK(m.min))+' · '+N(b._c.claimed)+' seats claimed</span>'+
        (w?'<span class="gold">Waitlist match: '+esc(gName(w.g))+', party of '+N(w.party)+', budget '+N(aedK(w.budget))+'</span>':'')+
        '<div class="btnrow" style="margin-top:8px"><button class="btn xs" data-act="callG" data-g="'+b.booker+'">'+I('phone',14)+'Call</button><button class="btn xs warn" data-act="relOffer" data-b="'+b.id+'" data-w="'+(w?w.id:'')+'">'+I('lock',14)+(w?'Release and offer':'Release')+'</button></div></div></div>';}).join('')+'</div></div>':empty('No table is past its hold. Tables are held '+VENUE.graceMin+' minutes after their arrive-by time.'))+
    '<p class="note">Releasing keeps the deposit, frees the table on the floor and, if there is a match, texts the waitlist guest an offer. It needs a Manager PIN.</p>';}};

M.vipl={t:'VIP arrivals',tile:s=>{const t=now(),v=W.bookings.filter(b=>bActive(b,t)&&b.vip),inn=v.filter(b=>b.seats[0].ar&&b.seats[0].ar<=t).length;return tile('vipl','VIP arrivals',inn+'<small>of '+v.length+'</small>','Backstage List and Backstage tables','<div class="meter"><i style="width:'+pct(inn,v.length)+'"></i></div>');},

/* ============================================================
   64 · HOME · POST
   Report-style. The same numbers feed the PDF (85-report.js),
   so the screen and the document can never disagree.
   ============================================================ */
function postStats(Wd,s){if(Wd._post&&Wd._postK===Wd.rev+':'+Math.floor(s.t/HOUR))return Wd._post;const t=s.t,D=Wd.D,C=Wd.C,p={};
  /* attendance */
  p.show=[['Early entry',s.tk.sold[0],s.tk.in[0]],['Second wave',s.tk.sold[1],s.tk.in[1]],['VIP standing',s.tk.sold[2],s.tk.in[2]],['Table seats',s.tb.seats,s.tb.seatIn],['Guest list and comps',s.tk.sold[4],s.tk.in[4]],['Promoter lists',s.tk.sold[5],s.tk.in[5]],['Door tickets',s.tk.sold[3],s.tk.in[3]]];
  p.issued=sum(p.show,r=>r[1]);p.inAll=sum(p.show,r=>r[2]);p.showRate=p.inAll/Math.max(1,p.issued);
  p.bySrc=SRC_GROUPS.map(g_=>{const l=SOURCES.filter(x=>x.grp===g_[0]);return {id:g_[0],label:g_[1],n:sum(l,x=>s.src[x.id].n),in:sum(l,x=>s.src[x.id].in),rev:sum(l,x=>s.src[x.id].rev),comm:sum(l,x=>s.src[x.id].comm)};});
  /* peak + dwell */
  let cum=0,pk=0,pkT=D,arrW=0;for(let i=0;i<Wd.nB;i++){const n=sum([0,1,2,3,4],k=>s.arr[k][i]);cum+=n;arrW+=n*(D+i*5*MIN);const tt=D+(i+1)*5*MIN,h=cum-Wd.exits(tt);if(h>pk){pk=h;pkT=tt;}}
  p.peak=pk;p.peakAt=pkT;p.avgArr=arrW/Math.max(1,cum);p.dwell=(C-48*MIN)-p.avgArr;p.rush=s.peakAt;
  /* gates: replay the queue model for the worst moment at each gate */
  p.gates=GATES.map(gt=>{let q=0,mx=0,mxT=D,over=0;for(let i=0;i<Wd.nB;i++){q=Math.max(0,q+s.gate[gt.id][i]*1.3-gt.cap*5);const w=q/gt.cap;if(w>mx){mx=w;mxT=D+i*5*MIN;}if(s.gate[gt.id][i]/5>gt.cap*.9)over++;}return {g:gt,maxWait:mx,at:mxT,over:over*5,total:sum(s.gate[gt.id])};});
  /* tables */
  const bks=Wd.bookings.filter(b=>bActive(b,t));p.above=[];p.below=[];p.noshow=[];
  bks.forEach(b=>{const m=money(b,t),arr=b.seats.some(x=>x.ar);b._m=m;if(!arr)p.noshow.push(b);else if(b.comp||m.spend>=m.min)p.above.push(b);else p.below.push(b);});
  p.shortfall=sum(p.below,b=>b._m.min-b._m.spend);p.overSum=sum(p.above,b=>Math.max(0,b._m.spend-b._m.min));
  p.seatBooked=sum(bks,b=>b.party);p.seatIn=sum(bks,b=>b.seats.filter(x=>x.ar).length);
  /* service + seating */
  const del=[],seat=[];bks.forEach(b=>{b.orders.forEach(o=>{if(o.del&&o.del>o.at)del.push((o.del-o.at)/MIN);});b.seats.forEach(x=>{if(x.ar&&x.st>x.ar)seat.push((x.st-x.ar)/MIN);});});
  del.sort((a,b)=>a-b);seat.sort((a,b)=>a-b);const med=a=>a.length?a[Math.floor(a.length/2)]:0;
  p.delMed=med(del);p.delSlow=del.filter(x=>x>15).length;p.delN=del.length;p.seatMed=med(seat);p.seatSlow=seat.filter(x=>x>12).length;
  p.moves=[];bks.forEach(b=>b.moves.forEach(m=>p.moves.push({b,m})));p.walkins=bks.filter(b=>b.walk);
  /* guests */
  const att={};Wd.tix.forEach(x=>{if(x.sc&&x.g>=0)att[x.g]=1;});Wd.seats.forEach(x=>{if(x.ar&&x.g>=0)att[x.g]=1;});const ids=Object.keys(att).map(Number);
  p.guests=ids.length;p.newG=ids.filter(i=>Wd.guests[i].crm===0).length;p.known=p.guests-p.newG;p.bl=ids.filter(i=>Wd.guests[i].crm===2).length;
  p.mk=ids.filter(i=>Wd.guests[i].mk).length;p.pc=ids.filter(i=>Wd.guests[i].pc).length;p.idU=ids.filter(i=>Wd.guests[i].idv===1).length;p.idS=p.guests-p.idU;
  /* tier moves */
  p.up=bks.filter(b=>{const gst=Wd.guests[b.booker];return gst.crm<2&&b.seats[0].ar&&b._m.spend>=25000&&gst.v>=1;}).sort((a,b)=>b._m.spend-a._m.spend).slice(0,12);
  p.down=p.noshow.filter(b=>Wd.guests[b.booker].crm===2);p.firstTable=bks.filter(b=>Wd.guests[b.booker].crm===0&&b.seats[0].ar&&b._m.spend>=b._m.min*1.2).slice(0,12);
  /* money vs forecast at doors */
  if(!Wd._fcD){const sd=snapshot(Wd,D-MIN,true);Wd._fcD=sd.fc;}
  const f=s.fin,fd=Wd._fcD;p.recon=[['Tickets, presale',fd.tix,f.tix],['Table minimums',fd.tables,s.tb.minSum],['Table spend over minimum',fd.over,s.tb.over],['Bars',fd.bar,f.bar],['Door tickets',fd.door,f.door]];
  p.fcGross=sum(p.recon,r=>r[1]);p.gross=sum(p.recon,r=>r[2]);p.writeOff=f.writeOff;p.open=f.committed;p.costs=s.cost.fixed+s.cost.v*p.gross;p.profit=p.gross-p.costs-p.writeOff;p.fcProfit=fd.profit;
  /* promoters */
  p.promo=SOURCES.filter(x=>x.comm>0).map(x=>{const d=s.src[x.id];return {x,n:d.n,in:d.in,rev:d.rev,spend:d.spend,comm:d.comm,show:d.in/Math.max(1,d.n)};}).filter(o=>o.n).sort((a,b)=>b.rev-a.rev);
  /* follow-ups */
  p.follow=[{id:'thanks',l:'Thank-you from the host',d:'Bookers who spent above their minimum',n:p.above.filter(b=>!b.comp).length,ch:'WhatsApp, signed by their host'},
    {id:'feedback',l:'Feedback request',d:'Everyone who attended and allows marketing',n:p.mk,ch:'One question, in the guest app'},
    {id:'first',l:'First look at the next event',d:'Attendees and the waitlist, 24 hours before general sale',n:p.guests+Wd.waitlist.length,ch:'Guest app and SMS'},
    {id:'recover',l:'Service recovery',d:'Tables with a delivery over 15 minutes',n:new Set(bks.filter(b=>b.orders.some(o=>o.del-o.at>15*MIN)).map(b=>b.id)).size,ch:'Personal call from the host'},
    {id:'missed',l:'We missed you',d:'No-show tables and Backstage List guests who did not come',n:p.noshow.length,ch:'The team, by message'}];
  p.sent=Wd.sent||(Wd.sent={});
  p.inc=by(Wd.incidents.filter(x=>x.at<=t),x=>x.type);p.alerts=Wd.alerts.filter(a=>a.at<=t);
  Wd._post=p;Wd._postK=Wd.rev+':'+Math.floor(s.t/HOUR);return p;}

M.closeout={t:'Close-out',hero:s=>{const p=postStats(W,s),d=p.gross/p.fcGross-1;
  return '<div class="hud hero"><span class="lbl">Close-out · '+esc(W.ev.head)+', '+fD(W.D)+'</span><div class="big n" style="margin-top:10px">'+n0(p.inAll)+'<small>through the gates</small></div>'+
    '<p class="sub" style="margin-top:6px;color:var(--t2)">'+N(pct(p.showRate,1,1))+' of everyone with a ticket or seat came. Peak '+N(n0(p.peak))+' in the venue at '+N(fT(p.peakAt))+'.</p>'+posBar(s.fin,true)+posLegend(s.fin,true)+
    '<div class="stat3"><div><b>'+aedK(p.gross)+'</b><span>revenue</span></div><div><b>'+aedK(p.profit)+'</b><span>profit</span></div><div><b>'+(d>=0?'+':'')+(d*100).toFixed(1)+'%</b><span>vs forecast at doors</span></div></div></div>';},

/* ============================================================
   70 · FLOOR
   Top-down plan from the same geometry as the guest app.
   Every overlay has its own encoding and its own legend:
   status uses shape + state colour, money uses gold intensity,
   progress uses a fill level, attention uses a pulse.
   Tap a table: data, straight away. Tap the floor: zone data
   drawn in the empty floor space. The pen only edits the layout.
   ============================================================ */
const FY=z=>904-z;
const shortId=id=>{const m=id.match(/^([A-Z])([A-Z])0*(\d+)$/);return m?m[2]+m[3]:id;};
function tRot(T){if(T.grp==='bs')return T.o==='c'?90:T.o==='d'?(T.x<0?-45:45):0;if(T.grp==='silver')return T.x<0?45:-45;return 0;}
function secBox(k){const ts=W.tables.filter(T=>T.sec===k);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;ts.forEach(T=>{x0=Math.min(x0,T.x);x1=Math.max(x1,T.x);y0=Math.min(y0,FY(T.z));y1=Math.max(y1,FY(T.z));});return {x:x0-24,y:y0-22,w:x1-x0+48,h:y1-y0+44,cx:(x0+x1)/2,cy:(y0+y1)/2};}
const GA_Z=[['pit',-108,690,216,76],['front',-112,560,224,128],['mid',-112,360,224,198],['back',-112,152,224,206],['plaza',-100,0,200,150]];
const ZONES={pit:{l:'Pit',s:'Pit',sec:14,bars:'Pit bar, two stations',who:'VIP standing'},front:{l:'Front floor',s:'Front',sec:18,bars:'North and south bars',who:'Early entry and Second wave'},
  mid:{l:'Mid floor',s:'Mid',sec:12,bars:'Centre bar',who:'Early entry and Second wave'},back:{l:'Back floor',s:'Back',sec:10,bars:'Back bars, two',who:'Second wave and door tickets'},plaza:{l:'Entry plaza',s:'Plaza',sec:18,bars:'Plaza kiosks',who:'Everyone arriving through Gates 1 to 3'}};
const canTables=()=>UI.role==='owner'||UI.role==='host';
const priceBand=v=>v>=60000?5:v>=30000?4:v>=15000?3:v>=10000?2:1;
function medDel(b,t){const d=b.orders.filter(o=>o.del>o.at&&o.del<=t).map(o=>(o.del-o.at)/MIN).sort((a,c)=>a-c);return d.length?d[Math.floor(d.length/2)]:null;}
function zoneAt(x,z){const a=GA_Z.find(a=>x>=a[1]&&x<=a[1]+a[3]&&z>=a[2]&&z<=a[2]+a[4]);return a?a[0]:null;}
function zoneData(s,p){const by_=a=>{const o={};a.forEach(z=>o[z.id]=z);return o;};
  if(p==='live')return by_(densityZones(s));
  if(p==='post'){const k=W.rev+':post';if(W._pz&&W._pzK===k)return W._pz;const ps=postStats(W,s),sp=snapshot(W,ps.peakAt,true);W._pzK=k;W._pz=by_(densityZones(sp));W._pz._at=ps.peakAt;return W._pz;}
  const att=s.fc.att||TARGET.att,vs=Math.round(s.tk.sold[2]*.95),rest=Math.max(0,att*.93-s.tb.seats*.88-vs);
  return by_([{id:'pit',n:vs,cap:800},{id:'front',n:rest*.34,cap:2300},{id:'mid',n:rest*.36,cap:2600},{id:'back',n:rest*.24,cap:2000},{id:'plaza',n:rest*.06,cap:900}]);}

/* ---------- what each overlay means, per phase and role ---------- */
function chipsFor(p){const R=UI.role;
  if(!canTables())return p==='live'?[['','Status']].concat(R==='runner'?[['prepend','Pre-orders pending']]:[]):[['','Status']];
  if(p==='pre')return [['','Status'],['tier','Price'],['promo','Promoters'],['vip','VIP and holds'],['claims','Seat claims'],['hosts','Hosts'],['pre','Pre-orders']];
  if(p==='live')return [['','All'],['vip','VIP'],['unpaid','Unpaid'],['noshow','No-show'],['prepend','Pre-orders pending'],['promo','Promoters']];
  return [['','Outcome'],['heat','Heat map'],['att','Attended'],['speed','Service speed'],['seating','Reseats, walk-ins']];}
function legendFor(p,ov,dens){const it=(cls,l,o)=>Object.assign({cls,l},o||{}),full=canTables(),R=UI.role;
  const dz=p==='live'&&dens?[{html:'<b class="lg-t lg-s">Floor density, % full</b>'},{html:'<span class="lg-dz"><i class="dz a"></i>&lt;80<i class="dz b"></i>80–92<i class="dz c"></i>&gt;92</span>'}]:[];
  const dimO=l=>it('ov-out',l,{dim:1});
  let L;
  if(p==='pre'){
    if(ov==='tier')L={t:'Minimum spend',i:[it('ov-p1','AED 6K'),it('ov-p2','AED 10K'),it('ov-p3','AED 15K to 18K'),it('ov-p4','AED 30K to 40K',{ink:1}),it('ov-p5','AED 60K and up',{ink:1})]};
    else if(ov==='promo')L={t:'Who sold the table',i:[it('ov-on','Promoter',{ink:1}),it('ov-grey','Partner'),dimO('Direct and other')]};
    else if(ov==='vip')L={t:'VIP and holds',i:[it('ov-on','Backstage List or Backstage',{ink:1,txt:'★'}),it('st-held','Held'),it('st-requested','Requested'),dimO('Everything else')]};
    else if(ov==='claims')L={t:'Seats named by guests',i:[it('ov-lvl','All seats claimed',{lvl:1}),it('ov-lvl','About half',{lvl:.5}),it('ov-lvl','None yet',{lvl:0}),dimO('Not booked')]};
    else if(ov==='hosts')L={t:'Section hosts',i:SEC_ORDER.map(k=>({html:'<span class="lg-h"><b class="n">'+initials(SECTIONS[k].host)+'</b>'+esc(SECTIONS[k].host.split(' ')[0])+' <em>'+esc(SECTIONS[k].label.replace('Backstage','BS').replace('Platinum','Plat').replace(' · ',' ').replace('Left','L').replace('Right','R').replace('Centre','C'))+'</em></span>'}))};
    else if(ov==='pre')L={t:'Pre-ordered, share of minimum',i:[it('ov-lvl','Fully covered',{lvl:1}),it('ov-lvl','Half covered',{lvl:.5}),it('ov-lvl','Nothing yet',{lvl:0,dim:1}),dimO('Not booked')]};
    else L={t:'Table status',i:[it('st-booked','Booked'),it('st-requested','Requested'),it('st-held','Held'),it('st-open','Open')]};}
  else if(p==='live'){
    if(ov==='vip')L={t:'VIP tables',i:[it('st-seated','Seated'),it('st-partial','Partly in'),it('st-expected','Expected'),it('st-noshow','No-show'),dimO('Not VIP')]};

/* ============================================================
   75 · GUEST PAYMENTS + EXPANDED GUEST PROFILE
   Every guest at a table carries their own payment status for
   this event: the deposit before doors, the bill on the night
   and after close. A table either has one payer (everyone else
   is covered) or splits, in which case each guest pays a share.
   ============================================================ */
const bSplit=b=>!b.comp&&!b.walk&&b.depPct>0&&b.party>=4&&h32(b.id+':split')%100<42;
const payerSeat=b=>{const i=b.seats.findIndex(x=>x.g===b.payer);return i>=0?i:0;};
function payState(b,i,t,ph){const r=payState0(b,i,t,ph);if(b.comp)return r;
  if(ph==='pre'&&!isOn('pay'))return {k:'mut',ic:'cloudoff',l:'—',s:'Payments off'};
  if(ph!=='pre'&&/^Tab/.test(r.l)&&!isOn('pos'))return {k:'mut',ic:'cloudoff',l:'—',s:'POS off'};
  if(ph!=='pre'&&/^(Paid|Declined|Unpaid)/.test(r.l)&&!isOn('term'))return {k:'mut',ic:'cloudoff',l:'—',s:'Tap to Pay off'};
  return r;}
function payState0(b,i,t,ph){const x=b.seats[i],sp=bSplit(b),pi=payerSeat(b),pn=esc(gName(b.payer).split(' ')[0]),hh=k=>h32(b.id+':'+i+':'+k);
  if(b.comp)return {k:'mut',ic:null,l:'Comp',s:'Nothing to pay'};
  if(ph==='pre'){if(!b.depPct)return {k:'mut',ic:null,l:'No deposit',s:'Pays on the night'};
    const dep=Math.round(b.min*b.depPct);
    if(!sp){if(i!==pi)return {k:'mut',ic:null,l:'Covered',s:'by '+pn};
      return b.depAt&&b.depAt<=t?{k:'ok',ic:'check',l:'Paid '+kfmt(dep),s:'Deposit, '+fDS(b.depAt)}:{k:'warn',ic:'clock',l:'Due '+kfmt(dep),s:'Deposit link sent '+fAgo(t-b.at)};}
    const sh=Math.round(dep/b.party),cl=x.cl&&x.cl<=t;
    if(b.depAt&&b.depAt<=t)return cl?{k:'ok',ic:'check',l:'Paid '+kfmt(sh),s:'Deposit share'}:{k:'mut',ic:null,l:'Covered',s:pn+' paid this share'};
    if(!cl)return {k:'mut',ic:null,l:'Share '+kfmt(sh),s:'Seat not claimed'};
    const pa=x.cl+(hh('d')%40)*HOUR;if(hh('p')%10<7&&pa<=t)return {k:'ok',ic:'check',l:'Paid '+kfmt(sh),s:'Deposit share, '+fDS(pa)};
    return {k:'warn',ic:'clock',l:'Due '+kfmt(sh),s:'Deposit share not paid'};}
  const m=money(b,t),came=!!(x.ar&&x.ar<=t),anyone=b.seats.some(s=>s.ar&&s.ar<=t);
  if(ph==='post'&&!anyone)return i===pi?{k:'mut',ic:null,l:m.dep?'Deposit kept':'No-show',s:m.dep?kfmt(m.dep)+' retained':'Nothing charged'}:{k:'mut',ic:null,l:'Did not come',s:''};
  if(!sp){if(i!==pi)return {k:'mut',ic:null,l:came?'On '+pn+'’s bill':'Covered',s:came?'':'by '+pn};
    if(b.payAt&&b.payAt<=t)return {k:'ok',ic:'check',l:'Paid '+kfmt(m.settled+m.collected),s:'Bill settled '+fT(b.payAt)};
    if(b.declined&&b.declined<=t)return {k:'bad',ic:'alert',l:'Declined',s:kfmt(m.balance)+' to collect'};
    if(ph==='post')return {k:'warn',ic:'clock',l:'Unpaid '+kfmt(m.balance),s:'Balance still open'};
    return {k:'neu',ic:'card',l:'Tab '+kfmt(m.spend),s:'Settles at close'};}
  const pres=b.seats.filter(s=>s.ar&&s.ar<=t).length||1;
  if(!came)return {k:'mut',ic:null,l:ph==='post'?'Did not come':'Not in yet',s:'Nothing charged'};
  const share=Math.round((m.settled||m.balance)/pres+m.collected/b.party);
  if(b.payAt&&b.payAt<=t)return {k:'ok',ic:'check',l:'Paid '+kfmt(share),s:'Own share, '+fT(b.payAt-(hh('t')%45)*MIN)};
  if(b.declined&&b.declined<=t&&i===pi)return {k:'bad',ic:'alert',l:'Declined',s:kfmt(share)+' to collect'};
  if(ph==='post')return {k:'warn',ic:'clock',l:'Unpaid '+kfmt(share),s:'Own share open'};
  const own=UI.flags.posSeat?sum(b.orders,o=>o.seat===i&&!o.pre&&!o.comp&&o.at<=t?o.amt:0):m.live/pres;
  return {k:'neu',ic:'card',l:'Tab '+kfmt(Math.round(own)),s:'Own tab, split bill'};}
function seatStatus(b,x,t,ph){const late=t>b.arriveBy+VENUE.graceMin*MIN;if(ph!=='pre'&&!isOn('scan'))return {c:x.cl?'cl':'un',l:'Arrival unknown'};
  if(ph==='pre')return x.cl&&x.cl<=t?{c:'cl',l:'Claimed'}:{c:'un',l:'Not claimed'};
  if(x.st&&x.st<=t)return {c:'se',l:'Seated '+fT(x.st)};if(x.ar&&x.ar<=t)return {c:'ar',l:'At the gate '+fT(x.ar)};
  if(late||ph==='post')return {c:'ns',l:ph==='post'?'Did not come':'No-show'};return {c:x.cl?'cl':'un',l:'Not arrived'};}
function payTag(ps){return '<span class="pay"><span class="pill '+ps.k+'">'+(ps.ic?I(ps.ic,12):'')+ps.l+'</span>'+(ps.s?'<em>'+ps.s+'</em>':'')+'</span>';}

/* 78 · QR encoder, shared with the guest app (byte mode, ECC M, v1-10) */
const QR=(function(){
  const ECC=[0,10,16,26,18,24,16,18,22,22,26],BLK=[0,1,1,1,2,2,4,4,4,5,5];
  function mul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;}
  function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1];}root=mul(root,2);}return r;}
  function rsRem(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f);});}return r;}
  function rawMods(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;}
  function dataCw(v){return Math.floor(rawMods(v)/8)-ECC[v]*BLK[v];}
  function alignPos(v,size){if(v===1)return[];const n=Math.floor(v/7)+2,step=Math.ceil((v*4+4)/(n*2-2))*2,res=[6];for(let p=size-7;res.length<n;p-=step)res.splice(1,0,p);return res;}
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let v=1;for(;v<=10;v++){const cc=v<10?8:16;if(4+cc+bytes.length*8<=dataCw(v)*8)break;}
    if(v>10)throw new Error('too long');
    const cc=v<10?8:16,bits=[];const push=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
    push(4,4);push(bytes.length,cc);bytes.forEach(b=>push(b,8));
    const cap=dataCw(v)*8;push(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    for(let pad=0xEC;bits.length<cap;pad^=0xEC^0x11)push(pad,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
    /* ecc + interleave */
    const nb=BLK[v],el=ECC[v],raw=Math.floor(rawMods(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const e=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(e));}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)cw.push(b[i]);});
    const size=v*4+17,M=[],F=[];for(let y=0;y<size;y++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false));}
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!==2&&d!==4);}};
    finder(3,3);finder(size-4,3);finder(3,size-4);

      for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true);};

    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&i<cw.length*8){M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1;i++;}}}
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&maskFn[m](x,y))M[y][x]=!M[y][x];};
    const penalty=()=>{let p=0,dark=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1;}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1;}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
      for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(M[y][x])dark++;
      p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p;};
    let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const pp=penalty();if(pp<bp){bp=pp;best=m;}apply(m);}
    apply(best);fmt(best);
    return {size,M};
  }
  function svg(text,px){const {size,M}=encode(text),q=4,n=size+q*2;let d='';for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(M[y][x])d+=`M${x+q} ${y+q}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="Ticket QR code"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;}
  return {encode,svg};
})();

  insecure:['Open BUBL OPS from its link','The camera only works on the https web link, not from a downloaded file. Open the link in Safari, then Share › Add to Home Screen.'],

      '<div class="sc-ret"><i></i><em></em></div><div id="scCam"></div><div class="sc-hint" id="scHint"></div>'+

      '<div class="sc-acts"><button data-act="scTorch" id="scTorch">'+I('torch',20)+'Torch</button><button data-act="scLookup">'+I('search',20)+'Look up</button><button data-act="scDoor">'+I('card',20)+'Door sale</button><button data-act="scSound" id="scSnd">'+I(UI.sound?'vol':'mute',20)+'Sound</button></div></div>'+

  update(){const el=$('#scan');if(!el)return;const m=this.mode(),s=S(),t=now();

    $('#scCount').innerHTML=m==='live'?'<b>'+n0(s.inAll)+'</b>in · this device '+this.mine+(Sync.online?'':' · offline, '+Sync.queue.length+' queued'):m==='practice'?'<b>'+this.mine+'</b>practice scans':'<b>'+n0(s.inAll)+'</b>final count';
    $('#scHint').textContent=this.cam?'Point at a ticket QR. Scanning is continuous.':this.err==='starting'?'':m==='practice'?'No camera. Tap a sample ticket to rehearse each result.':'No camera. Scan the next guest in line below.';

  tick(){if(!this.res)this.update();},
  paintCam(el){const c=$('#scCam',el);if(!c)return;const k=this.cam?null:(this.err||'idle'),big=k&&(isPhone()||k==='insecure'||k==='starting'),M_=k&&CAMMSG[k];
    el.classList.toggle('nocam',!this.cam);const tb=$('#scTorch',el);if(tb)tb.classList.toggle('na',this.cam&&!this.torchOK);
    const h=!big?'':'<div class="sc-cam" role="status">'+(k==='starting'?'<i class="sc-spin"></i>':'<span class="sc-cic">'+I(k==='denied'||k==='insecure'||k==='embedded'?'lock':'scan',22)+'</span>')+'<b>'+M_[0]+'</b>'+(M_[1]?'<p>'+M_[1]+'</p>':'')+

  async start(){this.release();const g=++this.gen;

    this.err='starting';this.update();let st=null,er=null;

    catch(e){er=e;if(!e||(e.name!=='NotAllowedError'&&e.name!=='SecurityError')){try{st=await md.getUserMedia({video:true,audio:false});er=null;}catch(e2){er=e2;}}}

  release(){cancelAnimationFrame(this.raf);this.raf=0;this.busy=false;if(this.stream){this.stream.getTracks().forEach(x=>x.stop());this.stream=null;}

  stop(){this.gen++;$('#stage').classList.remove('scanres');this.res=null;this.release();},
  async wake(on){try{if(on){if(this.wl||!('wakeLock' in navigator))return;const w=await navigator.wakeLock.request('screen');if(!this.stream){w.release().catch(()=>{});return;}this.wl=w;w.addEventListener('release',()=>{if(this.wl===w)this.wl=null;});}

/* ============================================================
   85 · post-event report
   One page model, two outputs: inline SVG for the preview and a
   hand-written vector PDF (A4, embedded Space Grotesk, Manrope and
   JetBrains Mono). No rasterising, no libraries, works offline.
   ============================================================ */
const RC={paper:'#FBF8F1',ink:'#17130C',ink2:'#3A3226',mut:'#6F6654',soft:'#A39A86',line:'#D9CFB6',brass:'#A8821F',gold:'#C9A227',card:'#F3EEE0',g2:'#6F6654',g3:'#A39A86',g4:'#D9CFB6',ok:'#1F8B5A',warn:'#A9690A',bad:'#C2413B'};
const WIN={0x20AC:128,0x2026:133,0x2018:145,0x2019:146,0x201C:147,0x201D:148,0x2022:149,0x2013:150,0x2014:151,0x2212:150,0x2122:153};
function winBytes(str){const out=[];for(const ch of String(str)){const c=ch.codePointAt(0);out.push(c<128||(c>=160&&c<256)?c:WIN[c]||63);}return out;}
function textW(str,font,size){const m=FONTS[font].m.w;let w=0;for(const b of winBytes(str))w+=m[b-32]||0;return w*size/1000;}
function RDoc(){this.pages=[];}
RDoc.prototype.page=function(){const p={ops:[]};this.pages.push(p);this.p=p;this.rect(0,0,595,842,{fill:RC.paper});return this;};
RDoc.prototype.rect=function(x,y,w,h,o){this.p.ops.push(['r',x,y,w,h,o||{}]);return this;};
RDoc.prototype.line=function(x1,y1,x2,y2,o){this.p.ops.push(['l',x1,y1,x2,y2,o||{}]);return this;};
RDoc.prototype.poly=function(pts,o){this.p.ops.push(['p',pts,o||{}]);return this;};
RDoc.prototype.text=function(x,y,s,o){o=Object.assign({font:'mr5',size:9.5,fill:RC.ink,align:'l'},o||{});this.p.ops.push(['t',x,y,String(s),o]);return this;};
RDoc.prototype.wedge=function(cx,cy,r0,r1,a0,a1,o){const pts=[],n=Math.max(4,Math.ceil((a1-a0)/.12));for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;pts.push([cx+r1*Math.cos(a),cy+r1*Math.sin(a)]);}for(let i=n;i>=0;i--){const a=a0+(a1-a0)*i/n;pts.push([cx+r0*Math.cos(a),cy+r0*Math.sin(a)]);}return this.poly(pts,Object.assign({close:1},o));};
RDoc.prototype.hatch=function(x,y,w,h,col){for(let d=-h;d<w;d+=4){const x1=Math.max(x,x+d),y1=y+h-(x1-x-d),x2=Math.min(x+w,x+d+h),y2=y+h-(x2-x-d);if(x2>x1)this.line(x1,Math.min(y+h,Math.max(y,y1)),x2,Math.min(y+h,Math.max(y,y2)),{stroke:col,lw:.8});}return this.rect(x,y,w,h,{stroke:col,lw:.5});};
/* layout helpers */
RDoc.prototype.h1=function(y,num,title){this.text(44,y,num,{font:'jb5',size:9,fill:RC.brass}).text(44,y+24,title,{font:'sg7',size:21});this.line(44,y+34,551,y+34,{stroke:RC.gold,lw:.7});return y+56;};
RDoc.prototype.h2=function(x,y,t){this.text(x,y,t,{font:'sg7',size:11.5});return y+16;};
RDoc.prototype.para=function(x,y,w,str,o){o=Object.assign({font:'mr5',size:9.5,fill:RC.ink2,lh:14},o||{});const words=String(str).split(' ');let ln='';words.forEach(wd=>{const t=ln?ln+' '+wd:wd;if(textW(t,o.font,o.size)>w&&ln){this.text(x,y,ln,o);y+=o.lh;ln=wd;}else ln=t;});if(ln){this.text(x,y,ln,o);y+=o.lh;}return y;};
RDoc.prototype.kv=function(x,y,w,rows){rows.forEach(r=>{this.text(x,y,r[0],{fill:RC.mut}).text(x+w,y,r[1],{font:'jb5',size:9.5,align:'r',fill:r[2]||RC.ink});this.line(x,y+5,x+w,y+5,{stroke:RC.line,lw:.4});y+=16;});return y+4;};
RDoc.prototype.stat=function(x,y,w,val,lab){this.rect(x,y,w,50,{fill:RC.card});this.line(x,y,x+10,y,{stroke:RC.brass,lw:1.2}).line(x,y,x,y+10,{stroke:RC.brass,lw:1.2}).line(x+w,y+50,x+w-10,y+50,{stroke:RC.brass,lw:1.2}).line(x+w,y+50,x+w,y+40,{stroke:RC.brass,lw:1.2});
  this.text(x+10,y+24,val,{font:'jb7',size:15}).text(x+10,y+40,lab,{size:8,fill:RC.mut});return this;};
RDoc.prototype.bars=function(x,y,w,rows,o){o=o||{};const lw=o.lw||118,vw=o.vw||70,bw=w-lw-vw-12;rows.forEach(r=>{this.text(x,y+7,r[0],{size:9});this.rect(x+lw,y,bw,8,{fill:RC.card});this.rect(x+lw,y,Math.max(.5,bw*clamp(r[1],0,1)),8,{fill:r[3]||RC.brass});if(r[4]!=null)this.line(x+lw+bw*clamp(r[4],0,1),y-2,x+lw+bw*clamp(r[4],0,1),y+10,{stroke:RC.ink,lw:1});this.text(x+w,y+7,r[2],{font:'jb5',size:9,align:'r'});y+=17;});return y+4;};
RDoc.prototype.table=function(x,y,cols,rows){let cx=x;cols.forEach(c=>{this.text(c.r?cx+c.w:cx,y,c.t,{size:8,fill:RC.mut,align:c.r?'r':'l',font:'mr7'});cx+=c.w+8;});this.line(x,y+5,cx-8,y+5,{stroke:RC.ink,lw:.6});y+=18;
  rows.forEach(r=>{let c2=x;cols.forEach((c,i)=>{this.text(c.r?c2+c.w:c2,y,r[i],{size:9,font:c.r?'jb5':'mr5',align:c.r?'r':'l'});c2+=c.w+8;});this.line(x,y+5,cx-8,y+5,{stroke:RC.line,lw:.4});y+=16;});return y+6;};

    facts:[['Forecast revenue',aedK(s.fc.gross)],['Projected profit',aedK(s.fc.profit)],['Waiting on you',String(n.length)]],acts:n.slice(0,2).map(x=>act(stripTags(x.title),goMod(x.id)))};}
  if(s.ph==='live'){const st=s.tb.st,g_=s.gates.slice().sort((a,b)=>b.wait-a.wait)[0],n=needsLive(s);
    return {text:N(fT(t))+'. '+N(n0(s.head))+' in the venue, '+P(s.head,VENUE.capacity)+' of capacity, arriving at '+N(Math.round(s.rate))+' a minute. '+N(st.seated)+' of '+N(s.tb.booked)+' tables seated, '+N(st.partial)+' partly in, '+N(st.noshow)+' no-shows. '+(f.collected>=f.breakeven?'Breakeven passed, '+AK(f.profit)+' clear.':AK(f.breakeven-f.collected)+' to breakeven.')+(g_.wait>=1?' Longest gate wait '+N(g_.wait.toFixed(0))+' min at '+esc(g_.g.label)+'.':' No queues at the gates.'),
      facts:[['On-site so far',aedK(f.onsite)],['Forecast for the night',aedK(s.fc.gross)]],acts:n.slice(0,2).map(x=>act(stripTags(x.title),goMod(x.id)))};}
  const p=postStats(W,s);return {text:N(n0(p.inAll))+' came, '+P(p.showRate,1,1)+' of everyone holding a ticket or seat. Revenue '+AK(p.gross)+', profit '+AK(p.profit)+', '+N(sgn(p.gross/p.fcGross-1))+' against the forecast at doors. '+N(p.above.length)+' tables finished above minimum, '+N(p.below.length)+' below, '+N(p.noshow.length)+' did not come.',
    facts:[['Peak in venue',n0(p.peak)+' at '+fT(p.peakAt)],['New guests captured',n0(p.newG)]],acts:[act('Open the report',()=>{Sheet.close(true);ON.report();},'doc'),act('Ops lessons',goMod('lessons'))]};}
function aNeeds(s){const n=s.ph==='live'?needsLive(s):s.ph==='pre'?needsPre(s):[];if(s.ph==='post'){const q=pendingQ(['refund','dispute']),fl=postStats(W,s).follow.filter(f=>!W.sent||!W.sent[f.id]);return {text:N(q.length)+' refunds and disputes are open and '+N(fl.length)+' follow-up messages have not gone out.',acts:[act('Refunds and disputes',goMod('queue')),act('Follow-ups',goMod('follow'))]};}
  if(!n.length)return {text:'Nothing is waiting on you right now.'};return {text:'Start with '+stripTags(n[0].title).replace(/^(\d)/,'the $1')+': '+stripTags(n[0].sub).replace(/^([A-Z])(?=[a-z])/,c=>c.toLowerCase())+'.'+(n.length>1?' Then '+N(n.length-1)+' more, most urgent first.':''),rows:n.slice(0,5).map(x=>[x.ic,x.tone,x.title,x.sub]),acts:n.slice(0,2).map(x=>act(stripTags(x.title),goMod(x.id)))};}
function aPace(s){if(s.ph!=='pre')return aSummary(s);const d=s.days.today,v=paceVs(s),left=Math.max(1,75-d),pv=PAST[0].gross*.74*blendCurve(Math.max(0,d-2)),wk=s.days.com[d]-s.days.com[Math.max(0,d-7)];
  return {text:'Presale is '+N(sgn(v))+' against target and '+N(sgn(s.days.com[d]/pv-1))+' against '+esc(PAST[0].name)+' at the same point. The last 7 days brought '+AK(wk)+'. To reach the presale target you need '+AK(Math.max(0,TARGET.presale-s.days.com[d])/left)+' a day for '+N(left)+' days.',acts:[act('Sales pace',goMod('pace')),act('Sell-through by tier',goMod('sell'))]};}
function aMoney(s){if(!isFin())return {text:'Venue financials are for managers. Your section is at '+P(s.sec[ROLES.host.sec].spend,s.sec[ROLES.host.sec].min)+' of its minimums.'};const f=s.fin;
  return {text:AK(f.collected)+' collected against a breakeven of '+AK(f.breakeven)+'. '+(f.collected>=f.breakeven?'You are '+AK(f.collected-f.breakeven)+' past it.':'Another '+AK(f.breakeven-f.collected)+' in cash gets you there; '+AK(f.committed)+' is committed but not collected.')+' Projected profit '+AK(s.fc.profit)+' on '+AK(s.fc.gross)+' revenue.',
    facts:[['Deposits',aedK(f.dep)],['Tickets',aedK(f.tix)],['On-site',aedK(f.onsite)],['Fixed costs',aedK(s.cost.fixed)]],acts:[act('Cost model',goMod('cost')),act('Forecast',goMod('forecast'))]};}
function aForecast(s){if(!isFin())return aMoney(s);const f=s.fc;return {text:'At this pace the night lands at '+AK(f.gross)+': tickets '+AK(f.tix)+', table minimums '+AK(f.tables)+', F&B '+AK(f.fb)+', door '+AK(f.door)+'. Costs at that revenue are '+AK(f.costs)+', so profit is '+AK(f.profit)+'.',acts:[act('Forecast detail',goMod('forecast'))]};}
function aDeposits(s){const t=s.t;if(s.ph==='pre'){const d=s.tb.depDue.slice().sort((a,b)=>a.at-b.at);if(!d.length)return {text:'Every deposit link has been paid.'};
    return {text:N(d.length)+' deposit links are unpaid, '+AK(sum(d,b=>b._m.depDue))+' in total. The oldest is '+esc(gName(d[0].booker))+' at '+esc(W.T[d[0].table].name)+', sent '+fAgo(t-d[0].at)+'.',rows:d.slice(0,5).map(b=>['card','warn',esc(gName(b.booker))+' · '+esc(W.T[b.table].name),N(aed(b._m.depDue))+' · sent '+fAgo(t-b.at)]),
      acts:[act('Remind all '+d.length,()=>{d.forEach(b=>Act.chaseDeposit(b));toast('Reminders sent to '+N(d.length)+' bookers on WhatsApp.');refresh(true);},'msg'),act('Deposits',goMod('chase'))]};}
  const l=s.tb.balDue.filter(b=>!mySec()||b.sec===mySec());if(!l.length)return {text:'No balances are overdue. Bills settle as tables close out.'};
  return {text:N(l.length)+' balances to collect, '+AK(sum(l,b=>b._m.balance))+'. '+N(l.filter(b=>b.declined).length)+' had a card declined.',rows:l.slice(0,5).map(b=>['card',b.declined?'bad':'warn',esc(W.T[tableAt(b,t)].name)+' · '+esc(gName(b.payer)),N(aed(b._m.balance))]),acts:[act('Show on the floor',goFloor('unpaid'),'floor'),act('Balances',goMod('balances'))]};}
function aNoShow(s){if(s.ph==='pre'){const ns=PAST[3];return {text:'Season 2 rates say about '+N(pct(ns.noShowGA,1,1))+' of tickets and '+N(pct(ns.noShowSeat,1,1))+' of table seats will not come, roughly '+N(n0(s.gaSold*ns.noShowGA+s.tb.seats*ns.noShowSeat))+' people.',acts:[act('No-show forecast',goMod('noshowp')),act('Tables at risk',()=>{Sheet.close(true);openIntel('risk');},'bulb')]};}
  if(s.ph==='post'){const p=postStats(W,s);return {text:N(p.noshow.length)+' booked tables did not come. '+AK(p.writeOff)+' of balances was written off.',acts:[act('Tables against minimum',goMod('tablesmin'))]};}
  const l=noShowTables(s),t=s.t,late=W.bookings.filter(b=>bActive(b,t)&&b._c&&!b._c.present&&t>b.arriveBy&&t<=b.arriveBy+VENUE.graceMin*MIN&&(!mySec()||b.sec===mySec()));
  return {text:(l.length?N(l.length)+' tables are past their hold: '+l.slice(0,3).map(b=>esc(W.T[tableAt(b,t)].name)).join(', ')+(l.length>3?' and more':'')+'.':'No table is past its hold.')+' '+N(late.length)+' more are late but still inside the '+VENUE.graceMin+' minute hold.',
    acts:[act('Show on the floor',goFloor('noshow'),'floor'),act('Release or offer',goMod('noshow'))]};}
function aGates(s){if(s.ph==='pre')return {text:'Gates 1 and 2 take GA at '+N(GATE.G1.cap+GATE.G2.cap)+' a minute together, Gate 3 tables and VIP at '+N(GATE.G3.cap)+', Gate 4 Backstage at '+N(GATE.G4.cap)+'. Season 2 peaked around '+N(PAST[3].peak)+', so the Early entry cut-off at 22:00 is the pinch point.',acts:[act('Readiness',goMod('ready'))]};
  if(s.ph==='post'){const p=postStats(W,s),w=p.gates.slice().sort((a,b)=>b.maxWait-a.maxWait)[0];return {text:'The longest queue was '+N(w.maxWait.toFixed(0))+' min at '+esc(w.g.label)+' around '+N(fT(w.at))+'.',acts:[act('Ops lessons',goMod('lessons'))]};}
  const g_=s.gates.slice().sort((a,b)=>b.load-a.load)[0];return {text:esc(g_.g.label)+' is the busiest at '+N(g_.rate.toFixed(0))+' of '+N(g_.g.cap)+' a minute'+(g_.wait>=1?', wait about '+N(g_.wait.toFixed(0))+' min.':', no queue.')+' Overall '+N(Math.round(s.rate))+' arriving against '+N(s.gateCap)+' a minute of throughput.'+(s.capAlert?' Open the overflow lane and move a scanner from Gate 4.':''),
    rows:s.gates.map(x=>['gate',x.load>.9?'bad':x.load>.75?'warn':'ok',esc(x.g.label),N(x.rate.toFixed(0))+'/min · wait '+N(x.wait.toFixed(0))+' min']),acts:[act('Gates',goMod('gates'),'gate')]};}
function aHead(s){if(s.ph==='pre')return {text:'Expect about '+N(n0(s.fc.att||TARGET.att))+' through the gates against a licence of '+N(n0(VENUE.capacity))+'.',acts:[act('No-show forecast',goMod('noshowp'))]};
  if(s.ph==='post'){const p=postStats(W,s);return {text:'Peak was '+N(n0(p.peak))+' at '+N(fT(p.peakAt))+', '+P(p.peak,VENUE.capacity)+' of capacity. Average stay '+N(fDur(p.dwell))+'.'};}
  const z=densityZones(s).sort((a,b)=>b.n/b.cap-a.n/a.cap)[0];return {text:N(n0(s.head))+' inside now, '+P(s.head,VENUE.capacity)+' of capacity. The busiest zone is '+esc(ZONES[z.id].l.toLowerCase())+' at '+P(z.n,z.cap)+'.',acts:[act('Show density on the floor',goFloor(null),'floor'),act('Headcount',goMod('head'))]};}
function aVip(s){const t=s.t,sec=mySec(),v=W.bookings.filter(b=>bActive(b,t)&&b.vip&&(!sec||b.sec===sec));
  if(s.ph==='pre')return {text:N(v.length)+' VIP and Backstage tables are booked'+(s.tb.pending?', with '+N(s.tb.pending)+' Backstage requests waiting for your answer':'')+'.',acts:s.tb.pending?[act('Answer requests',goMod('vipconf'),'star')]:[act('VIP on the floor',goFloor('vip'),'floor')]};
  const inn=v.filter(b=>b.seats[0].ar&&b.seats[0].ar<=t),next=v.filter(b=>!(b.seats[0].ar&&b.seats[0].ar<=t)).sort((a,b)=>a.arriveBy-b.arriveBy).slice(0,3);
  return {text:N(inn.length)+' of '+N(v.length)+' VIP tables have arrived.'+(next.length?' Still to come: '+next.map(b=>esc(gName(b.booker))+' (due '+N(fT(b.arriveBy))+')').join(', ')+'.':''),acts:[act('VIP arrivals',goMod('vipl'),'star'),act('VIP on the floor',goFloor('vip'),'floor')]};}
function aSources(s){if(!isFin())return {text:'Source and commission figures are for managers.'};const sl=srcSlices(s,'rev'),tot=sum(sl,x=>x.v)||1,pr=SOURCES.filter(x=>x.comm).map(x=>({x,d:s.src[x.id]})).filter(o=>o.d.n).sort((a,b)=>b.d.rev-a.d.rev);
  return {text:'Direct sells '+P(sl[0].v,tot)+' of revenue, promoters '+P(sl[1].v,tot)+', partners '+P(sl[2].v,tot)+'. Top promoter is '+esc(pr[0].x.label)+' with '+AK(pr[0].d.rev)+'.'+(s.ph==='post'?' Commission due '+AK(sum(pr,o=>o.d.comm))+'.':''),rows:pr.slice(0,5).map(o=>['users','',esc(o.x.label),N(n0(o.d.n))+' guests · '+(s.ph==='pre'?'showed '+pct(pastShow(o.x.id),1)+' last season':'show '+pct(o.d.in,o.d.n)),N(aedK(o.d.rev))]),
    acts:[act('Sources',goMod('sources'),'pie'),act('Promoter allocation',()=>{Sheet.close(true);openIntel('promo');},'bulb')]};}
function aWaitlist(s){const t=s.t,wl=W.waitlist.filter(w=>w.at<=t&&!w.offered);return {text:N(wl.length)+' parties are waiting with '+AK(sum(wl,w=>w.budget))+' in budgets. '+N(wl.filter(w=>G(w.g).crm===2).length)+' are Backstage List. '+N(s.tb.st.open||s.tb.open)+' tables are open.',acts:[act('Waitlist',goMod(s.ph==='live'?'waitl':'waitlist'))]};}
function aStaff(s){if(!s.staff)return {text:'Staff clock in from three hours before doors. The plan is '+N(sum(STAFF_PLAN,x=>x.plan))+' people across '+N(STAFF_PLAN.length)+' roles.'};const gaps=s.staff.filter(x=>x.in/x.sp.plan<.92);
  return {text:N(sum(s.staff,x=>x.in))+' of '+N(sum(s.staff,x=>x.sp.plan))+' staff are clocked in.'+(gaps.length?' Short on '+gaps.map(x=>esc(x.sp.role.toLowerCase())+' ('+x.in+' of '+x.sp.plan+')').join(', ')+'.':' Every role is at plan.'),acts:[act('Staff coverage',goMod('staff'),'user')]};}
function aClaims(s){return {text:N(n0(s.tb.claimed))+' of '+N(n0(s.tb.seats))+' table seats have a named guest, and '+P(s.tk.named,s.tk.named+s.tk.unnamed)+' of tickets are claimed. Unclaimed seats are the slowest scans at the door.',acts:[act('Nudge tables under half',()=>{ON.nudgeAll();},'bell'),act('Seat claims on the floor',goFloor('claims'),'floor')]};}
function aPreorders(s){const t=s.t;if(s.ph==='live'){const l=[];W.bookings.forEach(b=>{if(!bActive(b,t))return;b.orders.forEach(o=>{if(o.pre&&o.at<=t&&(!o.del||o.del>t)&&!o.opDel)l.push({b,o});});});
    return {text:l.length?N(l.length)+' pre-orders are on their way. The oldest has been '+N(fDur(t-l.sort((a,b)=>a.o.at-b.o.at)[0].o.at))+' at '+esc(W.T[tableAt(l[0].b,t)].name)+'.':'Every pre-order fired tonight has been delivered.',acts:[act('Pre-orders on the floor',goFloor('prepend'),'floor')]};}
  const n=W.bookings.filter(b=>bActive(b,t)&&b.pre.some(p=>p.at<=t)).length;return {text:N(n)+' tables have pre-ordered, '+AK(s.tb.pre)+' at menu value. Guests saved '+AK(s.tb.saved)+' by ordering early.',acts:[act('Pre-orders on the floor',goFloor('pre'),'floor')]};}
function aFraud(s){const a=liveAlerts(s.t);return {text:a.length?N(a.length)+' ticket alerts are open, mostly duplicate codes. The first scan always stands; the second is stopped.':'No ticket alerts are open.',acts:a.length?[act('Ticket alerts',goMod('fraud'),'shield')]:[]};}
function aIncidents(s){const l=W.incidents.filter(x=>x.at<=s.t);const last=l[l.length-1];return {text:N(l.length)+' entries in the log tonight.'+(last?' Latest at '+N(fT(last.at))+', '+esc(last.zone)+': '+esc(last.note):''),acts:[act('Incident log',goMod('incidents'),'flag')]};}
function aSpend(s){const t=s.t,sec=mySec();if(s.ph==='pre')return {text:AK(s.tb.minSum)+' of table minimums are booked.'};
  if(s.ph==='post'){const p=postStats(W,s);return {text:N(p.below.length)+' tables finished below minimum, '+N(p.above.length)+' above. The gap on the ones below is '+AK(sum(p.below,b=>Math.max(0,b._m.min-b._m.spend)))+'.',acts:[act('Tables against minimum',goMod('tablesmin'))]};}
  const behind=W.bookings.filter(b=>bActive(b,t)&&b._c&&b._c.present&&!b.comp&&(!sec||b.sec===sec)&&b._m.spend<b._m.min*.6&&t-Math.min.apply(null,b.seats.filter(x=>x.ar).map(x=>x.ar))>90*MIN);
  return {text:'Tables in the venue have spent '+P(s.tb.spendArr,s.tb.minArr)+' of their minimums. '+N(behind.length)+' have been seated over 90 minutes and are under 60%.',rows:behind.slice(0,5).map(b=>['tdown','warn',esc(W.T[tableAt(b,t)].name)+' · '+esc(gName(b.booker)),N(aedK(b._m.spend))+' of '+N(aedK(b._m.min))+' · host '+esc(b.host)]),acts:[act('Spend vs minimums',goMod('minspend'))]};}
function aSell(s){return {text:'Tickets: '+GA.map((x,i)=>esc(x.label)+' '+(s.tk.sold[i]>=x.alloc*.985?'sold out':n0(s.tk.sold[i])+' of '+n0(x.alloc))).join(', ')+'. Tables: '+N(s.tb.booked)+' of '+N(s.tb.total)+' booked, '+N(s.tb.held)+' held, '+N(s.tb.open)+' open.',acts:[act('Sell-through',goMod('sell')),act('Price check',()=>{Sheet.close(true);openIntel('price');},'bulb')]};}
function aQueue(s){const q=pendingQ(s.ph==='post'?['refund','dispute']:['transfer','refund']);return {text:q.length?N(q.length)+' requests are open, '+AK(sum(q,x=>x.amt||0))+' in question.':'The transfer and refund queue is clear.',acts:q.length?[act('Open the queue',goMod('queue'),'swap')]:[]};}
function aReady(s){const c=checkState(W,s.t),open=c.filter(x=>!x.done);return {text:N(c.length-open.length)+' of '+N(c.length)+' readiness items are done.'+(open.length?' Next: '+esc(open[0].c.label.toLowerCase())+', '+esc(open[0].c.who)+'.':''),acts:[act('Readiness',goMod('ready'),'flag')]};}
function aSeason(s){const r=seasonRows().filter(x=>x.status!=='tba'&&x.status!=='soon');return {text:'Season 3 so far: '+r.map(x=>esc(x.ev.short)+' '+(x.status==='post'?AK(x.s.fin.gross):'forecast '+AK(x.s.fc.gross))).join(', ')+'. Season 2 averaged '+AK(PAST[3].gross)+' a night.',acts:[act('Season',()=>{Sheet.close(true);if(UI.device==='atlas'){UI.atlas='season';Atlas.render();}else ON.season();},'cal')]};}
function aMySec(s){const k=ROLES.host.sec,x=s.sec[k],t=s.t,next=W.bookings.filter(b=>bActive(b,t)&&b.sec===k&&!(b._c&&b._c.present)).sort((a,b)=>a.arriveBy-b.arriveBy).slice(0,3);
  return {text:esc(SECTIONS[k].label)+': '+N(x.booked)+' tables booked'+(s.ph==='pre'?'':', '+N(x.seated)+' seated, '+N(x.in)+' of '+N(x.guests)+' guests in, '+P(x.spend,x.min)+' of minimums spent')+'.'+(next.length?' Next to arrive: '+next.map(b=>esc(gName(b.booker))+' ('+N(b.party)+')').join(', ')+'.':''),acts:[act('My section on the floor',goFloor(null,k),'floor')]};}
function aTable(s,T){const t=s.t,e=s.ix[T.id];if(!canTables())return {text:'Table details are for hosts and managers.'};
  if(!e)return {text:esc(T.name)+' is open. Minimum '+AK(T.min)+', seats '+N(T.cap)+'.',acts:[act('Open '+T.name,goTable(T.id),'floor')]};
  if(e.st==='held')return {text:esc(T.name)+' is held for '+esc(e.h.who)+' ('+esc(e.h.kind.toLowerCase())+') for another '+N(fDur(e.h.until-t))+'.',acts:[act('Open '+T.name,goTable(T.id),'floor')]};
  const b=e.b,m=money(b,t),c=seatCounts(b,t);if(e.st==='requested')return {text:esc(gName(b.booker))+' has requested '+esc(T.name)+' for '+N(b.party)+'. It is waiting for your answer.',acts:[act('Answer requests',goMod('vipconf'),'star')]};
  return {text:esc(T.name)+': '+esc(gName(b.booker))+'’s party of '+N(b.party)+', host '+esc(b.host)+'. '+(s.ph==='pre'?N(c.claimed)+' seats claimed, ':N(c.present)+' in, '+N(c.seated)+' seated, ')+'spend '+AK(m.spend)+' against '+AK(m.min)+'.'+(m.balance&&s.ph!=='pre'?' Balance '+AK(m.balance)+'.':m.depDue?' Deposit of '+AK(m.depDue)+' not paid.':''),
    acts:[act('Open '+T.name,goTable(T.id),'floor')]};}
function aGuest(s,gi){const gst=G(gi),r=guestRecs(gi,s.t),t=s.t;let where='';
  if(r.seats.length){const x=r.seats[0];where=(canTables()?esc(W.T[tableAt(x.b,t)].name)+', seat '+N(x.n):'a table guest')+'. '+(x.st&&x.st<=t?'Seated at '+N(fT(x.st))+'.':x.ar&&x.ar<=t?'Through the gate at '+N(fT(x.ar))+', not seated yet.':'Not arrived.');}
  else if(r.tix.length){const x=r.tix[0];where=['Early entry','Second wave','VIP standing','Door ticket','Guest list','Promoter list'][x.k]+'. '+(x.sc&&x.sc<=t?'In at '+N(fT(x.sc))+'.':'Not in yet.');}
  return {text:esc(gst.n)+', '+crmLabel(gst).toLowerCase()+(gst.v?', '+N(gst.v)+' visits':'')+'. '+(where||'No ticket for this event.')+(gst.prefs?' Note: '+esc(gst.prefs[0])+'.':''),acts:[act('Guest card',()=>openGuest(gi),'user')]};}
function aFallback(){return {text:'I can answer from this event’s data: money, pace, gates, tables, guests, VIPs, no-shows, promoters, staff, readiness. Ask about a table by name, like “Gold R12”, or a guest by name.'};}

const fromI=r=>({text:r.sum,rows:r.rows,acts:r.acts,focus:r.focus});
function aInvite(s){return s.ph==='post'?fromI(iInvite(s)):s.ph==='pre'?fromI(iUpsell(s)):aVip(s);}
function aRisk(s){return s.ph==='post'?aNoShow(s):fromI(iRisk(s));}
function aLeak(s){return s.ph==='live'?fromI(iLeak(s)):s.ph==='pre'?fromI(iUpsell(s)):aSpend(s);}
function aRelease(s){return s.ph==='pre'?fromI(iRelease(s)):aSell(s);}
function aPrice(s){return s.ph==='pre'?fromI(iPrice(s)):aSpend(s);}

    W.tix.forEach(x=>{if(x.at>t||x.g<0||seen[x.g]||(x.st===1&&x.stAt<=t))return;seen[x.g]=1;rows.push({g:x.g,k:'g',d:['Early entry','Second wave','VIP standing','Door ticket','Guest list','Promoter list'][x.k],inn:x.sc&&x.sc<=t});});
    const fl=UI.gf||'all',F={all:()=>true,bl:r=>W.guests[r.g].crm===2,nw:r=>W.guests[r.g].crm===0,tb:r=>r.k==='t',id:r=>!W.guests[r.g].idv,inn:r=>r.inn};let q=UI.gq||'';
    v.innerHTML='<div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:18px 20px 0;gap:12px"><div class="atitle" style="margin:0"><div><h2>Guests</h2><p>'+N(n0(rows.length))+' named guests on this event. Tier, history, preferences, consent and ID in one card.</p></div></div>'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="srch" style="flex:1;min-width:240px">'+I('search',18)+'<input id="gq" placeholder="Name or phone" value="'+esc(q)+'" autocomplete="off"></label><div class="chips">'+[['all','Everyone'],['bl','Backstage List'],['nw','New'],['tb','At tables'],['id','ID not verified'],['inn','In the venue']].map(x=>'<button class="chip '+(fl===x[0]?'on':'')+'" data-act="gf" data-f="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'+
      '<div class="vlist" id="gl" style="border-top:1px solid var(--line2)"></div></div>';
    const gl=$('#gl',v),RH=52;let list=[];const filt=()=>{const ql=q.toLowerCase().trim();list=rows.filter(r=>F[fl](r)&&(!ql||W.guests[r.g].n.toLowerCase().includes(ql)||W.guests[r.g].ph.replace(/\s/g,'').includes(ql.replace(/\s/g,''))));gl.scrollTop=0;draw();};
    const draw=()=>{const a=Math.max(0,Math.floor(gl.scrollTop/RH)-4),b=Math.min(list.length,a+Math.ceil(gl.clientHeight/RH)+8);let h='<div style="height:'+(list.length*RH)+'px"></div>';
      for(let i=a;i<b;i++){const r=list[i],gst=W.guests[r.g];h+='<button class="vrow row tap" style="top:'+(i*RH)+'px;height:'+RH+'px;grid-template-columns:36px 1.4fr 1fr 1.2fr auto;padding:0 4px" data-act="guest" data-g="'+r.g+'"><div class="ri '+(gst.crm===2?'neu':'')+'">'+initials(gst.n)+'</div><div class="rt"><b>'+esc(gst.n)+'</b></div><div class="rt"><span>'+crmLabel(gst)+(gst.v?' · '+gst.v+' visits':'')+'</span></div><div class="rt"><span>'+esc(r.d)+'</span></div><div class="ra">'+(gst.idv?'':tag('warn','id','ID'))+(r.inn?tag('ok','check','In'):pill('mut','Not in'))+'</div></button>';}
      gl.innerHTML=h||empty('No guests match.');};
    gl.addEventListener('scroll',()=>requestAnimationFrame(draw));$('#gq',v).addEventListener('input',e=>{q=UI.gq=e.target.value;filt();});filt();},
  season(v,s){const rows=seasonRows();v.innerHTML='<div class="agrid"><div class="atitle"><div><h2>'+esc(VENUE.season)+'</h2><p>Ten nights at the harbour. Every event against the same price sheet and the same floor.</p></div></div>'+
    '<section class="panel c12"><table class="tbl"><thead><tr><th>Event</th><th>Date</th><th>Status</th><th class="r">Tickets</th><th class="r">Tables</th><th class="r">Booked</th><th class="r">Forecast</th><th class="r">Profit, projected</th></tr></thead><tbody>'+
      rows.map(r=>r.status==='tba'?'<tr style="opacity:.5"><td>To be announced</td><td class="n">'+fDS(r.ev.doors)+' '+g(r.ev.doors).getUTCFullYear()+'</td><td>'+pill('mut','Not on sale')+'</td><td class="r">—</td><td class="r">—</td><td class="r">—</td><td class="r">—</td><td class="r">—</td></tr>'
        :'<tr class="tap" data-act="pickEv" data-id="'+r.ev.id+'"><td><b'+(r.ev.id===W.ev.id?' class="gold"':'')+'>'+esc(r.ev.head)+'</b></td><td class="n">'+fD(r.ev.doors)+'</td><td>'+(r.status==='soon'?tag('mut','clock','Presale in '+fDur(r.Wd.ON-now())):r.status==='pre'?tag('neu',null,'On sale'):r.status==='live'?tag('ok','check','Live'):pill('mut','Closed'))+'</td><td class="r n">'+pct(r.ga,1)+'</td><td class="r n">'+pct(r.tb,1)+'</td><td class="r n">'+aedK(r.s.fin.gross)+'</td><td class="r n">'+(r.status==='soon'?'—':aedK(r.s.fc.gross))+'</td><td class="r n">'+(r.status==='soon'?'—':aedK(r.s.fc.profit))+'</td></tr>').join('')+'</tbody></table></section>'+
    '<section class="panel c6"><div class="ph"><h4>Season 2, for comparison</h4></div><table class="tbl"><thead><tr><th>Event</th><th class="r">Attendance</th><th class="r">Show</th><th class="r">Revenue</th><th class="r">Profit</th></tr></thead><tbody>'+PAST.map(r=>'<tr><td><b>'+esc(r.name)+'</b><br><span class="mut">'+esc(r.date)+'</span></td><td class="r n">'+n0(r.att)+'</td><td class="r n">'+pct(r.show,1)+'</td><td class="r n">'+aedK(r.gross)+'</td><td class="r n">'+aedK(r.profit)+'</td></tr>').join('')+'</tbody></table></section>'+
    '<section class="panel c6"><div class="ph"><h4>Pace, '+esc(W.ev.short)+'</h4><span>against target and last season</span></div>'+paceChart(s)+'</section></div>';},
  report(v,s){if(s.ph==='pre'){v.innerHTML='<div class="agrid"><div class="atitle"><div><h2>Report</h2><p>The post-event report builds itself from the night. It is available once doors open and final after close.</p></div></div><section class="panel c6"><div class="ph"><h4>What it will contain</h4></div><div class="rows">'+['Executive summary','Financials','Attendance','Tables','Sources and promoters','Guests','Operations','Follow-ups and recommendations','Appendix'].map((x,i)=>row(String(i+1),'',x,'','')).join('')+'</div><button class="btn" data-act="clock">'+I('clock',18)+'Move the clock to preview</button></section></div>';return;}
    _rep=buildReport();v.innerHTML='<div class="agrid"><div class="atitle"><div><h2>Post-event report</h2><p>'+N(_rep.pages.length)+' pages, A4, vector. '+(s.ph==='live'?'The night is still running, so this is a snapshot.':'Version '+N(_rep.ver)+', data as of '+N(fDT(s.t))+' GST.')+'</p></div><button class="btn pri" data-act="reportDl">'+I('share',18)+'Download and share PDF</button></div><div class="c12"><div class="rp-pages" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">'+_rep.pages.map(pageSVG).join('')+'</div></div></div>';}
};
ON.av=el=>{UI.atlas=el.dataset.v;Atlas.render();};
ON.gf=el=>{UI.gf=el.dataset.f;Atlas.render();};
ON.testTickets=()=>{const p=phase(),t=now();let list;
  if(p==='pre')list=practiceSet().filter(x=>!x.dup);
  else if(p==='live'){list=scanQueue(6).map(x=>{const r=W.byRef[x.ref],g=r&&r.g>=0?W.guests[r.g]:null;return {l:(g?g.n:'Unnamed ticket')+(r&&r.b&&typeof r.b==='object'?' · '+W.T[r.b.table].name:''),s:'Due at the gate '+fT(x.at),ref:x.ref};});
    const dup=W.tix.find(x=>x.sc&&x.sc<=t&&x.g>=0),rf=W.tix.find(x=>x.st===1);if(dup)list.push({l:'Already scanned in',s:'Should be stopped as a duplicate',ref:dup.ref});if(rf)list.push({l:'Refunded ticket',s:'Should be refused',ref:rf.ref});list.push({l:'Unknown code',ref:'XX0000'});}
  else list=W.tix.filter(x=>!x.sc&&x.g>=0&&!x.st).slice(0,5).map(x=>({l:W.guests[x.g].n,s:'Never scanned in',ref:x.ref}));
  Sheet.open({title:'Test tickets',sub:'Open BUBL OPS on a second screen, show these, and scan them with the phone. '+(p==='pre'?'Practice: nothing counts.':p==='live'?'Live: an admitted ticket counts on the phone that scans it.':'Audit mode.'),tall:true,
    body:()=>list.map(x=>'<div class="card tq"><div class="qrbox">'+QR.svg('https://bubl.app/ushuaia-dxb/t/'+x.ref,132)+'</div><div><b>'+esc(x.l)+'</b>'+(x.s?'<div class="mut" style="font-size:12.5px;margin-top:3px">'+esc(x.s)+'</div>':'')+'<div class="n mut" style="margin-top:4px">'+esc(x.ref)+'</div></div></div>').join('')});};
ON.practiceSheet=()=>{const ps=practiceSet();Sheet.open({title:'Practice tickets',sub:'Scan these with a handheld in Practice mode. Nothing counts.',tall:true,body:()=>ps.map(p=>'<div class="card" style="display:flex;gap:14px;align-items:center"><div class="qrbox" style="margin:0;padding:8px;border-radius:10px">'+QR.svg('https://bubl.app/ushuaia-dxb/t/'+p.ref,104)+'</div><div><b>'+esc(p.l)+'</b><div class="n mut" style="margin-top:4px">'+esc(p.ref)+'</div></div></div>').join('')});};

   ============================================================ */
function boot(){
  Object.keys(FONTS).forEach(k=>{try{const ff=new FontFace(FAM[k.slice(0,2)],b64bytes(FONTS[k].b64).buffer,{weight:k[2]==='5'?'100 599':'600 900'});ff.load().then(x=>document.fonts.add(x)).catch(()=>{});}catch(_){}});
  loadEvent(defaultEvent(now()));const app=$('#app');app.dataset.phase=phase();UI._ph=phase();layout();
  let lw=window.innerWidth;window.addEventListener('resize',()=>{const w=window.innerWidth;if((w>=900)!==(lw>=900)){lw=w;layout();}else if(UI.tab==='floor'||UI.atlas==='floor'){lw=w;}});
  setInterval(tick,1000);
  /* the offline helper sits next to this file. It only controls this page, never the other builds in the folder */
  try{const pg=location.pathname.split('/').pop();if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&window.top===window&&/\.html?$/i.test(pg))
    navigator.serviceWorker.register('ushuaia-ops-sw.js?page='+encodeURIComponent(decodeURIComponent(pg)),{scope:'./'+pg}).catch(()=>{});}catch(_){}
  /* test hook: lets the build verify every phase without touching the UI */
  window.BUBL={UI,Clock,S,jump:(ms,sp)=>{Clock.set(ms,sp==null?1:sp);UI.phaseOv=null;_snap=null;applyPhase();},world:()=>W,open:openMod,pdf:()=>pdfBytes(buildReport()),ON,Floor,Agent,TBar,openIntel,setTab:k=>setTab(k),Scan};
}
document.addEventListener('DOMContentLoaded',boot);
